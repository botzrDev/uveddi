[package]
name = "excessive-comments-plugin"
version = "1.0.0"
edition = "2021"
description = "Example WASM plugin that detects excessive comments in code"
authors = ["Uveddi Team"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.30.0", features = ["macros"] }
arrow = { version = "53.0.0", default-features = false }
arrow-ipc = { version = "53.0.0", features = ["ipc_streaming"], default-features = false }
arrow-schema = { version = "53.0.0", default-features = false }
arrow-array = { version = "53.0.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"

[package.metadata.component]
package = "uveddi:plugins"

[package.metadata.component.target]
path = "../../../wit/plugin.wit"
world = "code-analyzer"