name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        run: cargo install cargo-edit

      - name: Update dependencies
        run: |
          # Update Cargo dependencies
          cargo update
          
          # Check for outdated dependencies
          cargo install cargo-outdated
          cargo outdated --exit-code 1 || echo "Some dependencies are outdated"

      - name: Run tests with updated dependencies
        run: |
          cargo test --all-features
          cargo clippy --all-features -- -D warnings

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Rust dependencies"
          title: "chore: weekly dependency updates"
          body: |
            ## Automated Dependency Updates
            
            This PR contains weekly dependency updates generated automatically.
            
            ### Changes
            - Updated Cargo.lock with latest compatible versions
            - All tests pass with updated dependencies
            
            ### Review Checklist
            - [ ] Check for any breaking changes in updated dependencies
            - [ ] Verify all tests pass
            - [ ] Review security advisories for updated crates
            
            Auto-generated by GitHub Actions.
          branch: chore/dependency-updates
          delete-branch: true