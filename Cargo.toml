# All dependencies are now pinned to specific versions for reproducible builds.

[package]
name = "uveddi"
version = "0.9.0-alpha"
edition = "2021"
resolver = "2"
description = "A Rust-based code analysis and exploration tool"
authors = ["Phillip Austin Green <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/botzrDev/uveddi"
keywords = ["code", "analysis", "tools", "visualization", "uveddi"]
categories = ["development-tools"]
readme = "README.md"

# Workspace dependency management for version consistency
[workspace.dependencies]
# Core serialization - single version across workspace
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"

# Async runtime - unified tokio ecosystem
tokio = { version = "1.47", features = ["full"] }
futures = "0.3.31"

# Error handling - standardized approach
anyhow = "1.0.86"
thiserror = "2.0.16"

# Logging - unified logging infrastructure
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

# HTTP client - single version with needed features
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }

# Cryptography - consistent versions
rustls = "0.23.31"

# Date/time handling
chrono = { version = "0.4.41", features = ["serde"] }

# System directories
dirs = "5.0"

# String similarity for command suggestions
levenshtein = "1.0"

# Feature flags for modular compilation - Optimized for build performance
[features]
# ==================== CORE FEATURE SETS ====================
# Default profile for most users
default = ["standard"]

# ==================== LEGACY PROFILES (DEPRECATED) ====================
# DEPRECATED: Use 'minimal' instead
dev-ultra-minimal = ["dep:rusqlite", "dep:bincode"]

# DEPRECATED: Use 'minimal' instead
dev-minimal = ["dev-ultra-minimal", "dep:rayon"]

# DEPRECATED: Use 'standard' instead
dev-core = ["dev-minimal", "dep:tokio-stream", "dep:async-stream", "prometheus"]

# DEPRECATED: Use 'standard' instead
dev-full = ["dev-core", "tree-sitter"]

# ==================== LANGUAGE PARSING ====================
# Individual language support (granular control)
rust-lang = ["dep:tree-sitter-rust"]
python-lang = ["dep:tree-sitter-python"]
javascript-lang = ["dep:tree-sitter-javascript"]
typescript-lang = ["dep:tree-sitter-typescript"]

# ==================== LANGUAGE PACKS ====================
# Backend languages (Rust, Python)
languages-core = ["rust-lang", "python-lang"]

# Frontend languages (JavaScript, TypeScript)
languages-web = ["javascript-lang", "typescript-lang"]

# All supported languages
languages-all = ["languages-core", "languages-web"]

# Full tree-sitter support (all languages)
tree-sitter = [
    "dep:tree-sitter",
    "languages-all"
]

# ==================== PRODUCTION BUILDS (LEGACY - DEPRECATED) ====================
# DEPRECATED: Use 'full' instead
production = [
    "tree-sitter",
    "security",
    "memory-optimization",
    "web-full",
    "tui",
    "wasm-plugins",
    "prometheus",
    "dep:rayon",
    "dep:tokio-stream",
    "dep:async-stream",
    "dep:rusqlite",
    "dep:bincode"
]

# DEPRECATED: Use 'full' (configure security posture at runtime)
production-secure = [
    "tree-sitter",
    "memory-optimization",
    "web-full",
    "tui",
    "wasm-plugins",
    "prometheus",
    "dep:rayon",
    "dep:tokio-stream",
    "dep:async-stream",
    "dep:rusqlite",
    "dep:bincode"
]

# ==================== NEW SIMPLIFIED PROFILES ====================
# Essential functionality - fastest builds, minimal dependencies
minimal = ["dep:rusqlite", "dep:bincode", "dep:rayon", "dep:tokio-stream", "dep:async-stream"]

# Recommended for development - includes parsing and monitoring
standard = ["minimal", "tree-sitter", "engine-integration", "prometheus", "ast-cache", "analysis-cache"]

# Production-ready - all capabilities enabled
full = ["standard", "security", "memory-optimization", "web", "tui", "wasm-plugins"]

# ==================== SPECIALIZED FEATURES ====================
# Caching systems
ast-cache = ["dep:notify"]
analysis-cache = ["dep:notify"]
# Metrics and monitoring
prometheus = ["dep:prometheus"]

# Cryptography and security
crypto-minimal = []
crypto-full = ["dep:rustls", "dep:ring", "dep:argon2", "dep:subtle"]
security = ["crypto-full", "web", "dep:casbin", "dep:oauth2", "dep:openidconnect", "dep:jsonwebtoken", "dep:vaultrs", "dep:config"]

# Web infrastructure
web = ["dep:tower_governor", "dep:tokio-tungstenite"]

# Legacy web features (deprecated)
web-client = ["web"]  # DEPRECATED: Use 'web' instead
web-server = ["web"]  # DEPRECATED: Use 'web' instead
web-full = ["web"]    # DEPRECATED: Use 'web' instead

# User interfaces
tui = ["dep:ratatui", "dep:crossterm", "dep:tui-input"]

# Plugin and extension systems
wasm-plugins = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:cap-std", "dep:wit-bindgen"]

# Performance optimizations
memory-optimization = ["dep:mimalloc", "dep:bumpalo", "dep:bumpalo-herd", "dep:memmap2", "dep:rkyv"]

# AI and analysis features
ai = []
local-ai = ["ai"]
image-rendering = []

# Engine refactor integration
engine-integration = ["tree-sitter"]

# ==================== TESTING AND DEVELOPMENT ====================
# Chaos engineering and load testing
chaos = ["dep:fail", "dep:statrs", "dep:ndarray-stats"]
regression-detection = ["dep:changepoint", "dep:linfa", "dep:influxdb2"]
sla-monitoring = ["dep:metrics-exporter-prometheus", "dep:tokio-metrics"]

# ==================== CONVENIENCE COMBINATIONS ====================
# (Removed legacy/convenience aggregations: zero-cost, full-featured, enterprise, alpha)

# ==================== INTERNAL FLAGS (for dependencies) ====================
# Keep only flags used for cfg(feature) in code
mimalloc = []
graphql-api = []
yaml = []
reqwest = []

[dependencies]
# Use workspace dependencies for consistency
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }
levenshtein = { workspace = true }
rustls = { workspace = true, optional = true }
ring = { version = "0.17.14", optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Project-specific dependencies
rusqlite = { version = "0.37.0", features = ["bundled"], optional = true }
tokio-stream = { version = "0.1.17", features = ["fs"], optional = true }
async-stream = { version = "0.3", optional = true }
bincode = { version = "1.3.3", optional = true }
clap = { version = "4.5.4", features = ["derive", "env"] }
# Unified logging with tracing (replaces log + env_logger)
# log = "0.4.21"        # Replaced by tracing
# env_logger = "0.11.3"  # Replaced by tracing-subscriber
regex = "1.11.2"
rayon = { version = "1.8.0", optional = true }
# AST parsing dependencies (optional via features)
tree-sitter = { version = "0.25.8", optional = true }
tree-sitter-rust = { version = "0.24.0", optional = true }
tree-sitter-python = { version = "0.23.6", optional = true }
tree-sitter-javascript = { version = "0.23.1", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
# HTML escaping for fallback diagram rendering
html-escape = "0.2"
# Additional tracing appender
tracing-appender = "0.2"
# Time handling for logging timestamps
time = { version = "0.3", features = ["formatting", "local-offset"] }
prometheus = { version = "0.14.0", optional = true }
rand = "0.9.2"
# LRU cache for bounded memory management (UV-152)
lru = "0.16.0"
# Concurrent HashMap for thread-safe caching
dashmap = "6.1.0"
# Template engine for diagram generation
tera = "1.19.1"
# Base64 encoding/decoding for image handling
base64 = "0.22.0"
# File system event watching for cache invalidation
notify = { version = "7.0", optional = true }
# MD5 hashing for input validation
md5 = "0.8.0"
# UUID generation for component IDs
uuid = { version = "1.8.0", features = ["v4", "v5", "serde"] }
url = "2.5"
walkdir = "2.5.0"
ignore = "0.4.22"
toml = "0.9.5"
sha2 = "0.10.0"
async-trait = "0.1.88"
petgraph = "0.8.2"
color-eyre = "0.6"
ndarray = "0.16.1"
strum = { version = "0.27.2", features = ["derive"] }
strum_macros = "0.27.2"
pastey = "0.1"
# WASM plugin system dependencies (optional via features)
wasmtime = { version = "36.0.1", features = ["component-model"], optional = true }
wasmtime-wasi = { version = "36.0.1", optional = true }
cap-std = { version = "3.0", optional = true }
arrow = { version = "56.1.0", optional = true }
arrow-ipc = { version = "56.1.0", optional = true }
arrow-schema = { version = "56.1.0", optional = true }
arrow-array = { version = "56.1.0", optional = true }
wit-bindgen = { version = "0.44.0", optional = true }
axum = { version = "0.8.4", features = ["ws", "macros"] }
tokio-tungstenite = { version = "0.27.0", optional = true } # Updated to latest version
criterion = { version = "0.7.0", features = ["html_reports"] }
sysinfo = "0.37.0"
# Memory optimization dependencies (UV-210)
# High-performance allocator for memory optimization
mimalloc = { version = "0.1", optional = true }
# Arena allocation for temporary objects
bumpalo = { version = "3.19", features = ["collections", "boxed"], optional = true }
bumpalo-herd = { version = "0.1", optional = true }
# Memory mapping for large data structures
memmap2 = { version = "0.9", optional = true }
# Zero-copy serialization for AST cache optimization
rkyv = { version = "0.8.11", optional = true }
# CPU count for pool sharding
num_cpus = "1.16"
# Lazy static for global instances
lazy_static = "1.4"

# TUI Core Dependencies (optional via tui feature)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.29", optional = true }
tui-input = { version = "0.14", optional = true }

# Input validation framework
validator = { version = "0.20.0", features = ["derive"] }

# Configuration Management (for TUI settings)
confy = "1.0"

# State Persistence (for TUI state)
persisted = "1.0"

# Pattern matching for file filtering
glob = "0.3.1"

# MessagePack serialization removed - using bincode for binary serialization
# rmp-serde = "1.1"  # Redundant with bincode

# Compression for diagram caching
flate2 = "1.0"

# Chaos Engineering and Load Testing Dependencies (UV-82)
# Failpoint injection for chaos engineering
fail = { version = "0.5", optional = true }
# Statistical analysis for performance regression detection
statrs = { version = "0.18.0", optional = true }
ndarray-stats = { version = "0.6.0", optional = true }
# Change point detection for regression analysis
changepoint = { version = "0.14.2", optional = true }
# Machine learning for anomaly detection
linfa = { version = "0.7", optional = true }
# InfluxDB client for time series data
influxdb2 = { version = "0.5", optional = true }
# Prometheus metrics exporter
metrics-exporter-prometheus = { version = "0.17.2", optional = true }
# Tokio runtime metrics
tokio-metrics = { version = "0.4.4", optional = true }
# Additional metrics and observability
metrics = "0.24.2"
metrics-tracing-context = "0.18.1"

# Security and RBAC Dependencies (UV-247)
# HTTP middleware and services
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "limit", "timeout", "fs", "trace"] }
tower_governor = { version = "0.8.0", optional = true }
# Database (using existing rusqlite instead of sqlx to avoid conflicts)
# Authorization
casbin = { version = "2.1", optional = true }
# Authentication - updated for security (resolves RSA timing attack vulnerability)
oauth2 = { version = "5.0", optional = true }
openidconnect = { version = "4.0.1", optional = true }  # SECURITY WARNING: RUSTSEC-2023-0071 (RSA Marvin Attack) - use production-secure feature for production deployments
jsonwebtoken = { version = "9.3", optional = true }
# Security
argon2 = { version = "0.5", optional = true }
blake3 = "1.5"
# ring already defined in workspace dependencies
# Constant-time operations for timing attack protection
subtle = { version = "2.5", optional = true }
# HashiCorp Vault integration
vaultrs = { version = "0.7", optional = true }
# Configuration
config = { version = "0.15.14", optional = true }
streaming-iterator = "0.1.9"

# Knowledge Library Dependencies (UV-335)
# Perfect Hash Functions for O(1) lookups
phf = { version = "0.13.1", features = ["macros"] }
tempfile = "3.8"

# Terminal detection for TUI validation
is-terminal = "0.4"

# TUI binary removed - TUI now integrated into main CLI as 'uveddi tui'
# [[bin]]
# name = "tui_test"
# path = "src/bin/tui_test.rs"
