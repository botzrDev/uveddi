# Production configuration for Uveddi Analysis Engine
# Optimized for performance, reliability, and observability

# Server configuration
server:
  host: "0.0.0.0"
  port: 8080
  workers: 8  # Auto-adjust based on container resources

# Cache configuration - optimized for production workloads
cache:
  # Multi-layer cache configuration
  layers:
    ast:
      max_entries: 50000
      ttl_seconds: 3600
      memory_limit_mb: 2048
      eviction_policy: "lru_with_ttl"

    analysis:
      max_entries: 25000
      ttl_seconds: 1800
      memory_limit_mb: 1024
      eviction_policy: "adaptive"

    graph:
      max_entries: 10000
      ttl_seconds: 7200
      memory_limit_mb: 512
      eviction_policy: "lru"

  # Performance tuning
  compression:
    enabled: true
    algorithm: "lz4"
    threshold_bytes: 1024

  persistence:
    enabled: true
    directory: "/app/data/cache"
    sync_interval_seconds: 300
    recovery_on_startup: true

# Database configuration
database:
  type: "sqlite"
  connection_string: "/app/data/analysis.db"
  connection_pool:
    max_connections: 20
    min_connections: 5
    connection_timeout_seconds: 30

  performance:
    wal_mode: true
    synchronous: "normal"
    cache_size_kb: 102400  # 100MB SQLite cache

# Analysis engine configuration
analysis:
  max_concurrent_files: 16
  timeout_seconds: 600

  # Language support
  languages:
    - rust
    - python
    - javascript
    - typescript

  # Detector configuration
  detectors:
    security:
      enabled: true
      severity_threshold: "medium"

    architecture:
      enabled: true
      anti_patterns: true
      circular_dependencies: true

    performance:
      enabled: true
      memory_analysis: true

# Monitoring and observability
monitoring:
  metrics:
    enabled: true
    endpoint: "/metrics"
    format: "prometheus"

  tracing:
    enabled: true
    service_name: "uveddi-analysis-engine"
    endpoint: "http://jaeger-collector:14268/api/traces"
    sample_rate: 0.1

  logging:
    level: "info"
    format: "json"
    output: "stdout"

    # Structured logging
    fields:
      service: "uveddi"
      version: "0.9.0-alpha"
      environment: "production"

# Security configuration
security:
  authentication:
    enabled: true
    jwt_secret_file: "/app/secrets/jwt_secret"
    token_expiry_seconds: 3600

  rate_limiting:
    requests_per_minute: 1000
    analysis_requests_per_minute: 10
    websocket_connections_per_ip: 5

  cors:
    enabled: true
    allowed_origins: ["*"]  # Configure appropriately for production
    allowed_methods: ["GET", "POST", "PUT", "DELETE"]
    allowed_headers: ["Content-Type", "Authorization"]

# Resource limits
resources:
  memory:
    heap_limit_mb: 4096
    cache_limit_mb: 3072

  cpu:
    analysis_threads: 8
    io_threads: 4

  disk:
    temp_directory: "/tmp/uveddi"
    max_temp_size_mb: 1024
    cleanup_interval_seconds: 3600

# High availability
ha:
  health_check:
    interval_seconds: 30
    timeout_seconds: 10
    failure_threshold: 3

  graceful_shutdown:
    timeout_seconds: 30
    drain_connections: true

  circuit_breaker:
    failure_threshold: 5
    timeout_seconds: 60
    half_open_max_calls: 3