[package]
name = "uveddi"
version = "0.1.0"
edition = "2024"
description = "A Rust-based code analysis and exploration tool"
authors = ["Phillip Austin Green <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/botzrDev/uveddi"
keywords = ["code", "analysis", "tools", "visualization", "uveddi"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
rusqlite = { version = "0.29", features = ["chrono"] }
refinery = { version = "0.8", features = ["rusqlite"] }
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.10"
regex = "1.10"
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-python = "0.20"
tree-sitter-javascript = "0.20"
reqwest = { version = "0.11", features = ["json"] }
walkdir = "2.3"
async-trait = "0.1"
md5 = "0.7"
toml = "0.8"
uveddi-plugin-api = { path = "plugins/uveddi-plugin-api" }

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
mockall = "0.11"
mockito = "0.31"
assert_cmd = "2.0"
predicates = "2.1"
serde_json = "1.0"
