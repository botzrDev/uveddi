apiVersion: v1
kind: ConfigMap
metadata:
  name: uveddi-config
  namespace: uveddi
  labels:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: uveddi-platform
data:
  # Application configuration
  RUST_LOG: "info"
  CACHE_DIR: "/app/cache"
  LOG_DIR: "/app/logs"
  
  # Service configuration
  API_PORT: "8080"
  METRICS_PORT: "9090"
  RENDERING_PORT: "3001"
  
  # Performance tuning
  MAX_CONNECTIONS: "1000"
  WORKER_THREADS: "4"
  REQUEST_TIMEOUT: "30s"
  
  # Security settings
  ENABLE_CORS: "false"
  SECURE_HEADERS: "true"
  
  # Monitoring configuration
  PROMETHEUS_ENDPOINT: "0.0.0.0:9090"
  HEALTH_CHECK_PATH: "/health"
  READY_CHECK_PATH: "/ready"
  
  # Feature flags
  FEATURES: "production"
  
  # Production configuration file
  production.toml: |
    [analysis]
    languages = ["rust", "python", "javascript", "typescript"]
    max_depth = 10
    timeout_seconds = 300
    
    [thresholds]
    god_object_threshold = 100
    max_function_lines = 50
    cyclomatic_complexity_threshold = 10
    
    [performance]
    max_memory_mb = 1024
    worker_threads = 4
    cache_size_mb = 256
    
    [security]
    enable_sandbox = true
    max_file_size_mb = 50
    allowed_extensions = ["rs", "py", "js", "ts", "json", "yaml", "toml"]
    
    [monitoring]
    enable_metrics = true
    metrics_port = 9090
    log_level = "info"
    
    [database]
    connection_pool_size = 10
    query_timeout_seconds = 30
    
    [api]
    cors_enabled = false
    rate_limit_per_minute = 100
    max_request_size_mb = 10