[package]
name = "security-scanner-plugin"
version = "1.0.0"
edition = "2021"
authors = ["Uveddi Security Team <security@uveddi.dev>"]
license = "MIT"
description = "Comprehensive security vulnerability scanner plugin for Uveddi"
repository = "https://github.com/uveddi/plugins/security-scanner"
readme = "README.md"
keywords = ["security", "vulnerability", "static-analysis", "compliance"]
categories = ["development-tools", "cryptography"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.30.0"

[package.metadata.component]
package = "uveddi:security-scanner"

[package.metadata.component.dependencies]
"wasi:cli" = { path = "wit/deps/cli" }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1