apiVersion: v1
kind: Service
metadata:
  name: uveddi-api
  namespace: uveddi
  labels:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: uveddi-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: api
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: uveddi-api-headless
  namespace: uveddi
  labels:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: uveddi-platform
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  clusterIP: None
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: api
  publishNotReadyAddresses: true
---
apiVersion: v1
kind: Service
metadata:
  name: uveddi-rendering
  namespace: uveddi
  labels:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: rendering
    app.kubernetes.io/part-of: uveddi-platform
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3001
    targetPort: 3001
    protocol: TCP
  selector:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: rendering