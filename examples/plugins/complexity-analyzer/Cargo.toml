[package]
name = "complexity-analyzer-plugin"
version = "1.0.0"
edition = "2021"
authors = ["Uveddi Team <team@uveddi.dev>"]
license = "MIT"
description = "Code complexity analysis plugin for Uveddi - calculates multiple complexity metrics"
repository = "https://github.com/uveddi/plugins/complexity-analyzer"
readme = "README.md"
keywords = ["complexity", "metrics", "maintainability", "static-analysis"]
categories = ["development-tools", "algorithms"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.30.0"

[package.metadata.component]
package = "uveddi:complexity-analyzer"

[package.metadata.component.dependencies]
"wasi:cli" = { path = "wit/deps/cli" }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1