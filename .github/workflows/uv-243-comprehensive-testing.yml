name: UV-243 Comprehensive Testing & Documentation

on:
  push:
    branches: [main, develop, community-release-clean]
  pull_request:
    branches: [main, develop, community-release-clean]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  comprehensive-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy, llvm-tools-preview

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install testing tools
      run: |
        cargo install cargo-llvm-cov
        cargo install cargo-nextest
        cargo install cargo-audit
        cargo install cargo-udeps --locked

    - name: Install documentation tools
      run: |
        cargo install mdbook
        npm install -g @mermaid-js/mermaid-cli
        npm install -g swagger-parser-cli

    - name: Check code formatting
      run: cargo fmt -- --check

    - name: Run Clippy lints
      run: cargo clippy --all-features --all-targets -- -D warnings

    - name: Check for unused dependencies
      run: cargo udeps --all-features

    - name: Run comprehensive test suite
      run: |
        # Unit tests with coverage
        cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info

        # Integration tests
        cargo test --test '*' --all-features --timeout 300

        # Performance benchmarks (if available)
        if [ -f "benches/observability_performance.rs" ]; then
          cargo bench --bench observability_performance
        fi

    - name: Validate coverage threshold
      run: |
        # Extract coverage percentage
        COVERAGE=$(cargo llvm-cov --summary-only --all-features | grep -o '[0-9]*\.[0-9]*%' | head -1 | sed 's/%//')
        echo "Current coverage: $COVERAGE%"
        
        # Check if coverage meets 90% threshold
        if (( $(echo "$COVERAGE < 90" | bc -l) )); then
          echo "❌ Coverage $COVERAGE% below 90% threshold"
          echo "COVERAGE_GATE=FAILED" >> $GITHUB_ENV
          exit 1
        fi
        echo "✅ Coverage $COVERAGE% meets 90% threshold"
        echo "COVERAGE_GATE=PASSED" >> $GITHUB_ENV
        echo "COVERAGE_VALUE=$COVERAGE" >> $GITHUB_ENV

    - name: Security audit
      run: |
        # Run security audit
        if cargo audit; then
          echo "✅ No security vulnerabilities"
          echo "SECURITY_GATE=PASSED" >> $GITHUB_ENV
        else
          echo "❌ Security vulnerabilities detected"
          echo "SECURITY_GATE=FAILED" >> $GITHUB_ENV
          exit 1
        fi

    - name: Generate and validate documentation
      run: |
        # Generate Rust documentation
        cargo doc --all-features --no-deps --document-private-items

        # Build mdbook documentation
        if mdbook build docs/; then
          echo "✅ mdbook documentation builds successfully"
          echo "DOCS_GATE=PASSED" >> $GITHUB_ENV
        else
          echo "❌ mdbook documentation build failed"
          echo "DOCS_GATE=FAILED" >> $GITHUB_ENV
          exit 1
        fi

        # Validate OpenAPI specification
        if swagger-parser validate docs/api/openapi.yaml; then
          echo "✅ OpenAPI specification valid"
          echo "OPENAPI_GATE=PASSED" >> $GITHUB_ENV
        else
          echo "❌ OpenAPI specification invalid"
          echo "OPENAPI_GATE=FAILED" >> $GITHUB_ENV
          exit 1
        fi

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: lcov.info
        flags: unittests
        name: codecov-umbrella

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: |
          lcov.info
          target/doc/
          docs/book/

    - name: Quality Gates Summary
      if: always()
      run: |
        echo "## 🎯 UV-243 Quality Gates Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Gate | Status | Details |" >> $GITHUB_STEP_SUMMARY
        echo "|------|---------|---------|" >> $GITHUB_STEP_SUMMARY
        echo "| Coverage (≥90%) | ${{ env.COVERAGE_GATE || 'FAILED' }} | ${{ env.COVERAGE_VALUE || 'N/A' }}% |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Audit | ${{ env.SECURITY_GATE || 'FAILED' }} | Vulnerability scan |" >> $GITHUB_STEP_SUMMARY
        echo "| Documentation | ${{ env.DOCS_GATE || 'FAILED' }} | mdbook build |" >> $GITHUB_STEP_SUMMARY
        echo "| OpenAPI Spec | ${{ env.OPENAPI_GATE || 'FAILED' }} | Specification validation |" >> $GITHUB_STEP_SUMMARY

    - name: Deploy documentation (main branch only)
      if: github.ref == 'refs/heads/main' && success()
      run: |
        # Prepare documentation for deployment
        mkdir -p ./gh-pages
        cp -r docs/book/* ./gh-pages/
        cp -r target/doc ./gh-pages/api-docs
        
        echo "✅ Documentation prepared for deployment"
        echo "DEPLOYMENT_READY=true" >> $GITHUB_ENV

  performance-validation:
    runs-on: ubuntu-latest
    needs: comprehensive-testing
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    
    - name: Run performance regression checks
      run: |
        # Run performance benchmarks and compare with baseline
        if [ -f "benches/observability_performance.rs" ]; then
          cargo bench --bench observability_performance > current_bench.txt
          echo "✅ Performance benchmarks completed"
        else
          echo "⚠️ No performance benchmarks found"
        fi

  mutation-testing:
    runs-on: ubuntu-latest
    needs: comprehensive-testing
    if: github.event_name == 'pull_request'
    timeout-minutes: 45
    
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-mutants
      run: cargo install cargo-mutants
    
    - name: Run mutation testing (limited scope)
      run: |
        # Run mutation testing on critical modules only
        cargo mutants --test-timeout 60 --package uveddi -- \
          --manifest-path Cargo.toml \
          --timeout 60 \
          --output mutants.json || echo "⚠️ Some mutants survived"

  integration-validation:
    runs-on: ubuntu-latest
    needs: comprehensive-testing
    
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    
    - name: Run integration tests with external services
      env:
        REDIS_URL: redis://localhost:6379
      run: |
        # Run integration tests that require external services
        cargo test --test integration -- --nocapture
        echo "✅ Integration tests with services completed"