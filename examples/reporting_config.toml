# UV-246 Automated Reporting System Configuration
# Example configuration file showing all available options

[system]
enabled = true
log_level = "info"
max_concurrent_reports = 5
report_timeout_seconds = 300
cleanup_retention_days = 30

[templates]
template_cache_enabled = true
template_cache_ttl_seconds = 3600

[templates.default_branding]
organization_name = "Uveddi Development Team"
logo_url = "https://example.com/logo.png"
custom_footer = "© 2025 Uveddi Project. Generated by Automated Reporting System."

[templates.default_branding.color_scheme]
primary = "#007bff"
secondary = "#6c757d"
accent = "#28a745"
text = "#212529"

[storage]
report_archive_path = "./reports"
max_reports_in_memory = 1000
archive_retention_days = 90
compression_enabled = true
encryption_enabled = false

[monitoring]
metrics_enabled = true
health_check_interval_seconds = 60
performance_tracking = true

[monitoring.error_alerting]
enabled = true
alert_channels = ["ops-alerts"]
failure_threshold = 3
escalation_timeout_minutes = 30

[monitoring.audit_logging]
enabled = true
log_level = "info"
log_format = "Json"
retention_days = 30

[distribution]
[distribution.default_retry_config]
max_retries = 3
initial_delay_seconds = 300
backoff_multiplier = 2.0
max_delay_seconds = 3600

[distribution.email]
default_subject_template = "[Uveddi] {subject}"
rate_limit_per_hour = 100

[distribution.email.smtp]
server = "smtp.gmail.com"
port = 587
username = "reports@uveddi.com"
password = "app-specific-password"
use_tls = true
from_address = "reports@uveddi.com"
from_name = "Uveddi Reports"

[distribution.slack]
default_webhook = "main"
rate_limit_per_minute = 10

[distribution.slack.message_format]
use_rich_formatting = true
include_charts = false
max_message_length = 4000
truncate_strategy = "Smart"

[distribution.slack.webhooks.main]
webhook_url = "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
default_channel = "#reports"
username = "Uveddi Bot"
icon_emoji = ":robot_face:"

[distribution.slack.webhooks.alerts]
webhook_url = "https://hooks.slack.com/services/YOUR/ALERT/WEBHOOK"
default_channel = "#alerts"
username = "Uveddi Alerts"
icon_emoji = ":warning:"

# Distribution Channels
[distribution.channels.dev-email]
enabled = true
priority = "Medium"
channel_type = { Email = { address = "developers@uveddi.com" } }

[distribution.channels.qa-email]
enabled = true
priority = "High"
channel_type = { Email = { address = "qa-team@uveddi.com", subject_template = "[QA Report] {subject}" } }

[distribution.channels.management-email]
enabled = true
priority = "High"
channel_type = { Email = { address = "management@uveddi.com", subject_template = "[Executive Summary] {subject}" } }

[distribution.channels.dev-slack]
enabled = true
priority = "Medium"
channel_type = { Slack = { webhook_name = "main", channel = "#dev-reports" } }

[distribution.channels.qa-slack]
enabled = true
priority = "High"
channel_type = { Slack = { webhook_name = "main", channel = "#qa-reports", username = "QA Bot" } }

[distribution.channels.exec-slack]
enabled = true
priority = "Critical"
channel_type = { Slack = { webhook_name = "main", channel = "#executive-reports", username = "Executive Bot", icon_emoji = ":chart_with_upwards_trend:" } }

[distribution.channels.ops-alerts]
enabled = true
priority = "Critical"
channel_type = { Slack = { webhook_name = "alerts", channel = "#ops-alerts" } }

# Report Jobs
[[reports]]
name = "Daily Developer Health Report"
description = "Daily health summary for developers"
enabled = true
report_type = "DailyHealth"
stakeholder_role = "Developer"
distribution_channels = ["dev-email", "dev-slack"]

[reports.schedule]
enabled = true
timezone = "UTC"
schedule_type = { Daily = { times = ["09:00"] } }

[reports.schedule.retry_config]
max_retries = 3
initial_delay_seconds = 300
backoff_multiplier = 2.0
max_delay_seconds = 1800

[[reports]]
name = "Daily QA Health Report"
description = "Daily health summary for QA team"
enabled = true
report_type = "DailyHealth"
stakeholder_role = "QaEngineer"
distribution_channels = ["qa-email", "qa-slack"]

[reports.schedule]
enabled = true
timezone = "UTC"
schedule_type = { Daily = { times = ["08:30"] } }

[reports.schedule.retry_config]
max_retries = 3
initial_delay_seconds = 300
backoff_multiplier = 2.0
max_delay_seconds = 1800

[[reports]]
name = "Weekly Trend Analysis"
description = "Weekly performance and trend analysis for QA leads"
enabled = true
report_type = "WeeklyTrend"
stakeholder_role = "QaLead"
distribution_channels = ["qa-email", "qa-slack", "management-email"]

[reports.schedule]
enabled = true
timezone = "UTC"
schedule_type = { Weekly = { days = ["Monday"], time = "10:00" } }

[reports.schedule.retry_config]
max_retries = 5
initial_delay_seconds = 600
backoff_multiplier = 2.0
max_delay_seconds = 3600

[[reports]]
name = "Monthly Executive Summary"
description = "Monthly high-level quality and performance summary"
enabled = true
report_type = "MonthlyExecutive"
stakeholder_role = "Executive"
distribution_channels = ["management-email", "exec-slack"]

[reports.schedule]
enabled = true
timezone = "UTC"
schedule_type = { Monthly = { days = [1], time = "08:00" } }

[reports.schedule.retry_config]
max_retries = 5
initial_delay_seconds = 900
backoff_multiplier = 2.0
max_delay_seconds = 7200

[reports.template_overrides]
branding = { organization_name = "Uveddi Executive Team" }
custom_sections = ["roi_analysis", "strategic_metrics"]
metrics_focus = ["business_impact", "quality_trends"]

[[reports]]
name = "Failure Analysis Report"
description = "Automated failure analysis for critical issues"
enabled = true
report_type = "FailureAnalysis"
stakeholder_role = "QaEngineer"
distribution_channels = ["qa-email", "dev-email", "qa-slack"]

[reports.schedule]
enabled = true
timezone = "UTC"
schedule_type = { Cron = { expression = "0 */6 * * *" } } # Every 6 hours

[reports.schedule.retry_config]
max_retries = 3
initial_delay_seconds = 180
backoff_multiplier = 1.5
max_delay_seconds = 900

[reports.filters]
failure_categories = ["critical", "regression"]
min_duration_ms = 1000

[[reports]]
name = "Performance Optimization Report"
description = "Bi-weekly performance optimization recommendations"
enabled = true
report_type = "PerformanceOptimization"
stakeholder_role = "Developer"
distribution_channels = ["dev-email", "dev-slack"]

[reports.schedule]
enabled = true
timezone = "UTC"
schedule_type = { Weekly = { days = ["Monday", "Thursday"], time = "14:00" } }

[reports.schedule.retry_config]
max_retries = 3
initial_delay_seconds = 300
backoff_multiplier = 2.0
max_delay_seconds = 1800

[reports.filters]
min_duration_ms = 500
test_suites = ["integration", "performance"]