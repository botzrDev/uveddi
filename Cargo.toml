# All dependencies are now pinned to specific versions for reproducible builds.

[package]
name = "uveddi"
version = "0.1.0"
edition = "2021"
description = "A Rust-based code analysis and exploration tool"
authors = ["Phillip Austin Green <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/botzrDev/uveddi"
keywords = ["code", "analysis", "tools", "visualization", "uveddi"]
categories = ["development-tools"]
readme = "README.md"

# Feature flags for modular compilation
[features]
default = ["analysis", "local-ai"]
# Core analysis features
analysis = ["tree-sitter", "tree-sitter-rust", "tree-sitter-python", "tree-sitter-javascript", "tree-sitter-typescript"]
# AI provider features
ai = ["openai", "anthropic", "ollama"]
openai = ["reqwest"]
anthropic = ["reqwest"] 
ollama = ["reqwest"]
local-ai = ["ollama"]
cloud-ai = ["openai", "anthropic"]
# Backend integration
backend = ["reqwest"]
# Plugin system (experimental)
plugins = []
# Minimal build for CI/embedded use
minimal = []

[dependencies]
rusqlite = { version = "0.31.0", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }
tokio = { version = "1.37.0", features = ["full"] }
tokio-stream = { version = "0.1.15", features = ["fs"] }
futures = "0.3"
async-stream = "0.3"
chrono = { version = "0.4.38", features = ["serde"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
bincode = "1.3.3"
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0.61"
anyhow = "1.0.86"
clap = { version = "4.5.4", features = ["derive", "env"] }
log = "0.4.21"
env_logger = "0.11.3"
regex = "1.10"
# AST parsing dependencies (optional via features)
tree-sitter = { version = "0.22.6", optional = true }
tree-sitter-rust = { version = "0.21.0", optional = true }
tree-sitter-python = { version = "0.21.0", optional = true }
tree-sitter-javascript = { version = "0.21.0", optional = true }
tree-sitter-typescript = { version = "0.21.0", optional = true }
# HTTP client for AI providers (optional via features)
reqwest = { version = "0.12.4", features = ["json"], optional = true }
walkdir = "2.5.0"
ignore = "0.4.22"
# WASM dependencies temporarily disabled to debug runtime error
# wasmtime = "21.0.1"
# wasmtime-wasi = "21.0.1"
# wit-bindgen = "0.25.0"
# cap-std = "3.0.0"
# wasi-common = "21.0.1"
toml = "0.8.0"
sha2 = "0.10.0"
uveddi-plugin-api = { path = "plugins/uveddi-plugin-api" }
async-trait = "0.1.88"
md5 = "0.8.0"
petgraph = "0.8.2"
color-eyre = "0.6"
rayon = "1.10"


[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
mockall = "0.11"
mockito = "0.31"
assert_cmd = "2.0"
predicates = "2.1"
serde_json = "1.0"
criterion = { version = "0.5.1", features = ["async_tokio"] }
