apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-monitor
  namespace: uveddi-production
  labels:
    app: health-monitor
    component: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: health-monitor
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: health-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: health-monitor
subjects:
- kind: ServiceAccount
  name: health-monitor
  namespace: uveddi-production

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-monitor
  namespace: uveddi-production
  labels:
    app: health-monitor
    component: monitoring
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-monitor
  template:
    metadata:
      labels:
        app: health-monitor
        component: monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: health-monitor
      containers:
      - name: health-monitor
        image: health-monitor:latest
        ports:
        - containerPort: 8090
          name: metrics
        - containerPort: 8080
          name: health
        env:
        - name: MONITOR_NAMESPACE
          value: "uveddi-production"
        - name: MONITOR_INTERVAL
          value: "30"
        - name: HEALTH_CHECK_TIMEOUT
          value: "10"
        - name: ALERT_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: monitoring-secrets
              key: alert-webhook-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: health-monitor-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: health-monitor-config
  namespace: uveddi-production
  labels:
    app: health-monitor
    component: monitoring
data:
  config.yaml: |
    monitoring:
      interval: 30s
      timeout: 10s
      retries: 3
      
    targets:
      - name: "uveddi-blue"
        endpoint: "http://uveddi-blue.uveddi-production.svc.cluster.local/health"
        critical: true
        timeout: 5s
        
      - name: "uveddi-green"
        endpoint: "http://uveddi-green.uveddi-production.svc.cluster.local/health"
        critical: true
        timeout: 5s
        
      - name: "database"
        endpoint: "http://uveddi-active.uveddi-production.svc.cluster.local/health/database"
        critical: true
        timeout: 10s
        
      - name: "ai-providers"
        endpoint: "http://uveddi-active.uveddi-production.svc.cluster.local/health/ai-providers"
        critical: false
        timeout: 15s
        
    alerts:
      - name: "service-down"
        condition: "target.status != 'healthy'"
        severity: "critical"
        cooldown: "5m"
        
      - name: "high-response-time"
        condition: "target.response_time > 5000"
        severity: "warning"
        cooldown: "2m"
        
      - name: "deployment-unhealthy"
        condition: "target.healthy_replicas < target.desired_replicas"
        severity: "critical"
        cooldown: "1m"
        
    notifications:
      webhook:
        enabled: true
        url: "${ALERT_WEBHOOK_URL}"
        timeout: 10s
        retries: 3
        
      slack:
        enabled: true
        channel: "#uveddi-alerts"
        username: "HealthMonitor"
        
    thresholds:
      response_time_warning: 2000   # ms
      response_time_critical: 5000  # ms
      error_rate_warning: 0.05      # 5%
      error_rate_critical: 0.10     # 10%
      
    auto_actions:
      restart_unhealthy_pods: true
      scale_on_high_load: true
      failover_on_critical_failure: true

---
apiVersion: v1
kind: Service
metadata:
  name: health-monitor
  namespace: uveddi-production
  labels:
    app: health-monitor
    component: monitoring
spec:
  selector:
    app: health-monitor
  ports:
  - name: metrics
    port: 8090
    targetPort: 8090
  - name: health
    port: 8080
    targetPort: 8080
  type: ClusterIP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: health-monitor
  namespace: uveddi-production
  labels:
    app: health-monitor
    component: monitoring
spec:
  selector:
    matchLabels:
      app: health-monitor
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: uveddi-health-alerts
  namespace: uveddi-production
  labels:
    app: uveddi
    component: alerts
spec:
  groups:
  - name: uveddi.health
    interval: 30s
    rules:
    - alert: UveddiServiceDown
      expr: up{job="uveddi"} == 0
      for: 1m
      labels:
        severity: critical
        service: uveddi
      annotations:
        summary: "Uveddi service is down"
        description: "Uveddi service {{ $labels.instance }} has been down for more than 1 minute."
        runbook_url: "https://docs.uveddi.com/runbooks/service-down"
        
    - alert: UveddiHighResponseTime
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="uveddi"}[5m])) > 2
      for: 5m
      labels:
        severity: warning
        service: uveddi
      annotations:
        summary: "Uveddi high response time"
        description: "Uveddi 95th percentile response time is {{ $value }}s for more than 5 minutes."
        
    - alert: UveddiHighErrorRate
      expr: rate(http_requests_total{job="uveddi",status=~"5.."}[5m]) / rate(http_requests_total{job="uveddi"}[5m]) > 0.05
      for: 3m
      labels:
        severity: warning
        service: uveddi
      annotations:
        summary: "Uveddi high error rate"
        description: "Uveddi error rate is {{ $value | humanizePercentage }} for more than 3 minutes."
        
    - alert: UveddiDatabaseConnectionFailed
      expr: uveddi_database_connection_status == 0
      for: 1m
      labels:
        severity: critical
        service: uveddi
        component: database
      annotations:
        summary: "Uveddi database connection failed"
        description: "Uveddi cannot connect to the database for more than 1 minute."
        runbook_url: "https://docs.uveddi.com/runbooks/database-connection"
        
    - alert: UveddiMemoryUsageHigh
      expr: container_memory_working_set_bytes{pod=~"uveddi-.*"} / container_spec_memory_limit_bytes > 0.8
      for: 5m
      labels:
        severity: warning
        service: uveddi
      annotations:
        summary: "Uveddi memory usage high"
        description: "Uveddi pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }} for more than 5 minutes."
        
    - alert: UveddiReplicasNotReady
      expr: kube_deployment_status_replicas{deployment=~"uveddi-.*"} - kube_deployment_status_replicas_ready{deployment=~"uveddi-.*"} > 0
      for: 3m
      labels:
        severity: warning
        service: uveddi
      annotations:
        summary: "Uveddi replicas not ready"
        description: "Deployment {{ $labels.deployment }} has {{ $value }} replicas not ready for more than 3 minutes."

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-check-runner
  namespace: uveddi-production
  labels:
    app: health-check-runner
    component: monitoring
spec:
  schedule: "*/5 * * * *"  # Every 5 minutes
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: health-checker
            image: curlimages/curl:latest
            command:
            - /bin/sh
            - -c
            - |
              set -e
              
              echo "$(date): Starting health checks..."
              
              # Check Blue environment
              if curl -f --max-time 10 http://uveddi-blue.uveddi-production.svc.cluster.local/health; then
                echo "✅ Blue environment healthy"
              else
                echo "❌ Blue environment unhealthy"
                exit 1
              fi
              
              # Check Green environment
              if curl -f --max-time 10 http://uveddi-green.uveddi-production.svc.cluster.local/health; then
                echo "✅ Green environment healthy"
              else
                echo "❌ Green environment unhealthy"
                exit 1
              fi
              
              # Check Active service
              if curl -f --max-time 10 http://uveddi-active.uveddi-production.svc.cluster.local/health; then
                echo "✅ Active service healthy"
              else
                echo "❌ Active service unhealthy"
                exit 1
              fi
              
              echo "$(date): All health checks passed"
              
          restartPolicy: OnFailure
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1