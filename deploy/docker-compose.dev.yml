# Development Docker Compose for Uveddi
# Provides easy multi-service development environment with hot reload

version: '3.8'

services:
  # PostgreSQL Database (optional for production features)
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: uveddi
      POSTGRES_USER: uveddi
      POSTGRES_PASSWORD: uveddi_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uveddi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - uveddi-network

  # Redis Cache (for rendering service scaling)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass redis_dev
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - uveddi-network

  # Rendering Service with development features
  rendering-service:
    build:
      context: ./rendering-service
      target: development
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MAX_WORKERS=2
      - REDIS_URL=redis://:redis_dev@redis:6379
      - LOG_LEVEL=debug
    volumes:
      - ./rendering-service:/app:ro
      - /app/node_modules
      - rendering_cache:/app/cache
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - uveddi-network

  # API Server (Node.js)
  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=development
      - PORT=8000
      - DATABASE_URL=postgresql://uveddi:uveddi_dev@database:5432/uveddi
      - REDIS_URL=redis://:redis_dev@redis:6379
      - RENDERING_SERVICE_URL=http://rendering-service:3001
      - CORS_ORIGIN=http://localhost:8001,http://localhost:3000
      - LOG_LEVEL=debug
    volumes:
      - ./api-server:/app:ro
      - /app/node_modules
      - ./reports:/app/reports:ro
      - api_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      rendering-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - uveddi-network

  # Frontend Development Server
  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      - NODE_ENV=development
      - PORT=8001
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app:ro
      - /app/node_modules
      - frontend_dist:/app/dist
    ports:
      - "8001:8001"
    depends_on:
      api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 30s
    restart: unless-stopped
    networks:
      - uveddi-network

  # Nginx Reverse Proxy (optional for production-like setup)
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - frontend_dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - api-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - uveddi-network
    profiles:
      - production

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - uveddi-network
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - uveddi-network
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  rendering_cache:
  api_logs:
  frontend_dist:
  prometheus_data:
  grafana_data:

networks:
  uveddi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
