# ==============================================================================
# ⚠️ IMPORTANT NOTES
# ==============================================================================

# 1. This configuration file must be named 'uveddi.toml' in project root
# 2. Many options shown here are aspirational and don't work yet
# 3. Build flags affect which features are available:
#    - Without tree-sitter: No anti-pattern detection
#    - Without wasm-plugins: No plugin support
#    - Without local-ai: No AI features
# 4. Always test configuration changes thoroughly
# 5. Check logs (RUST_LOG=debug) when settings seem ignored

# ==============================================================================
# 🔍 VALIDATION
# ==============================================================================

# To validate this configuration:
# uveddi config validate --file uveddi.toml
#
# To see current configuration:
# uveddi config show
#
# Note: The validate command itself may have bugs and approve invalid configs