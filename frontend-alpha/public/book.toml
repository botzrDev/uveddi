[book]
title = "Uveddi Documentation"
authors = ["Uveddi Contributors"]
description = "AI-Powered Code Analysis That Stays Private - Comprehensive guide to using Uveddi for architectural analysis"
language = "en"
multilingual = false
src = "."

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/botzrDev/uveddi"
edit-url-template = "https://github.com/botzrDev/uveddi/edit/main/docs/{path}"
site-url = "https://docs.uveddi.dev/"
favicon = "assets/brand/favicons/favicon.png"
additional-css = ["assets/brand/colors/palette.css", "assets/custom-styles.css"]
additional-js = ["assets/custom-scripts.js"]

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true

[output.html.fold]
enable = true
level = 1

[output.html.print]
enable = true

[preprocessor.links]
renderers = ["html"]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html.playground]
editable = true
copyable = true
copy-js = true
