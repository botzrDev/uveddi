# All dependencies are now pinned to specific versions for reproducible builds.

[package]
name = "uveddi"
version = "0.9.0"
edition = "2021"
resolver = "2"
description = "A Rust-based code analysis and exploration tool"
authors = ["Phillip Austin Green <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/botzrDev/uveddi"
keywords = ["code", "analysis", "tools", "visualization", "uveddi"]
categories = ["development-tools"]
readme = "README.md"

# Workspace dependency management for version consistency
[workspace.dependencies]
# Core serialization - single version across workspace
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"

# Async runtime - unified tokio ecosystem
tokio = { version = "1.47", features = ["full"] }
futures = "0.3.31"

# Error handling - standardized approach
anyhow = "1.0.86"
thiserror = "1.0.69"

# Logging - unified logging infrastructure
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }

# HTTP client - single version with needed features
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }

# Cryptography - consistent versions
rustls = "0.23.31"
ring = "0.17.14"

# Date/time handling
chrono = { version = "0.4.39", features = ["serde"] }

# Feature flags for modular compilation
[features]
default = ["tree-sitter", "security", "memory-optimization"]
# Chaos engineering and load testing
chaos = ["fail", "statrs", "ndarray-stats"]
# Performance regression detection with genetic algorithms
regression-detection = ["changepoint", "linfa", "influxdb2"]
# SLA monitoring and validation
sla-monitoring = ["metrics-exporter-prometheus", "tokio-metrics"]
# Security features
security = []
# Tree-sitter parsing functionality (enabled by default)
# Refactored to allow per-language feature gating (Phase 1 multi-language support, UV-XXX)
# Existing `tree-sitter` feature now aggregates individual language features for backward compatibility.
# New granular features: rust-lang, python-lang, javascript-lang, typescript-lang
rust-lang = ["dep:tree-sitter-rust"]
python-lang = ["dep:tree-sitter-python"]
javascript-lang = ["dep:tree-sitter-javascript"]
typescript-lang = ["dep:tree-sitter-typescript"]
# Aggregate feature retains prior behavior
tree-sitter = [
    "dep:tree-sitter",
    "rust-lang",
    "python-lang",
    "javascript-lang",
    "typescript-lang"
]
# Core analysis features (without tree-sitter by default)
analysis = [] # No specific dependencies needed here, just a logical grouping
# AI feature for all AI-related functionality
ai = []
# Local AI only (Ollama)
local-ai = ["ai"]
# Image rendering service integration
image-rendering = []
# WASM plugin system
wasm-plugins = ["wasmtime", "wasmtime-wasi", "cap-std", "wit-bindgen"]
# Terminal User Interface
tui = ["ratatui", "crossterm", "tui-input"]
# Memory optimization features (UV-210, UV-26)
memory-optimization = ["mimalloc", "bumpalo", "bumpalo-herd", "memmap2", "rkyv"]

# Add new feature combinations for common use cases
# Zero-cost option (no external services required)
zero-cost = ["local-ai", "tree-sitter", "memory-optimization"]
# Full-featured option (includes image rendering)
full-featured = ["local-ai", "tree-sitter", "memory-optimization", "image-rendering", "tui"]
# Enterprise option (all features)
enterprise = ["local-ai", "tree-sitter", "memory-optimization", "image-rendering", "tui", "wasm-plugins", "chaos", "sla-monitoring"]
# Alpha build with TUI and essential features
alpha = ["tui", "tree-sitter", "local-ai", "security", "memory-optimization"]

[dependencies]
# Use workspace dependencies for consistency
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
ring = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Project-specific dependencies
rusqlite = { version = "0.31.0", features = ["bundled"] }
tokio-stream = { version = "0.1.17", features = ["fs"] }
async-stream = "0.3"
bincode = "1.3.3"
clap = { version = "4.5.4", features = ["derive", "env"] }
# Unified logging with tracing (replaces log + env_logger)
# log = "0.4.21"        # Replaced by tracing
# env_logger = "0.11.3"  # Replaced by tracing-subscriber
regex = "1.10"
rayon = "1.8.0"
# AST parsing dependencies (optional via features)
tree-sitter = { version = "0.25.8", optional = true }
tree-sitter-rust = { version = "0.24.0", optional = true }
tree-sitter-python = { version = "0.23.6", optional = true }
tree-sitter-javascript = { version = "0.23.1", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
# HTML escaping for fallback diagram rendering
html-escape = "0.2"
# Additional tracing appender
tracing-appender = "0.2"
prometheus = "0.14.0"
rand = "0.8"
# LRU cache for bounded memory management (UV-152)
lru = "0.12.0"
# Concurrent HashMap for thread-safe caching
dashmap = "6.1.0"
# Template engine for diagram generation
tera = "1.19.1"
# Base64 encoding/decoding for image handling
base64 = "0.22.0"
# MD5 hashing for input validation
md5 = "0.7"
# UUID generation for component IDs
uuid = { version = "1.8.0", features = ["v4", "v5", "serde"] }
url = "2.5"
walkdir = "2.5.0"
ignore = "0.4.22"
toml = "0.8.0"
sha2 = "0.10.0"
async-trait = "0.1.88"
petgraph = "0.8.2"
color-eyre = "0.6"
ndarray = "0.16.1"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
pastey = "0.1"
# WASM plugin system dependencies (optional via features)
wasmtime = { version = "34.0.2", features = ["component-model"], optional = true }
wasmtime-wasi = { version = "34.0.2", optional = true }
cap-std = { version = "3.0", optional = true }
arrow = { version = "52.2.0", optional = true }
arrow-ipc = { version = "52.2.0", optional = true }
arrow-schema = { version = "52.2.0", optional = true }
arrow-array = { version = "52.2.0", optional = true }
wit-bindgen = { version = "0.30.0", optional = true }
axum = { version = "0.7", features = ["ws", "macros"] }
tokio-tungstenite = "0.24"  # Updated to latest version
criterion = { version = "0.5", features = ["html_reports"] }
sysinfo = "0.30"
# Memory optimization dependencies (UV-210)
# High-performance allocator for memory optimization
mimalloc = { version = "0.1", optional = true }
# Arena allocation for temporary objects
bumpalo = { version = "3.19", features = ["collections", "boxed"], optional = true }
bumpalo-herd = { version = "0.1", optional = true }
# Memory mapping for large data structures
memmap2 = { version = "0.9", optional = true }
# Zero-copy serialization for AST cache optimization
rkyv = { version = "0.7", features = ["validation"], optional = true }
# CPU count for pool sharding
num_cpus = "1.16"
# Lazy static for global instances
lazy_static = "1.4"

# TUI Core Dependencies (optional via tui feature)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.29", optional = true }
tui-input = { version = "0.14", optional = true }

# Configuration Management (for TUI settings)
confy = "1.0"

# State Persistence (for TUI state)
persisted = "1.0"

# Pattern matching for file filtering
glob = "0.3.1"

# MessagePack serialization removed - using bincode for binary serialization
# rmp-serde = "1.1"  # Redundant with bincode

# Compression for diagram caching
flate2 = "1.0"

# Chaos Engineering and Load Testing Dependencies (UV-82)
# Failpoint injection for chaos engineering
fail = { version = "0.5", optional = true }
# Statistical analysis for performance regression detection
statrs = { version = "0.16.1", optional = true }
ndarray-stats = { version = "0.5", optional = true }
# Change point detection for regression analysis
changepoint = { version = "0.14.2", optional = true }
# Machine learning for anomaly detection
linfa = { version = "0.7", optional = true }
# InfluxDB client for time series data
influxdb2 = { version = "0.5", optional = true }
# Prometheus metrics exporter
metrics-exporter-prometheus = { version = "0.15", optional = true }
# Tokio runtime metrics
tokio-metrics = { version = "0.3", optional = true }
# Additional metrics and observability
metrics = "0.23"
metrics-tracing-context = "0.16"

# Security and RBAC Dependencies (UV-247)
# HTTP middleware and services
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "limit", "timeout"] }
tower_governor = "0.3"
# Database (using existing rusqlite instead of sqlx to avoid conflicts)
# Authorization
casbin = "2.1"
# Authentication - updated for security (resolves RSA timing attack vulnerability)
oauth2 = "5.0"
openidconnect = "4.0.1"  # Note: RSA vulnerability exists but no fix available yet
jsonwebtoken = "9.3"
# Security
argon2 = "0.5"
blake3 = "1.5"
# ring already defined in workspace dependencies
# Constant-time operations for timing attack protection
subtle = "2.5"
# HashiCorp Vault integration
vaultrs = "0.7"
# Configuration
config = "0.14"
streaming-iterator = "0.1.9"
# Security patches to force newer versions
# Note: Most security issues are resolved through updated dependencies

# Knowledge Library Dependencies (UV-335)
# Perfect Hash Functions for O(1) lookups
phf = { version = "0.11", features = ["macros"] }
tempfile = "3.8"

[[bin]]
name = "tui_test"
path = "src/bin/tui_test.rs"
required-features = ["tui"]

[[bin]]
name = "dependency_analyzer"
path = "tools/dependency_analyzer.rs"

[[bin]]
name = "circular_dependency_demo"
path = "src/bin/circular_dependency_demo.rs"

[[bin]]
name = "dependency_analyzer_new"
path = "src/bin/dependency_analyzer.rs"

[[bin]]
name = "simple_cycle_demo"
path = "src/bin/simple_cycle_demo.rs"

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"
mockall = "0.12"
mockito = "0.31"
assert_cmd = "2.0"
predicates = "2.1"
serde_json = "1.0"
rstest = "0.18"
criterion = { version = "0.5", features = ["html_reports"] }
iai-callgrind = "0.10"
serial_test = "3.0"
proptest = "1.4"
# Note: Coverage tools (tarpaulin, cargo-llvm-cov) are installed via CI, not as dependencies

[build-dependencies]
# PHF code generation for build-time index creation
phf_codegen = "0.11"
# JSON serialization for knowledge base processing
serde_json = "1.0"
# Compression for build-time knowledge library preparation
flate2 = "1.0"
# SHA-256 hashing for checksums
sha2 = "0.10"
# Chrono for build timestamp
chrono = { version = "=0.4.39", features = ["serde"] }

[[test]]
name = "analysis_engine"
path = "tests/analysis/engine.rs"

[[test]]
name = "application"
path = "tests/application.rs"

[[test]]
name = "config"
path = "tests/config.rs"

[[test]]
name = "cli_analyze"
path = "tests/cli_analyze.rs"

[[test]]
name = "database_crud"
path = "tests/database_crud.rs"

[[test]]
name = "comprehensive_coverage"
path = "tests/coverage/comprehensive_coverage.rs"

[[test]]
name = "edge_case_testing"
path = "tests/coverage/edge_case_testing.rs"

[[test]]
name = "regression_prevention"
path = "tests/coverage/regression_prevention.rs"

[[test]]
name = "security_tests"
path = "tests/security_tests.rs"

# Benchmarks removed for Alpha release

# Release profile with performance optimizations
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
