---
apiVersion: v1
kind: Service
metadata:
  name: uveddi-active
  namespace: uveddi-production
  labels:
    app: uveddi
    service-type: active
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  selector:
    app: uveddi
    version: blue  # Initially points to blue, switches during deployment
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8080
    protocol: TCP
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: uveddi-preview
  namespace: uveddi-production
  labels:
    app: uveddi
    service-type: preview
    environment: production
spec:
  selector:
    app: uveddi
    version: green  # Preview service for testing new deployments
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP