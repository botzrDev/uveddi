apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uveddi-data
  namespace: uveddi
  labels:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: uveddi-platform
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: fast-ssd  # Specify storage class if needed
  volumeMode: Filesystem