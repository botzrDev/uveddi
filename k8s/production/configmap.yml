apiVersion: v1
kind: ConfigMap
metadata:
  name: uveddi-config
  namespace: uveddi-production
  labels:
    app: uveddi
    component: config
    environment: production
data:
  # Application Configuration
  RUST_LOG: "info"
  RUST_BACKTRACE: "0"
  
  # Database Configuration
  DB_POSTGRES_HOST: "postgres-service.uveddi-production.svc.cluster.local"
  DB_POSTGRES_PORT: "5432"
  DB_POSTGRES_DB: "uveddi"
  DB_POSTGRES_USER: "uveddi_user"
  
  # Health Check Configuration
  HEALTH_CHECK_INTERVAL: "30"
  HEALTH_CHECK_TIMEOUT: "10"
  HEALTH_CHECK_RETRIES: "3"
  
  # Blue-Green Deployment Configuration
  DEPLOYMENT_STRATEGY: "blue-green"
  CANARY_WEIGHT: "10"
  TRAFFIC_SPLIT_THRESHOLD: "95"
  
  # Monitoring Configuration
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  TRACING_ENABLED: "true"
  TRACING_ENDPOINT: "http://jaeger-collector.uveddi-monitoring.svc.cluster.local:14268"
  
  # Resilience Configuration
  CIRCUIT_BREAKER_ENABLED: "true"
  CIRCUIT_BREAKER_THRESHOLD: "5"
  CIRCUIT_BREAKER_TIMEOUT: "60"
  RETRY_MAX_ATTEMPTS: "3"
  RETRY_BACKOFF_MS: "1000"
  
  # Performance Configuration
  MAX_CONCURRENT_ANALYSES: "50"
  ANALYSIS_TIMEOUT_SECONDS: "300"
  MAX_FILE_SIZE_MB: "100"
  
  # Security Configuration
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "100"
  TLS_ENABLED: "true"
  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uveddi-disaster-recovery-config
  namespace: uveddi-production
  labels:
    app: uveddi
    component: disaster-recovery
    environment: production
data:
  # Backup Configuration
  BACKUP_ENABLED: "true"
  BACKUP_SCHEDULE: "0 2 * * *"  # Daily at 2 AM
  BACKUP_RETENTION_DAYS: "30"
  BACKUP_STORAGE_BUCKET: "uveddi-production-backups"
  
  # Recovery Configuration
  RTO_MINUTES: "15"  # Recovery Time Objective
  RPO_MINUTES: "60"  # Recovery Point Objective
  AUTO_FAILOVER_ENABLED: "true"
  FAILOVER_THRESHOLD_FAILURES: "3"
  
  # Health Monitoring
  HEALTH_CHECK_ENDPOINTS: |
    /health
    /health/database
    /health/ai-providers
    /metrics
  
  # Disaster Recovery Runbook
  DR_RUNBOOK_URL: "https://docs.uveddi.com/disaster-recovery"
  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uveddi-deployment-scripts
  namespace: uveddi-production
  labels:
    app: uveddi
    component: deployment-automation
    environment: production
data:
  blue-green-deploy.sh: |
    #!/bin/bash
    set -euo pipefail
    
    # Blue-Green Deployment Script for Uveddi
    
    NAMESPACE="uveddi-production"
    APP_NAME="uveddi"
    NEW_VERSION="${1:-latest}"
    HEALTH_CHECK_RETRIES=10
    HEALTH_CHECK_INTERVAL=30
    
    echo "🚀 Starting Blue-Green deployment for Uveddi v${NEW_VERSION}"
    
    # Determine current environment (blue or green)
    CURRENT_ENV=$(kubectl get service ${APP_NAME}-active -n ${NAMESPACE} -o jsonpath='{.spec.selector.version}' || echo "blue")
    
    if [ "$CURRENT_ENV" = "blue" ]; then
        NEW_ENV="green"
    else
        NEW_ENV="blue"
    fi
    
    echo "📊 Current environment: $CURRENT_ENV"
    echo "🎯 Deploying to: $NEW_ENV"
    
    # Deploy new version to inactive environment
    echo "🔄 Deploying v${NEW_VERSION} to ${NEW_ENV} environment..."
    kubectl set image deployment/${APP_NAME}-${NEW_ENV} \
        uveddi=uveddi:${NEW_VERSION} \
        -n ${NAMESPACE}
    
    # Wait for deployment to be ready
    echo "⏳ Waiting for ${NEW_ENV} deployment to be ready..."
    kubectl rollout status deployment/${APP_NAME}-${NEW_ENV} -n ${NAMESPACE} --timeout=600s
    
    # Health check new deployment
    echo "🏥 Performing health checks on ${NEW_ENV} environment..."
    for i in $(seq 1 $HEALTH_CHECK_RETRIES); do
        if kubectl exec -n ${NAMESPACE} deployment/${APP_NAME}-${NEW_ENV} -- \
           curl -f http://localhost:8080/health; then
            echo "✅ Health check passed (attempt $i)"
            break
        else
            echo "❌ Health check failed (attempt $i/${HEALTH_CHECK_RETRIES})"
            if [ $i -eq $HEALTH_CHECK_RETRIES ]; then
                echo "💥 Health checks failed. Rolling back..."
                exit 1
            fi
            sleep $HEALTH_CHECK_INTERVAL
        fi
    done
    
    # Switch traffic to new environment
    echo "🔀 Switching traffic to ${NEW_ENV} environment..."
    kubectl patch service ${APP_NAME}-active -n ${NAMESPACE} -p \
        '{"spec":{"selector":{"version":"'${NEW_ENV}'"}}}'
    
    # Final verification
    echo "🔍 Final verification..."
    sleep 30
    kubectl exec -n ${NAMESPACE} deployment/${APP_NAME}-${NEW_ENV} -- \
        curl -f http://localhost:8080/health
    
    echo "🎉 Blue-Green deployment completed successfully!"
    echo "📈 New version v${NEW_VERSION} is now active in ${NEW_ENV} environment"
    
  rollback.sh: |
    #!/bin/bash
    set -euo pipefail
    
    # Rollback Script for Uveddi Blue-Green Deployment
    
    NAMESPACE="uveddi-production"
    APP_NAME="uveddi"
    
    echo "🔄 Starting rollback procedure..."
    
    # Determine current active environment
    CURRENT_ENV=$(kubectl get service ${APP_NAME}-active -n ${NAMESPACE} -o jsonpath='{.spec.selector.version}')
    
    if [ "$CURRENT_ENV" = "blue" ]; then
        ROLLBACK_ENV="green"
    else
        ROLLBACK_ENV="blue"
    fi
    
    echo "📊 Current active environment: $CURRENT_ENV"
    echo "🎯 Rolling back to: $ROLLBACK_ENV"
    
    # Health check rollback environment
    echo "🏥 Verifying ${ROLLBACK_ENV} environment health..."
    kubectl exec -n ${NAMESPACE} deployment/${APP_NAME}-${ROLLBACK_ENV} -- \
        curl -f http://localhost:8080/health
    
    # Switch traffic back
    echo "🔀 Switching traffic to ${ROLLBACK_ENV} environment..."
    kubectl patch service ${APP_NAME}-active -n ${NAMESPACE} -p \
        '{"spec":{"selector":{"version":"'${ROLLBACK_ENV}'"}}}'
    
    echo "✅ Rollback completed successfully!"
    echo "📈 Traffic restored to ${ROLLBACK_ENV} environment"
    
  disaster-recovery.sh: |
    #!/bin/bash
    set -euo pipefail
    
    # Disaster Recovery Script for Uveddi
    
    NAMESPACE="uveddi-production"
    BACKUP_BUCKET="uveddi-production-backups"
    DR_NAMESPACE="uveddi-dr"
    
    function restore_database() {
        echo "📊 Restoring database from latest backup..."
        
        # Get latest backup
        LATEST_BACKUP=$(gsutil ls gs://${BACKUP_BUCKET}/database/ | sort | tail -1)
        
        if [ -z "$LATEST_BACKUP" ]; then
            echo "❌ No database backups found!"
            exit 1
        fi
        
        echo "🔄 Restoring from: $LATEST_BACKUP"
        
        # Download and restore backup
        gsutil cp $LATEST_BACKUP /tmp/latest_backup.sql.gz
        gunzip /tmp/latest_backup.sql.gz
        
        # Apply to DR database
        kubectl exec -i postgres-dr-0 -n ${DR_NAMESPACE} -- \
            psql -U uveddi -d uveddi < /tmp/latest_backup.sql
        
        echo "✅ Database restoration completed"
    }
    
    function deploy_dr_environment() {
        echo "🚀 Deploying disaster recovery environment..."
        
        # Create DR namespace if it doesn't exist
        kubectl create namespace ${DR_NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
        
        # Deploy DR infrastructure
        kubectl apply -f k8s/disaster-recovery/ -n ${DR_NAMESPACE}
        
        # Wait for DR deployment
        kubectl rollout status deployment/uveddi-dr -n ${DR_NAMESPACE} --timeout=600s
        
        echo "✅ DR environment deployed successfully"
    }
    
    function validate_dr_environment() {
        echo "🏥 Validating disaster recovery environment..."
        
        # Health checks
        kubectl exec -n ${DR_NAMESPACE} deployment/uveddi-dr -- \
            curl -f http://localhost:8080/health
        
        # Database connectivity check
        kubectl exec -n ${DR_NAMESPACE} deployment/uveddi-dr -- \
            curl -f http://localhost:8080/health/database
        
        echo "✅ DR environment validation passed"
    }
    
    function switch_dns() {
        echo "🌐 Switching DNS to disaster recovery environment..."
        
        # This would typically involve updating DNS records
        # Implementation depends on your DNS provider
        echo "⚠️  Manual DNS update required:"
        echo "   Update A record for uveddi.com to point to DR load balancer IP"
        
        DR_LB_IP=$(kubectl get service uveddi-dr-lb -n ${DR_NAMESPACE} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "   DR Load Balancer IP: ${DR_LB_IP}"
    }
    
    # Main disaster recovery procedure
    case "${1:-help}" in
        "restore-db")
            restore_database
            ;;
        "deploy-dr")
            deploy_dr_environment
            ;;
        "validate")
            validate_dr_environment
            ;;
        "full-recovery")
            echo "🚨 Starting full disaster recovery procedure..."
            deploy_dr_environment
            restore_database
            validate_dr_environment
            switch_dns
            echo "🎉 Disaster recovery completed!"
            ;;
        *)
            echo "Usage: $0 {restore-db|deploy-dr|validate|full-recovery}"
            echo ""
            echo "Commands:"
            echo "  restore-db    - Restore database from latest backup"
            echo "  deploy-dr     - Deploy disaster recovery environment"
            echo "  validate      - Validate DR environment health"
            echo "  full-recovery - Complete disaster recovery procedure"
            ;;
    esac