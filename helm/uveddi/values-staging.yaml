# Staging environment values for uveddi
# These values override the defaults in values.yaml for staging deployment

environment: staging

# Reduce resources for staging
replicaCount: 2

resources:
  limits:
    cpu: 500m
    memory: 1Gi
    ephemeral-storage: 2Gi
  requests:
    cpu: 125m
    memory: 256Mi
    ephemeral-storage: 500Mi

# Autoscaling for staging
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Pod Disruption Budget for staging
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Staging ingress
ingress:
  enabled: true
  hosts:
  - host: staging.uveddi.example.com
    paths:
    - path: /
      pathType: Prefix
  
  tls:
  - secretName: uveddi-staging-tls
    hosts:
    - staging.uveddi.example.com

# Reduce persistence size for staging
persistence:
  size: 5Gi

# Enable PostgreSQL for staging (shared database)
postgresql:
  enabled: true
  auth:
    postgresPassword: "staging-password"
    username: uveddi
    password: "uveddi-staging"
    database: uveddi_staging
  primary:
    persistence:
      enabled: true
      size: 10Gi

# Enable Redis for staging
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 4Gi

# Application configuration for staging
app:
  config:
    rustLog: "debug"
    rustBacktrace: "1"
    
    # More lenient resource limits for staging
    performance:
      maxMemoryMb: 512
      cacheSizeMb: 128

# Enable monitoring for staging
monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

# Additional environment variables for staging
env:
- name: ENVIRONMENT
  value: "staging"
- name: LOG_LEVEL
  value: "debug"
- name: ENABLE_DEBUG_ENDPOINTS
  value: "true"

# Relaxed network policy for staging (for debugging)
networkPolicy:
  enabled: false