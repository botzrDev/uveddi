# All dependencies are now pinned to specific versions for reproducible builds.

[package]
name = "uveddi"
version = "0.1.0"
edition = "2021"
description = "A Rust-based code analysis and exploration tool"
authors = ["Phillip Austin Green <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/botzrDev/uveddi"
keywords = ["code", "analysis", "tools", "visualization", "uveddi"]
categories = ["development-tools"]
readme = "README.md"

# Feature flags for modular compilation
[features]
default = ["analysis", "local-ai"]
# Core analysis features
analysis = ["tree-sitter", "tree-sitter-rust", "tree-sitter-python", "tree-sitter-javascript", "tree-sitter-typescript"]
# Local AI only (Ollama)
local-ai = ["reqwest"]

[dependencies]
rusqlite = { version = "0.31.0", features = ["bundled"] }
tokio = { version = "1.37.0", features = ["full"] }
tokio-stream = { version = "0.1.15", features = ["fs"] }
futures = "0.3"
async-stream = "0.3"
chrono = { version = "0.4.38", features = ["serde"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
bincode = "1.3.3"
thiserror = "1.0.61"
anyhow = "1.0.86"
clap = { version = "4.5.4", features = ["derive", "env"] }
log = "0.4.21"
env_logger = "0.11.3"
regex = "1.10"
rayon = "1.8.0"
# AST parsing dependencies (optional via features)
tree-sitter = { version = "0.22.6", optional = true }
tree-sitter-rust = { version = "0.21.0", optional = true }
tree-sitter-python = { version = "0.21.0", optional = true }
tree-sitter-javascript = { version = "0.21.0", optional = true }
tree-sitter-typescript = { version = "0.21.0", optional = true }
# HTTP client for local AI (Ollama) - updated for security fix
reqwest = { version = "0.12.22", features = ["json"], optional = true }
rustls = "0.23.28"  # Force newer rustls to get updated ring
walkdir = "2.5.0"
ignore = "0.4.22"
toml = "0.8.0"
sha2 = "0.10.0"
async-trait = "0.1.88"
md5 = "0.8.0"
petgraph = "0.8.2"
color-eyre = "0.6"
ndarray = "0.16.1"
seahash = "4.1.0"

# Security patches to force newer versions

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
mockall = "0.11"
mockito = "0.31"
assert_cmd = "2.0"
predicates = "2.1"
serde_json = "1.0"

[[test]]
name = "analysis_engine"
path = "tests/analysis/engine.rs"

[[test]]
name = "application"
path = "tests/application.rs"

[[test]]
name = "config"
path = "tests/config.rs"

[[test]]
name = "cli_analyze"
path = "tests/cli_analyze.rs"

[[test]]
name = "database_crud"
path = "tests/database_crud.rs"
