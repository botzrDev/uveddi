t_size {\n            context.truncate(self.max_context_size);\n        }\n        context\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn test_context_builder() {\n        let mut builder = ContextBuilder::new(1000);\n        builder.add_pattern(\"Singleton pattern detected\".to_string());\n        builder.add_file_context(\"main.rs\", \"fn main() { println!(\\\"hi\\\"); }\".to_string());\n        let ctx = builder.build_for_issue(\"main.rs\");\n        assert!(ctx.contains(\"Singleton pattern\"));\n        assert!(ctx.contains(\"fn main()\"));\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","ai","engine.rs"],"content":"use crate::ai::api::llm_provider::LlmProvider;\nuse crate::ai::ollama_provider::{OllamaConfig, OllamaProvider};\nuse crate::ai::prompts::smart_prompting::SmartPromptBuilder;\nuse crate::database::models::ArchitecturalIssue;\nuse crate::error::UveddiError;\nuse log::{info, warn};\nuse std::env;\n\n/// AiAnalysisEngine is responsible for performing AI-powered architectural analysis.\n/// It integrates with different AI providers to analyze codebases and detect architectural issues.\npub struct AiAnalysisEngine {\n    provider: Option\u003cBox\u003cdyn LlmProvider + Send + Sync\u003e\u003e,\n    prompt_builder: SmartPromptBuilder,\n}\n\nimpl AiAnalysisEngine {\n    /// Creates a new instance of AiAnalysisEngine with default configurations.\n    pub fn new() -\u003e Self {\n        // Try to initialize with Ollama provider if available\n        let provider = if let Ok(api_url) = env::var(\"OLLAMA_API_URL\") {\n            let model = env::var(\"OLLAMA_MODEL\")\n                .unwrap_or_else(|_| \"deepseek-coder:6.7b-instruct-q4_0\".to_string());\n\n            let config = OllamaConfig {\n                model,\n                api_url,\n                ..Default::default()\n            };\n\n            let ollama_provider = OllamaProvider::new(config);\n            Some(Box::new(ollama_provider) as Box\u003cdyn LlmProvider + Send + Sync\u003e)\n        } else {\n            None\n        };\n\n        AiAnalysisEngine {\n            provider,\n            prompt_builder: SmartPromptBuilder::new(),\n        }\n    }\n\n    /// Performs architectural analysis on the provided codebase.\n    ///\n    /// # Arguments\n    ///\n    /// * `codebase_path` - The path to the codebase to analyze.\n    ///\n    /// # Returns\n    ///\n    /// * `Result\u003c(), UveddiError\u003e` - Ok on success, or an error on failure.\n    pub fn analyze(\u0026self, _codebase_path: \u0026str) -\u003e Result\u003c(), UveddiError\u003e {\n        // Implementation of the analysis logic\n        Ok(())\n    }\n\n    /// Analyzes a single architectural issue to provide an explanation and recommended solution.\n    pub async fn analyze_issue(\u0026self, issue: \u0026mut ArchitecturalIssue) -\u003e Result\u003c(), UveddiError\u003e {\n        info!(\"AI Engine analyzing issue: {}\", issue.description);\n\n        // If no provider is configured, skip AI analysis\n        let provider = match \u0026self.provider {\n            Some(provider) =\u003e provider,\n            None =\u003e {\n                info!(\"No AI provider configured, skipping AI analysis\");\n                return Ok(());\n            }\n        };\n\n        // Build a smart prompt for the issue\n        let prompt = self.prompt_builder.build_prompt_for_issue(issue);\n\n        // Generate AI explanation\n        match provider.generate_explanation(\u0026prompt).await {\n            Ok(explanation) =\u003e {\n                info!(\"Generated AI explanation for issue\");\n                issue.ai_explanation = Some(explanation);\n            }\n            Err(e) =\u003e {\n                warn!(\"Failed to generate AI explanation: {e}\");\n                // Don't fail the entire analysis if AI fails\n            }\n        }\n\n        Ok(())\n    }\n\n    // Add more methods as needed for additional functionalities\n}\n\nimpl Default for AiAnalysisEngine {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n","traces":[{"line":18,"address":[3480077,3479264,3480023],"length":1,"stats":{"Line":0}},{"line":20,"address":[3479372,3479281],"length":1,"stats":{"Line":0}},{"line":21,"address":[3479413,3479485],"length":1,"stats":{"Line":0}},{"line":22,"address":[3713776,3713760],"length":1,"stats":{"Line":0}},{"line":30,"address":[3479819],"length":1,"stats":{"Line":0}},{"line":31,"address":[3479918],"length":1,"stats":{"Line":0}},{"line":33,"address":[3479355],"length":1,"stats":{"Line":0}},{"line":38,"address":[3480174],"length":1,"stats":{"Line":0}},{"line":51,"address":[3480384],"length":1,"stats":{"Line":0}},{"line":53,"address":[3480402],"length":1,"stats":{"Line":0}},{"line":57,"address":[3480429,3480416],"length":1,"stats":{"Line":0}},{"line":58,"address":[3714174,3714223,3714032],"length":1,"stats":{"Line":0}},{"line":61,"address":[3714188],"length":1,"stats":{"Line":0}},{"line":62,"address":[3714523],"length":1,"stats":{"Line":0}},{"line":64,"address":[3714640,3714565],"length":1,"stats":{"Line":0}},{"line":65,"address":[3714623],"length":1,"stats":{"Line":0}},{"line":70,"address":[3714531],"length":1,"stats":{"Line":0}},{"line":73,"address":[3714935,3714107,3715049,3715178],"length":1,"stats":{"Line":0}},{"line":74,"address":[3715491],"length":1,"stats":{"Line":0}},{"line":75,"address":[3715726,3715531,3715618],"length":1,"stats":{"Line":0}},{"line":76,"address":[3715624,3715944],"length":1,"stats":{"Line":0}},{"line":78,"address":[3715430],"length":1,"stats":{"Line":0}},{"line":79,"address":[3715446,3716205,3716233],"length":1,"stats":{"Line":0}},{"line":84,"address":[3716081],"length":1,"stats":{"Line":0}},{"line":91,"address":[3480448],"length":1,"stats":{"Line":0}},{"line":92,"address":[3480456],"length":1,"stats":{"Line":0}}],"covered":0,"coverable":26},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","ai","human_loop","mod.rs"],"content":"//! Human-in-the-loop verification workflow\n\nuse crate::ai::types::AiSuggestion;\nuse std::io::{self, Write};\n\n/// CLI workflow for human review of AI suggestions\npub fn request_human_verification_cli(suggestion: \u0026AiSuggestion) -\u003e bool {\n    println!(\"\\n===== AI Architectural Suggestion =====\");\n    println!(\"Title: {}\", suggestion.title);\n    println!(\"Description: {}\", suggestion.description);\n    println!(\"Explanation: {}\", suggestion.explanation);\n    println!(\"Refactoring: {}\", suggestion.refactoring);\n    println!(\"Confidence: {}\", suggestion.confidence.as_deref().unwrap_or(\"unknown\"));\n    println!(\"======================================\");\n    println!(\"\\nDo you accept this suggestion? [y]es / [n]o / [c]larify: \");\n    print!(\"\u003e \");\n    io::stdout().flush().unwrap();\n    let mut input = String::new();\n    io::stdin().read_line(\u0026mut input).unwrap();\n    match input.trim().to_lowercase().as_str() {\n        \"y\" | \"yes\" =\u003e {\n            log_user_feedback(\u0026suggestion, \"accepted\");\n            true\n        },\n        \"n\" | \"no\" =\u003e {\n            log_user_feedback(\u0026suggestion, \"rejected\");\n            false\n        },\n        \"c\" | \"clarify\" =\u003e {\n            log_user_feedback(\u0026suggestion, \"clarify\");\n            false\n        },\n        _ =\u003e {\n            println!(\"Invalid input. Assuming rejection.\");\n            log_user_feedback(\u0026suggestion, \"invalid\");\n            false\n        }\n    }\n}\n\n/// Log user feedback to a file (append mode)\npub fn log_user_feedback(suggestion: \u0026AiSuggestion, action: \u0026str) {\n    use std::fs::OpenOptions;\n    use std::io::Write;\n    if let Ok(mut file) = OpenOptions::new().create(true).append(true).open(\"ai_suggestion_feedback.log\") {\n        let log_entry = format!(\n            \"{} | {} | {} | {}\\n\",\n            chrono::Utc::now().to_rfc3339(),\n            action,\n            suggestion.title,\n            suggestion.confidence.as_deref().unwrap_or(\"unknown\")\n        );\n        let _ = file.write_all(log_entry.as_bytes());\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","ai","mod.rs"],"content":"//! AI module for Uveddi\n//!\n//! This module provides AI-powered analysis capabilities, including integration with local and API-based LLMs.\n//! Submodules implement providers, prompt templates, and the main AI analysis engine.\n\npub mod api;\npub mod engine;\npub mod ollama_provider;\npub mod prompts;\npub mod types;\n\npub use self::engine::AiAnalysisEngine;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","ai","ollama_provider.rs"],"content":"//! Ollama Provider Integration\n//!\n//! This module provides integration with Ollama, a local LLM runtime that allows\n//! running large language models on local hardware. The Ollama provider enables\n//! Uveddi to perform AI-powered code analysis without requiring external API calls.\n//!\n//! # Features\n//!\n//! - Local LLM inference through Ollama API\n//! - Configurable model selection and parameters\n//! - Timeout handling for robust operation\n//! - Health checking and availability validation\n//!\n//! # Usage\n//!\n//! ```rust,no_run\n//! use uveddi::ai::ollama_provider::{OllamaProvider, OllamaConfig};\n//!\n//! let config = OllamaConfig {\n//!     model: \"deepseek-coder:6.7b-instruct-q4_0\".to_string(),\n//!     api_url: \"http://localhost:11434\".to_string(),\n//!     timeout_seconds: 60,\n//!     temperature: 0.1,\n//!     max_tokens: 2048,\n//! };\n//!\n//! let provider = OllamaProvider::new(config);\n//!\n//! // Check if Ollama is available\n//! if provider.check_availability().await? {\n//!     // Run inference\n//!     let response = provider.infer(\"Explain this code\").await?;\n//!     println!(\"AI Response: {}\", response);\n//! }\n//! # Ok::\u003c(), Box\u003cdyn std::error::Error\u003e\u003e(())\n//! ```\n\nuse log::{debug, info, warn};\nuse reqwest::Client;\nuse serde::{Deserialize, Serialize};\nuse std::time::Duration;\nuse tokio::time::timeout;\n\n/// Request payload structure for Ollama API calls\n///\n/// This structure represents the JSON payload sent to the Ollama API\n/// for text generation requests.\n#[derive(Serialize, Debug)]\nstruct OllamaRequest\u003c'a\u003e {\n    /// The model name to use for inference\n    model: \u0026'a str,\n    /// The input prompt for text generation\n    prompt: \u0026'a str,\n    /// Whether to stream the response (always false in our implementation)\n    stream: bool,\n    /// Optional generation parameters\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    options: Option\u003cOllamaOptions\u003e,\n}\n\n/// Generation options for controlling Ollama model behavior\n///\n/// These parameters control how the language model generates text,\n/// affecting creativity, coherence, and output length.\n#[derive(Serialize, Debug)]\nstruct OllamaOptions {\n    /// Controls randomness in generation (0.0 = deterministic, 1.0 = very random)\n    temperature: f32,\n    /// Nucleus sampling parameter - considers only top-p probability mass\n    top_p: f32,\n    /// Limits vocabulary to top-k most likely tokens\n    top_k: i32,\n    /// Maximum number of tokens to generate\n    num_predict: i32,\n    /// Stop sequences that terminate generation\n    stop: Vec\u003cString\u003e,\n}\n\n/// Response structure from Ollama API\n///\n/// Represents the JSON response returned by the Ollama API after\n/// a successful text generation request.\n#[derive(Deserialize, Debug)]\nstruct OllamaResponse {\n    /// The generated text response\n    response: String,\n    /// Whether the generation is complete (always true for non-streaming)\n    #[serde(default)]\n    done: bool,\n}\n\n/// Error response structure from Ollama API\n///\n/// Used to parse error messages when the Ollama API returns an error status.\n#[derive(Deserialize, Debug)]\nstruct OllamaErrorResponse {\n    /// The error message from the API\n    error: String,\n}\n\n/// Configuration settings for the Ollama provider\n///\n/// This struct contains all the necessary configuration parameters\n/// for connecting to and using an Ollama instance for AI inference.\n///\n/// # Examples\n///\n/// ```rust\n/// use uveddi::ai::ollama_provider::OllamaConfig;\n///\n/// // Use default configuration\n/// let config = OllamaConfig::default();\n///\n/// // Create custom configuration\n/// let config = OllamaConfig {\n///     model: \"codellama:7b-instruct\".to_string(),\n///     api_url: \"http://localhost:11434\".to_string(),\n///     timeout_seconds: 120,\n///     temperature: 0.2,\n///     max_tokens: 4096,\n/// };\n/// ```\n#[derive(Clone, Debug)]\npub struct OllamaConfig {\n    /// The Ollama model to use for inference (e.g., \"deepseek-coder:6.7b-instruct-q4_0\")\n    pub model: String,\n    /// The base URL for the Ollama API (typically \"http://localhost:11434\")\n    pub api_url: String,\n    /// Maximum time to wait for API responses in seconds\n    pub timeout_seconds: u64,\n    /// Temperature parameter for controlling response randomness (0.0-1.0)\n    pub temperature: f32,\n    /// Maximum number of tokens to generate in responses\n    pub max_tokens: i32,\n}\n\nimpl Default for OllamaConfig {\n    /// Provides sensible default configuration for Ollama\n    ///\n    /// Uses DeepSeek Coder model with conservative generation parameters\n    /// suitable for code analysis tasks.\n    fn default() -\u003e Self {\n        Self {\n            model: \"deepseek-coder:6.7b-instruct-q4_0\".to_string(),\n            api_url: \"http://localhost:11434\".to_string(),\n            timeout_seconds: 60,\n            temperature: 0.1,\n            max_tokens: 2048,\n        }\n    }\n}\n\n/// Ollama provider for local LLM inference\n///\n/// This provider interfaces with a local Ollama instance to perform\n/// AI-powered code analysis. It handles connection management, request\n/// formatting, and response parsing.\n///\n/// # Thread Safety\n///\n/// This struct is designed to be used across async tasks. The internal\n/// HTTP client is thread-safe and can be shared between requests.\npub struct OllamaProvider {\n    /// Configuration settings for this provider instance\n    pub config: OllamaConfig,\n    /// HTTP client for making API requests to Ollama\n    pub client: Client,\n}\n\nimpl OllamaProvider {\n    /// Creates a new Ollama provider with the given configuration\n    ///\n    /// Initializes an HTTP client with appropriate timeouts based on\n    /// the configuration settings.\n    ///\n    /// # Arguments\n    ///\n    /// * `config` - Configuration settings for the Ollama provider\n    ///\n    /// # Examples\n    ///\n    /// ```rust\n    /// use uveddi::ai::ollama_provider::{OllamaProvider, OllamaConfig};\n    ///\n    /// let config = OllamaConfig::default();\n    /// let provider = OllamaProvider::new(config);\n    /// ```\n    pub fn new(config: OllamaConfig) -\u003e Self {\n        // Create HTTP client with appropriate timeouts\n        let client = Client::builder()\n            .timeout(Duration::from_secs(config.timeout_seconds + 5))\n            .build()\n            .unwrap_or_else(|_| Client::new());\n\n        Self { config, client }\n    }\n\n    /// Check if Ollama service is available and the configured model is working\n    ///\n    /// This method performs a two-step validation:\n    /// 1. Checks if the Ollama service is running and responsive\n    /// 2. Attempts a test inference to verify the model is loaded and functional\n    ///\n    /// # Returns\n    ///\n    /// * `Ok(true)` - Service and model are available\n    /// * `Ok(false)` - Service is unavailable or model failed\n    /// * `Err(String)` - Unexpected error during availability check\n    ///\n    /// # Examples\n    ///\n    /// ```rust,no_run\n    /// # use uveddi::ai::ollama_provider::{OllamaProvider, OllamaConfig};\n    /// # let provider = OllamaProvider::new(OllamaConfig::default());\n    /// if provider.check_availability().await? {\n    ///     println!(\"Ollama is ready for use\");\n    /// } else {\n    ///     println!(\"Ollama is not available\");\n    /// }\n    /// # Ok::\u003c(), Box\u003cdyn std::error::Error\u003e\u003e(())\n    /// ```\n    pub async fn check_availability(\u0026self) -\u003e Result\u003cbool, String\u003e {\n        info!(\n            \"Checking Ollama availability with model: {}\",\n            self.config.model\n        );\n\n        // First check if service is running\n        match timeout(\n            Duration::from_secs(5),\n            self.client\n                .get(format!(\"{}/api/tags\", self.config.api_url))\n                .send(),\n        )\n        .await\n        {\n            Ok(result) =\u003e match result {\n                Ok(response) =\u003e {\n                    if !response.status().is_success() {\n                        warn!(\n                            \"Ollama service responded with error status: {}\",\n                            response.status()\n                        );\n                        return Ok(false);\n                    }\n                }\n                Err(e) =\u003e {\n                    warn!(\"Failed to connect to Ollama service: {}\", e);\n                    return Ok(false);\n                }\n            },\n            Err(_) =\u003e {\n                warn!(\"Timeout connecting to Ollama service\");\n                return Ok(false);\n            }\n        }\n\n        // Then try a minimal inference to see if model works\n        let test_prompt = \"Say 'hello'\";\n        match self.infer(test_prompt).await {\n            Ok(_) =\u003e {\n                info!(\n                    \"Ollama model {} is available and working\",\n                    self.config.model\n                );\n                Ok(true)\n            }\n            Err(e) =\u003e {\n                warn!(\"Ollama model check failed: {}\", e);\n                Ok(false)\n            }\n        }\n    }\n\n    /// Run inference using the configured Ollama model\n    ///\n    /// Sends a prompt to the Ollama API and returns the generated response.\n    /// This method handles request formatting, timeout management, and error parsing.\n    ///\n    /// # Arguments\n    ///\n    /// * `prompt` - The input text prompt for the language model\n    ///\n    /// # Returns\n    ///\n    /// * `Ok(String)` - The generated response text\n    /// * `Err(String)` - Error message describing what went wrong\n    ///\n    /// # Errors\n    ///\n    /// This function will return an error if:\n    /// - The HTTP request fails or times out\n    /// - The Ollama API returns an error status\n    /// - The response cannot be parsed as valid JSON\n    /// - The configured timeout is exceeded\n    ///\n    /// # Examples\n    ///\n    /// ```rust,no_run\n    /// # use uveddi::ai::ollama_provider::{OllamaProvider, OllamaConfig};\n    /// # let provider = OllamaProvider::new(OllamaConfig::default());\n    /// let prompt = \"Explain what this function does: fn add(a: i32, b: i32) -\u003e i32 { a + b }\";\n    /// let response = provider.infer(prompt).await?;\n    /// println!(\"AI explanation: {}\", response);\n    /// # Ok::\u003c(), Box\u003cdyn std::error::Error\u003e\u003e(())\n    /// ```\n    pub async fn infer(\u0026self, prompt: \u0026str) -\u003e Result\u003cString, String\u003e {\n        debug!(\"Running inference with prompt of length {}\", prompt.len());\n\n        let options = OllamaOptions {\n            temperature: self.config.temperature,\n            top_p: 0.9,\n            top_k: 40,\n            num_predict: self.config.max_tokens,\n            stop: vec![\"\\n```\".to_string(), \"\u003c/answer\u003e\".to_string()],\n        };\n\n        let request_body = OllamaRequest {\n            model: \u0026self.config.model,\n            prompt,\n            stream: false,\n            options: Some(options),\n        };\n\n        // Use timeout to prevent hanging\n        let result = timeout(\n            Duration::from_secs(self.config.timeout_seconds),\n            self.client\n                .post(format!(\"{}/api/generate\", self.config.api_url))\n                .json(\u0026request_body)\n                .send(),\n        )\n        .await;\n\n        // Handle timeout\n        let response = match result {\n            Ok(res) =\u003e match res {\n                Ok(response) =\u003e response,\n                Err(e) =\u003e return Err(format!(\"HTTP request error: {}\", e)),\n            },\n            Err(_) =\u003e {\n                return Err(format!(\n                    \"Request timed out after {} seconds\",\n                    self.config.timeout_seconds\n                ))\n            }\n        };\n\n        let status = response.status();\n        if status.is_success() {\n            match response.json::\u003cOllamaResponse\u003e().await {\n                Ok(ollama_response) =\u003e {\n                    debug!(\n                        \"Successfully received response of length {}\",\n                        ollama_response.response.len()\n                    );\n                    Ok(ollama_response.response)\n                }\n                Err(e) =\u003e Err(format!(\"Failed to parse response: {}\", e)),\n            }\n        } else {\n            // Try to get error message\n            match response.json::\u003cOllamaErrorResponse\u003e().await {\n                Ok(error_response) =\u003e Err(format!(\"Ollama API error: {}\", error_response.error)),\n                Err(_) =\u003e Err(format!(\"Ollama API error: HTTP {}\", status)),\n            }\n        }\n    }\n}\n\nuse crate::ai::api::llm_provider::LlmProvider;\nuse anyhow::{anyhow, Result};\nuse async_trait::async_trait;\n\n#[async_trait]\nimpl LlmProvider for OllamaProvider {\n    async fn generate_explanation(\u0026self, prompt: \u0026str) -\u003e Result\u003cString\u003e {\n        // Call the OllamaProvider's infer method\n        let response = self.infer(prompt).await.map_err(|e| anyhow!(e))?;\n        Ok(response)\n    }\n\n    fn get_provider_name(\u0026self) -\u003e \u0026'static str {\n        \"Ollama\"\n    }\n}\n","traces":[{"line":142,"address":[4113168,4113371,4113365],"length":1,"stats":{"Line":0}},{"line":144,"address":[4113181],"length":1,"stats":{"Line":0}},{"line":145,"address":[4113217],"length":1,"stats":{"Line":0}},{"line":188,"address":[4113392,4113805],"length":1,"stats":{"Line":0}},{"line":190,"address":[4113641,4113414,4113601],"length":1,"stats":{"Line":0}},{"line":191,"address":[4113487,4113783,4113633],"length":1,"stats":{"Line":0}},{"line":193,"address":[3940368,3940377],"length":1,"stats":{"Line":0}},{"line":222,"address":[3940553,3940675,3940464,3940739,3941512,3942748],"length":1,"stats":{"Line":0}},{"line":223,"address":[3940630,3940829,3940793],"length":1,"stats":{"Line":0}},{"line":229,"address":[3941451,3941398,3941726,3941751],"length":1,"stats":{"Line":0}},{"line":230,"address":[3940804],"length":1,"stats":{"Line":0}},{"line":231,"address":[3941305,3941147],"length":1,"stats":{"Line":0}},{"line":232,"address":[3941174],"length":1,"stats":{"Line":0}},{"line":235,"address":[3941424,3941481,3941538,3940705,3941728],"length":1,"stats":{"Line":0}},{"line":237,"address":[3941827],"length":1,"stats":{"Line":0}},{"line":238,"address":[3941981],"length":1,"stats":{"Line":0}},{"line":239,"address":[3942058,3941991],"length":1,"stats":{"Line":0}},{"line":240,"address":[3942346,3942101,3942229,3942175],"length":1,"stats":{"Line":0}},{"line":244,"address":[3942181],"length":1,"stats":{"Line":0}},{"line":247,"address":[3941881],"length":1,"stats":{"Line":0}},{"line":248,"address":[3941897,3942805,3942859] };\n\n/// Smart prompt builder for generating AI prompts for architectural issues\n#[derive(Clone)]\npub struct SmartPromptBuilder {\n    // Configuration options\n    pub use_rag: bool,\n    pub max_context_chunks: usize,\n    pub include_code_snippets: bool,\n    pub diversify_results: bool,\n}\n\nimpl Default for SmartPromptBuilder {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\nimpl SmartPromptBuilder {\n    pub fn new() -\u003e Self {\n        SmartPromptBuilder {\n            use_rag: true,\n            max_context_chunks: 5,\n            include_code_snippets: true,\n            diversify_results: true,\n        }\n    }\n\n    /// Build a prompt specifically for analyzing an architectural issue\n    pub fn build_prompt_for_issue(\u0026self, issue: \u0026ArchitecturalIssue) -\u003e String {\n        let issue_context = format!(\n            \"Anti-pattern Type ID: {}\\nDescription: {}\\nFile: {}\\nSeverity: {}\",\n            issue.anti_pattern_type_id, issue.description, issue.file_path, issue.severity\n        );\n\n        // Build basic prompt with code snippet if available\n        let mut prompt = format!(\n            \"You are an expert software architect.\\n\\\nGiven the following architectural issue, provide a detailed explanation and recommendation.\\n\\\n\\n{issue_context}\\n\"\n        );\n\n        // Add code snippet context if available and enabled\n        if self.include_code_snippets \u0026\u0026 issue.code_snippet.is_some() {\n            prompt.push_str(\u0026format!(\n                \"\\nRelevant code snippet:\\n```\\n{}\\n```\\n\",\n                issue.code_snippet.as_ref().unwrap()\n            ));\n        }\n\n        // Add response format instructions\n        prompt.push_str(\n            \"\\nRespond in the following JSON format:\\n\\\n            {\\n\\\n              \\\"title\\\": \\\"Brief title for the issue\\\",\\n\\\n              \\\"description\\\": \\\"Detailed description of the problem\\\",\\n\\\n              \\\"explanation\\\": \\\"Why this is an architectural concern\\\",\\n\\\n              \\\"refactoring\\\": \\\"Recommended solution or refactoring steps\\\",\\n\\\n              \\\"confidence\\\": \\\"high/medium/low confidence in this assessment\\\"\\n\\\n            }\\n\",\n        );\n\n        add_hallucination_mitigation(\u0026prompt)\n    }\n\n    /// Build a RAG-enhanced prompt with relevant context from codebase\n    pub fn build_rag_prompt(\n        \u0026self,\n        issue: \u0026ArchitecturalIssue,\n        vector_index: \u0026VectorIndex,\n        query_embedding: \u0026ndarray::Array1\u003cf32\u003e,\n    ) -\u003e String {\n        // Start with the basic prompt\n        let mut prompt = self.build_prompt_for_issue(issue);\n\n        if !self.use_rag {\n            return prompt;\n        }\n\n        // Get relevant context chunks from the vector index\n        let relevant_chunks = if self.diversify_results {\n            // Use maximal marginal relevance to diversify results\n            use crate::semantic_search::mmr::maximal_marginal_relevance;\n            let search_results = vector_index.search(query_embedding, self.max_context_chunks * 2);\n            // Convert search results to IndexedChunk references\n            let candidates: Vec\u003c\u0026IndexedChunk\u003e =\n                search_results.iter().map(|(chunk, _)| *chunk).collect();\n\n            // MMR returns the selected chunks directly, not indices\n            maximal_marginal_relevance(\n                query_embedding,\n                \u0026candidates,\n                0.5, // Lambda (diversity parameter) - balance between relevance and diversity\n                self.max_context_chunks, // k - number of results to return\n            )\n        } else {\n            // Just use top-k most similar chunks\n            vector_index\n                .search(query_embedding, self.max_context_chunks)\n                .into_iter()\n                .map(|(chunk, _)| chunk)\n                .collect::\u003cVec\u003c_\u003e\u003e()\n        };\n\n        // Insert the RAG context\n        if !relevant_chunks.is_empty() {\n            let context_section = format!(\n                \"\\n\\n### RELEVANT CODEBASE CONTEXT ###\\n{}\",\n                relevant_chunks\n                    .iter()\n                    .map(|chunk| format!(\n                        \"--- {} ---\\n{}\\n\",\n                        chunk.metadata.get(\"path\").unwrap_or(\u0026\"unknown\".to_string()),\n                        chunk.text\n                    ))\n                    .collect::\u003cVec\u003c_\u003e\u003e()\n                    .join(\"\\n\")\n            );\n\n            // Insert context before the response format\n            prompt.insert_str(\n                prompt.find(\"Respond in the following\").unwrap(),\n                \u0026context_section,\n            );\n        }\n\n        prompt\n    }\n}\n\n/// Add anti-hallucination guardrails to the prompt\nfn add_hallucination_mitigation(prompt: \u0026str) -\u003e String {\n    format!(\n        \"{}\\n\\nIMPORTANT: Base your explanations only on the provided information. DO NOT invent or hallucinate details not present in the issue description or context. If you're uncertain, indicate your level of confidence clearly. Focus on architectural principles and patterns that are relevant to the described issue.\",\n        prompt\n    )\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    // TODO: Add tests for SmartPromptBuilder once CustomAst is properly implemented\n    #[test]\n    fn test_smart_prompt_builder_basic() {\n        let builder = SmartPromptBuilder::new();\n        assert!(builder.use_rag);\n        assert_eq!(builder.max_context_chunks, 5);\n    }\n\n    #[test]\n    fn test_add_hallucination_mitigation_appends_instruction() {\n        let prompt = \"Explain the issue.\";\n        let mitigated = add_hallucination_mitigation(prompt);\n        assert!(mitigated\n ments","botzr","projects","uveddi","src","analysis","cache","ast.rs"],"content":"//! AST disk and memory cache for Uveddi\n\nuse serde::{Deserialize, Serialize};\nuse std::collections::HashMap;\nuse std::fs;\nuse std::path::{Path, PathBuf};\nuse std::time::SystemTime;\nuse tree_sitter::Tree;\n\n#[derive(Serialize, Deserialize)]\npub struct CacheableAst {\n    pub data: Vec\u003cu8\u003e,\n    pub timestamp: SystemTime,\n    pub language: String,\n}\n\npub struct AstCache {\n    memory_cache: HashMap\u003cPathBuf, (Tree, SystemTime)\u003e,\n    #[allow(dead_code)]\n    disk_cache_path: PathBuf,\n    max_memory_entries: usize,\n}\n\nimpl AstCache {\n    pub fn new(capacity: usize, cache_dir: PathBuf) -\u003e Self {\n        if let Err(e) = std::fs::create_dir_all(\u0026cache_dir) {\n            eprintln!(\"Warning: Failed to create cache directory: {}\", e);\n        }\n        Self {\n            memory_cache: HashMap::new(),\n            disk_cache_path: cache_dir,\n            max_memory_entries: capacity,\n        }\n    }\n\n    pub fn get(\u0026mut self, path: \u0026Path) -\u003e Option\u003cTree\u003e {\n        if let Some((tree, cached_time)) = self.memory_cache.get(path) {\n            let modified = fs::metadata(path).and_then(|m| m.modified()).ok()?;\n            if modified \u003c= *cached_time {\n                return Some(tree.clone());\n            }\n        }\n        // TODO: Implement disk cache for ASTs using a serializable representation\n        // let cache_path = self.disk_cache_path.join(format!(\"{:x}.ast\", md5::compute(path.to_string_lossy().as_bytes())));\n        // let cache_meta = fs::metadata(\u0026cache_path).ok()?;\n        // let file_meta = fs::metadata(path).ok()?;\n        // let cache_time = cache_meta.modified().ok()?;\n        // let file_time = file_meta.modified().ok()?;\n        // if file_time \u003c= cache_time {\n        //     let bytes = fs::read(\u0026cache_path).ok()?;\n        //     let tree = deserialize(\u0026b anti-pattern detector\n//!\n//! This detector implements a two-stage approach for detecting code clones:\n//! 1. **Fast Candidate Generation**: Uses token-based hashing (Karp-Rabin algorithm) to quickly identify potential duplicates\n//! 2. **AST-based Verification**: Performs structural comparison to confirm clones and classify their types\n//!\n//! ## Clone Types Detected:\n//! - **Type-1**: Exact clones (identical except for whitespace and comments)\n//! - **Type-2**: Renamed clones (identical structure, different identifiers/literals)\n//! - **Type-3**: Near-miss clones (similar structure with minor modifications)\n//!\n//! ## Architecture:\n//! - Uses Tree-sitter queries to extract function/method boundaries\n//! - Implements rolling hash for efficient fingerprinting\n//! - Maintains a global index of code blocks across all files\n//! - Provides configurable similarity thresholds\n\nuse crate::analysis::{AnalysisDetector, AnalysisError};\nuse crate::ast::tree_sitter::{ParsedFile, SourceLanguage};\nuse crate::database::models::{AntiPatternType, ArchitecturalIssue};\nuse log::{debug, info};\nuse sha2::{Digest, Sha256};\nuse std::collections::{HashMap, HashSet};\nuse std::sync::{Arc, Mutex};\nuse tree_sitter::{Query, QueryCursor};\n\n/// Represents a code block extracted for duplication analysis\n#[derive(Debug, Clone)]\npub struct CodeBlock {\n    /// Path to the file containing this code block\n    pub file_path: String,\n    /// Starting line number (1-based)\n    pub start_line: u32,\n    /// Ending line number (1-based)\n    pub end_line: u32,\n    /// Starting byte offset in the file\n    pub start_byte: usize,\n    /// Ending byte offset in the file\n    pub end_byte: usize,\n    /// Raw source code of the block\n    pub source: String,\n    /// Normalized tokens for comparison (identifiers/literals may be replaced)\n    pub normalized_tokens: Vec\u003cString\u003e,\n    /// SHA-256 hash of the normalized token sequence\n    pub structural_hash: String,\n    /// Name of the function/method if available\n    pub function_name: Option\u003cString\u003e,\n    /// Programming language of the source code\n    pub language: SourceLanguage,\n}\n\n/// Represents a detected clone pair\n#[derive(Debug, Clone)]\npub struct ClonePair {\n    /// First code block in the clone pair\n    pub block1: CodeBlock,\n    /// Second code block in the clone pair\n    pub block2: CodeBlock,\n    /// Similarity score between the blocks (0.0 to 1.0)\n    pub similarity: f64,\n    /// Classification of the clone type\n    pub clone_type: CloneType,\n    /// Number of shared fingerprints between the blocks\n    pub shared_fingerprints: usize,\n}\n\n/// Types of code clones based on their structural similarity\n#[derive(Debug, Clone, PartialEq)]\npub enum CloneType {\n    /// Exact clones - identical code except for whitespace and comments\n    Type1,\n    /// Renamed clones - identical structure with different identifiers/literals\n    Type2,\n    /// Near-miss clones - similar structure with minor modifications\n    Type3,\n}\n\n/// Configuration for the code duplication detector\n///\n/// # Examples\n///\n/// ```\n/// use uveddi::analysis::detectors::anti_patterns::code_duplication::DuplicationConfig;\n///\n/// let config = DuplicationConfig {\n///     min_tokens: 30,\n///     similarity_threshold: 0.9,\n///     ..Default::default()\n/// };\n/// ```\n#[derive(Debug, Clone)]\npub struct DuplicationConfig {\n    /// Minimum number of tokens for a code block to be considered for analysis\n    pub min_tokens: usize,\n    /// Minimum number of lines for a code block to be considered for analysis\n    pub min_lines: usize,\n    /// Similarity threshold for Type-3 clone detection (0.0 to 1.0)\n    pub similarity_threshold: f64,\n    /// Length of the rolling hash window for fingerprinting\n    pub fingerprint_length: usize,\n    /// Whether to normalize identifiers (enables Type-2 detection)\n    pub ignore_identifiers: bool,\n    /// Whether to normalize literals (enables Type-2 detection)\n    pub ignore_literals: bool,\n}\n\nimpl Default for DuplicationConfig {\n    /// Creates a default configuration optimized for general code duplication detection\n    ///\n    /// Default values:\n    /// - `min_tokens`: 50 (avoid flagging very small code blocks)\n    /// - `min_lines`: 5 (minimum 5 lines for meaningful duplication)\n    /// - `similarity_threshold`: 0.8 (80% similarity for Type-3 clones)\n    /// - `fingerprint_length`: 7 (good balance between precision and recall)\n    /// - `ignore_identifiers`: true (enable Type-2 detection)\n    /// - `ignore_literals`: true (enable Type-2 detection)\n    fn default() -\u003e Self {\n        Self {\n            min_tokens: 50, // Minimum number of tokens for a code block to be considered\n            min_lines: 5,   // Minimum number of lines for a code block\n            similarity_threshold: 0.8, // Threshold for Type-3 clone detection\n            fingerprint_length: 7, // Length of rolling hash window\n            ignore_identifiers: true, // Normalize identifiers for Type-2 detection\n            ignore_literals: true, // Normalize literals for Type-2 detection\n        }\n    }\n}\n\n/// Tree-sitter queries for extracting function/method boundaries\nconst RUST_FUNCTION_QUERY: \u0026str = r#\"\n(function_item) @function\n\"#;\n\n/// Tree-sitter query for extracting methods from impl blocks\n/// Currently unused but reserved for future impl method extraction\n#[allow(dead_code)]\nconst RUST_IMPL_METHOD_QUERY: \u0026str = r#\"\n(impl_item\n  body: (declaration_list\n    (function_item\n      name: (identifier) @name\n      body: (block) @body\n    ) @function\n  )\n)\n\"#;\n\nconst PYTHON_FUNCTION_QUERY: \u0026str = r#\"\n(function_definition\n  name: (identifier) @name\n  body: (block) @body\n) @function\n\"#;\n\nconst JAVASCRIPT_FUNCTION_QUERY: \u0026str = r#\"\n(function_declaration\n  name: (identifier) @name\n  body: (statement_block) @body\n) @function\n\"#;\n\n/// Code Duplication Detector using two-stage hybrid approach\n///\n/// This detector combines fast fingerprint-based candidate generation with\n/// precise AST-based verification to efficiently detect code clones across\n/// large codebases.\n///\n/// # Examples\n///\n/// ```\n/// use uveddi::analysis::detectors::anti_patterns::code_duplication::CodeDuplicationDetector;\n///\n/// let detector = CodeDuplicationDetector::new();\n/// // Use with AnalysisDetector trait methods\n/// ```\npub struct CodeDuplicationDetector {\n    /// Configuration parameters for the detector\n    config: DuplicationConfig,\n    /// Global index of fingerprints to code blocks for fast candidate lookup\n    fingerprint_index: Arc\u003cMutex\u003cHashMap\u003cString, Vec\u003cCodeBlock\u003e\u003e\u003e\u003e,\n    /// All analyzed code blocks for cross-file comparison\n    all_blocks: Arc\u003cMutex\u003cVec\u003cCodeBlock\u003e\u003e\u003e,\n}\n\nimpl Default for CodeDuplicationDetector {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\nimpl CodeDuplicationDetector {\n    /// Creates a new code duplication detector with default configuration\n    pub fn new() -\u003e Self {\n        Self::with_config(DuplicationConfig::default())\n    }\n\n    /// Creates a new code duplication detector with custom configuration\n    ///\n    /// # Arguments\n    ///\n    /// * `config` - Configuration parameters for the detector\n    pub fn with_config(config: DuplicationConfig) -\u003e Self {\n        Self {\n            config,\n            fingerprint_index: Arc::new(Mutex::new(HashMap::new())),\n            all_blocks: Arc::new(Mutex::new(Vec::new())),\n        }\n    }\n\n    /// Extract code blocks from a parsed file using Tree-sitter queries\n    fn extract_code_blocks(\n        \u0026self,\n        parsed_file: \u0026ParsedFile,\n    ) -\u003e Result\u003cVec\u003cCodeBlock\u003e, AnalysisError\u003e {\n        let tree = parsed_file\n            .tree\n            .as_ref()\n            .ok_or_else(|| AnalysisError::Analysis(\"No AST available for file\".to_string()))?;\n\n        let query_str = match parsed_file.language {\n            SourceLanguage::Rust =\u003e RUST_FUNCTION_QUERY,\n            SourceLanguage::Python =\u003e PYTHON_FUNCTION_QUERY,\n            SourceLanguage::JavaScript =\u003e JAVASCRIPT_FUNCTION_QUERY,\n        };\n\n        let query = Query::new(\u0026tree.language(), query_str)\n            .map_err(|e| AnalysisError::Analysis(format!(\"Failed to create query: {e}\")))?;\n\n        let mut cursor = QueryCursor::new();\n        let matches = cursor.matches(\u0026query, tree.root_node(), parsed_file.source.as_bytes());\n\n        let mut blocks = Vec::new();\n\n        for match_ in matches {\n            if let Some(function_capture) = match_.captures.iter().find(|c| c.index == 0) {\n                let function_node = function_capture.node;\n                let start_line = function_node.start_position().row as u32 + 1;\n                let end_line = function_node.end_position().row as u32 + 1;\n\n                // Skip blocks that are too small\n                if end_line - start_line \u003c self.config.min_lines as u32 {\n                    continue;\n                }\n\n                let source = function_node\n                    .utf8_text(parsed_file.source.as_bytes())\n                    .map_err(|e| AnalysisError::Analysis(format!(\"Failed to extract source: {e}\")))?\n                    .to_string();\n\n                // Extract function name by finding the identifier child\n                let mut function_name = None;\n                let mut cursor = function_node.walk();\n                if cursor.goto_first_child() {\n                    loop {\n                        let child = cursor.node();\n                        if child.kind() == \"identifier\" {\n                            if let Ok(name) = child.utf8_text(parsed_file.source.as_bytes()) {\n                                function_name = Some(name.to_string());\n                                break;\n                            }\n                        }\n                        if !cursor.goto_next_sibling() {\n                            break;\n                        }\n                    }\n                }\n\n                let normalized_tokens =\n                    self.normalize_tokens(\u0026source, parsed_file.language.clone())?;\n\n                // Skip blocks with too few tokens\n                if normalized_tokens.len() \u003c self.config.min_tokens {\n                    continue;\n                }\n\n                let structural_hash = self.compute_structural_hash(\u0026normalized_tokens);\n\n                let block = CodeBlock {\n                    file_path: parsed_file.path.to_string_lossy().to_string(),\n                    start_line,\n                    end_line,\n                    start_byte: function_node.start_byte(),\n                    end_byte: function_node.end_byte(),\n                    source,\n                    normalized_tokens,\n                    structural_hash,\n                    function_name,\n                    language: parsed_file.language.clone(),\n                };\n\n                blocks.push(block);\n            }\n        }\n\n        Ok(blocks)\n    }\n\n    /// Normalize tokens for Type-2 clone detection\n    ///\n    /// This method performs a simple tokenization of the source code and normalizes\n    /// identifiers and literals based on the configuration. In a production system,\n    /// this would use a proper lexer for more accurate tokenization.\n    ///\n    /// # Arguments\n    ///\n    /// * `source` - The source code to tokenize\n    /// * `_language` - The programming language (currently unused)\n    ///\n    /// # Returns\n    ///\n    /// A vector of normalized tokens\n    fn normalize_tokens(\n        \u0026self,\n        source: \u0026str,\n        _language: SourceLanguage,\n    ) -\u003e Result\u003cVec\u003cString\u003e, AnalysisError\u003e {\n        // Simple tokenization - in a production system, this would use a proper lexer\n        let mut tokens = Vec::new();\n        let mut current_token = String::new();\n        let mut in_string = false;\n        let mut in_comment = false;\n\n        for ch in source.chars() {\n            match ch {\n                // Handle string literals\n                '\"' | '\\'' if !in_comment =\u003e {\n                    if !current_token.is_empty() {\n                        tokens.push(self.normalize_token(\u0026current_token));\n                        current_token.clear();\n                    }\n                    in_string = !in_string;\n                    // Replace string contents with placeholder if configured\n                    if self.config.ignore_literals \u0026\u0026 in_string {\n                        tokens.push(\"_LIT_\".to_string());\n                    }\n                }\n                // Simple comment detection for C-style languages\n                '/' if !in_string \u0026\u0026 !in_comment =\u003e {\n                    in_comment = true;\n                }\n                // End of line comment\n                '\\n' if in_comment =\u003e {\n                    in_comment = false;\n                }\n                // Skip content inside strings and comments\n                _ if in_string || in_comment =\u003e {\n                    continue;\n                }\n                // Token boundary - whitespace\n                c if c.is_whitespace() =\u003e {\n                    if !current_token.is_empty() {\n                        tokens.push(self.normalize_token(\u0026current_token));\n                        current_token.clear();\n                    }\n                }\n                // Part of an identifier or keyword\n                c if c.is_alphanumeric() || c == '_' =\u003e {\n                    current_token.push(c);\n                }\n                // Operator or punctuation - treat as separate token\n                _ =\u003e {\n                    if !current_token.is_empty() {\n                        tokens.push(self.normalize_token(\u0026current_token));\n                        current_token.clear();\n                    }\n                    tokens.push(ch.to_string());\n                }\n            }\n        }\n\n        // Don't forget the last token\n        if !current_token.is_empty() {\n            tokens.push(self.normalize_token(\u0026current_token));\n        }\n\n        Ok(tokens)\n    }\n\n    /// Normalize a single token based on configuration\n    ///\n    /// This method applies normalization rules to individual tokens:\n    /// - Numeric literals are replaced with \"_LIT_\" if `ignore_literals` is true\n    /// - Identifiers are replaced with \"_ID_\" if `ignore_identifiers` is true\n    /// - Other tokens are returned as-is\n    ///\n    /// # Arguments\n    ///\n    /// * `token` - The token to normalize\n    ///\n    /// # Returns\n    ///\n    /// The normalized token string\n    fn normalize_token(\u0026self, token: \u0026str) -\u003e String {\n        // Check if it's a literal (number)\n        if token.chars().all(|c| c.is_numeric() || c == '.') \u0026\u0026 self.config.ignore_literals {\n            return \"_LIT_\".to_string();\n        }\n\n        // Check if it's an identifier (starts with letter or underscore)\n        if token\n            .chars()\n            .next()\n            .is_some_and(|c| c.is_alphabetic() || c == '_')\n            \u0026\u0026 self.config.ignore_identifiers\n        {\n            return \"_ID_\".to_string();\n        }\n\n        token.to_string()\n    }\n\n    /// Compute structural hash for a normalized token sequence\n    ///\n    /// Uses SHA-256 to create a hash of the entire token sequence. This is used\n    /// for exact matching of Type-1 and Type-2 clones.\n    ///\n    /// # Arguments\n    ///\n    /// * `tokens` - The normalized token sequence\n    ///\n    /// # Returns\n    ///\n    /// A hexadecimal string representation of the hash\n    fn compute_structural_hash(\u0026self, tokens: \u0026[String]) -\u003e String {\n        let mut hasher = Sha256::new();\n        for token in tokens {\n            hasher.update(token.as_bytes());\n        }\n        format!(\"{:x}\", hasher.finalize())\n    }\n\n    /// Generate rolling hash fingerprints for a token sequence (Karp-Rabin algorithm)\n    ///\n    /// Creates a series of hash fingerprints using a sliding window approach.\n    /// Each fingerprint represents a subsequence of tokens, enabling efficient\n    /// partial matching for clone detection.\n    ///\n    /// # Arguments\n    ///\n    /// * `tokens` - The token sequence to fingerprint\n    ///\n    /// # Returns\n    ///\n    /// A vector of fingerprint hashes as hexadecimal strings\n    fn generate_fingerprints(\u0026self, tokens: \u0026[String]) -\u003e Vec\u003cString\u003e {\n        let mut fingerprints = Vec::new();\n        let window_size = self.config.fingerprint_length;\n\n        if tokens.len() \u003c window_size {\n            return fingerprints;\n        }\n\n        for i in 0..=tokens.len() - window_size {\n            let window = \u0026tokens[i..i + window_size];\n            let mut hasher = Sha256::new();\n            for token in window {\n                hasher.update(token.as_bytes());\n            }\n            fingerprints.push(format!(\"{:x}\", hasher.finalize()));\n        }\n\n        fingerprints\n    }\n\n    /// Index code blocks by their fingerprints for fast candidate generation\n    ///\n    /// Builds an inverted index mapping fingerprints to code blocks, enabling\n    /// efficient lookup of potential clone candidates during analysis.\n    ///\n    /// # Arguments\n    ///\n    /// * `blocks` - The code blocks to index\n    ///\n    /// # Returns\n    ///\n    /// Result indicating success or failure of the indexing operation\n    fn index_code_blocks(\u0026self, blocks: \u0026[CodeBlock]) -\u003e Result\u003c(), AnalysisError\u003e {\n        let mut index = self.fingerprint_index.lock().unwrap();\n        let mut all_blocks = self.all_blocks.lock().unwrap();\n\n        for block in blocks {\n            // Add to global collection\n            all_blocks.push(block.clone());\n\n            // Generate fingerprints and add to index\n            let fingerprints = self.generate_fingerprints(\u0026block.normalized_tokens);\n            for fingerprint in fingerprints {\n                index.entry(fingerprint).or_default().push(block.clone());\n            }\n        }\n\n        Ok(())\n    }\n\n    /// Find clone candidates using fingerprint matching\n    ///\n    /// Searches the fingerprint index for code blocks that share a significant\n    /// number of fingerprints with the given block. This is the fast candidate\n    /// generation stage of the two-stage approach.\n    ///\n    /// # Arguments\n    ///\n    /// * `block` - The code block to find candidates for\n    ///\n    /// # Returns\n    ///\n    /// A vector of candidate code blocks for clone verification\n    fn find_clone_candidates(\u0026self, block: \u0026CodeBlock) -\u003e Vec\u003cCodeBlock\u003e {\n        let index = self.fingerprint_index.lock().unwrap();\n        let fingerprints = self.generate_fingerprints(\u0026block.normalized_tokens);\n\n        let mut candidates = HashMap::new();\n        let mut candidate_scores = HashMap::new();\n\n        for fingerprint in \u0026fingerprints {\n            if let Some(matching_blocks) = index.get(fingerprint) {\n                for candidate in matching_blocks {\n                    // Don't match against itself\n                    if candidate.file_path == block.file_path\n                        \u0026\u0026 candidate.start_line == block.start_line\n                    {\n                        continue;\n                    }\n\n                    let file_path = \u0026candidate.file_path line":27,"address":[4079121],"length":1,"stats":{"Line":0}},{"line":29,"address":[4079152],"length":1,"stats":{"Line":0}},{"line":34,"address":[4079175],"length":1,"stats":{"Line":0}}],"covered":0,"coverable":7},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","analysis","detectors","anti_patterns","god_object.rs"],"content":"use crate::analysis::{AnalysisDetector, AnalysisError};\nuse crate::ast::tree_sitter::{ParsedFile, SourceLanguage};\nuse crate::database::models::{AntiPatternType, ArchitecturalIssue};\nuse log::{debug, info};\nuse std::collections::HashMap;\nuse tree_sitter::{Query, QueryCursor};\n\n// --- Queries for identifying language-specific containers (classes, structs) ---\nconst PYTHON_CLASS_QUERY: \u0026str = r#\"\n(class_definition\n  name: (identifier) @name\n  body: (block) @body\n)\n\"#;\n\nconst JAVASCRIPT_CLASS_QUERY: \u0026str = r#\"\n(class_declaration\n  name: (identifier) @name\n  body: (class_body) @body\n)\n\"#;\n\nconst RUST_STRUCT_QUERY: \u0026str = r#\"\n(struct_item\n  name: (type_identifier) @name\n  body: (field_declaration_list) @body\n)\n\"#;\n\nconst RUST_IMPL_QUERY: \u0026str = r#\"\n(impl_item\n  type: (type_identifier) @name\n  body: (declaration_list) @body\n)\n\"#;\n\n// --- Queries for counting methods/functions within a container ---\nconst RUST_FUNCTION_COUNT_QUERY: \u0026str = \"(function_item)\";\nconst PYTHON_FUNCTION_COUNT_QUERY: \u0026str = \"(function_definition)\";\nconst JAVASCRIPT_FUNCTION_COUNT_QUERY: \u0026str = \"(method_definition)\";\n\n// --- Queries for counting fields/attributes within a container ---\nconst RUST_FIELD_COUNT_QUERY: \u0026str = \"(field_declaration)\";\nconst PYTHON_FIELD_COUNT_QUERY: \u0026str = r#\"(expression_statement (assignment))\"#;\nconst JAVASCRIPT_FIELD_COUNT_QUERY: \u0026str = \"(field_definition)\";\n\n/// Detects \"God Objects\" - classes or structs that have too many responsibilities.\npub struct GodObjectDetector {\n    method_threshold: usize,\n    field_threshold: usize,\n}\n\nimpl GodObjectDetector {\n    pub fn new(method_threshold: usize, field_threshold: usize) -\u003e Self {\n        Self {\n            method_threshold,\n            field_threshold,\n        }\n    }\n\n    /// Scores the severity of a God Object based on method and field counts.\n    fn score_severity(\u0026self, method_count: usize, field_count: usize) -\u003e Option\u003cString\u003e {\n        let method_excess = method_count.saturating_sub(self.method_threshold);\n        let field_excess = field_count.saturating_sub(self.field_threshold);\n\n        // Only consider it an issue if at least one threshold is exceeded.\n        if method_excess == 0 \u0026\u0026 field_excess == 0 {\n            return None;\n        }\n\n        let total_excess = method_excess + field_excess;\n        let severity = match total_excess {\n            0..=4 =\u003e \"Medium\",\n            5..=10 =\u003e \"High\",\n            _ =\u003e \"Critical\",\n        };\n        Some(severity.to_string())\n    }\n\n    /// Creates an `ArchitecturalIssue` if a God Object is detected.\n    fn create_issue(\n        \u0026self,\n        parsed_file: \u0026ParsedFile,\n        name: \u0026str,\n        name_node: tree_sitter::Node,\n        container_node: tree_sitter::Node,\n        method_count: usize,\n        field_count: usize,\n    ) -\u003e Option\u003cArchitecturalIssue\u003e {\n        self.score_severity(method_count, field_count)\n            .map(|severity| ArchitecturalIssue {\n                issue_id: None,\n                analysis_run_id: 0, // Will be set by the engine\n                anti_pattern_type_id: 1, // God Object\n                file_path: parsed_file.path.to_str().unwrap_or(\"\").to_string(),\n                start_line: Some((name_node.start_position().row + 1) as i32),\n                end_line: Some((name_node.end_position().row + 1) as i32),\n                severity,\n                description: format!(\n                    \"God Object detected: '{}' has {} methods and {} fields. (Thresholds: methods\u003e{}, fields\u003e{})\",\n                    name, method_count, field_count, self.method_threshold, self.field_threshold\n                ),\n                code_snippet: Some(\n                    container_node\n                        .utf8_text(parsed_file.source.as_bytes())\n                        .unwrap_or(\"\")\n                        .to_string(),\n                ),\n                ai_explanation: None,\n            })\n    }\n\n    /// Analyzes a file for God Objects using direct tree-sitter queries.\n    /// This is used for Python and JavaScript where class members are in one block.\n    fn analyze_standard(\n        \u0026self,\n        parsed_file: \u0026ParsedFile,\n        container_query_str: \u0026str,\n        method_query_str: \u0026str,\n        field_query_str: \u0026str,\n    ) -\u003e Result\u003cVec\u003cArchitecturalIssue\u003e, AnalysisError\u003e {\n        let mut issues = Vec::new();\n        let source = parsed_file.source.as_bytes();\n        let tree = parsed_file\n            .tree\n            .as_ref()\n            .ok_or_else(|| AnalysisError::AntiPatternDetection(\"AST tree missing\".to_string()))?;\n        let language = tree.language();\n\n        let container_query = Query::new(\u0026language, container_query_str)\n            .map_err(|e| AnalysisError::QueryError(e.to_string()))?;\n        let method_query = Query::new(\u0026language, method_query_str)\n            .map_err(|e| AnalysisError::QueryError(e.to_string()))?;\n        let field_query = Query::new(\u0026language, field_query_str)\n            .map_err(|e| AnalysisError::QueryError(e.to_string()))?;\n\n        let mut cursor = QueryCursor::new();\n        for mat in cursor.matches(\u0026container_query, tree.root_node(), source) {\n            let name_node = mat.captures[0].node;\n            let body_node = mat.captures[1].node;\n            let container_node = name_node.parent().unwrap_or(name_node);\n\n            let name = name_node.utf8_text(source).unwrap_or(\"Unnamed\");\n\n            let mut method_cursor = QueryCursor::new();\n            let method_count = method_cursor\n                .matches(\u0026method_query, body_node, source)\n                .count();\n\n            let mut field_cursor = QueryCursor::new();\n            let field_count = field_cursor\n                .matches(\u0026field_query, body_node, source)\n                .count();\n\n            debug!(\n                \"Analyzing {}: {} methods, {} fields (thresholds: \u003e{}, \u003e{})\",\n                name, method_count, field_count, self.method_threshold, self.field_threshold\n            );\n\n            if let Some(issue) = self.create_issue(\n                parsed_file,\n                name,\n                name_node,\n                container_node,\n                method_count,\n                field_count,\n            ) {\n                info!(\"Found God Object: {name}\");\n                issues.push(issue);\n            }\n        }\n        Ok(issues)\n    }\n\n    /// Analyzes a Rust file, which requires correlating `struct` and `impl` blocks.\n    fn analyze_rust(\n        \u0026self,\n        parsed_file: \u0026ParsedFile,\n    ) -\u003e Result\u003cVec\u003cArchitecturalIssue\u003e, AnalysisError\u003e {\n        let mut issues = Vec::new();\n        let source = parsed_file.source.as_bytes();\n        let tree = parsed_file\n            .tree\n            .as_ref()\n            .ok_or_else(|| AnalysisError::AntiPatternDetection(\"AST tree missing\".to_string()))?;\n        let language = tree.language();\n        let root_node = tree.root_node();\n\n        // 1. Find all impl blocks and count their methods\n        let mut impl_method_counts: HashMap\u003cString, usize\u003e = HashMap::new();\n        let impl_query = Query::new(\u0026language, RUST_IMPL_QUERY)\n            .map_err(|e| AnalysisError::QueryError(e.to yCursor::new();\n                    let field_count = field_cursor\n                        .matches(\u0026field_query, body_node, source)\n                        .count();\n\n                    if let Some(issue) = self.create_issue(\n                        parsed_file,\n                        name,\n                        name_node,\n                        container_node,\n                        method_count,\n                        field_count,\n                    ) {\n                        issues.push(issue);\n                    }\n                }\n            }\n        }\n\n        Ok(issues)\n    }\n}\n\nimpl AnalysisDetector for GodObjectDetector {\n    fn get_detector_name(\u0026self) -\u003e \u0026'static str {\n        \"GodObjectDetector\"\n    }\n\n    fn get_anti_pattern_types(\u0026self) -\u003e Vec\u003cAntiPatternType\u003e {\n        vec![AntiPatternType {\n            anti_pattern_type_id: Some(1),\n            name: \"God Object\".to_string(),\n            description: \"A class or struct that centralizes too many responsibilities, violating the Single Responsibility Principle.\".to_string(),\n            category: \"Abstraction-Based\".to_string(),\n        }]\n    }\n\n    fn detect_issues(\n        \u0026self,\n        parsed_file: \u0026ParsedFile,\n    ) -\u003e Result\u003cVec\u003cArchitecturalIssue\u003e, AnalysisError\u003e {\n        debug!(\n            \"Running God Object detection on: {}\",\n            parsed_file.path.display()\n        );\n        let result = match parsed_file.language {\n            SourceLanguage::Rust =\u003e self.analyze_rust(parsed_file),\n            SourceLanguage::Python =\u003e self.analyze_standard(\n                parsed_file,\n                PYTHON_CLASS_QUERY,\n                PYTHON_FUNCTION_COUNT_QUERY,\n                PYTHON_FIELD_COUNT_QUERY,\n            ),\n            SourceLanguage::JavaScript =\u003e self.analyze_standard(\n                parsed_file,\n                JAV node represents\n    /// a cycle.\n    ///\n    /// # Arguments\n    ///\n    /// * `graph` - A reference to the `DependencyGraph` to be analyzed.\n    /// * `analysis_run_id` - The ID of the current analysis run for associating the issues.\n    ///\n    /// # Returns\n    ///\n    /// A `Vec\u003cArchitecturalIssue\u003e` containing all the cyclic dependency issues found.\n    pub fn detect_cycles(\n        \u0026self,\n        graph: \u0026LocalDependencyGraph,\n        analysis_run_id: i64,\n    ) -\u003e Vec\u003cArchitecturalIssue\u003e {\n        let start_time = std::time::Instant::now();\n\n        let petgraph = graph.get_petgraph();\n        let sccs = tarjan_scc(\u0026petgraph);\n\n        let mut issues = Vec::new();\n\n        // Filter out SCCs with only one node (not a cycle)\n        let cycles: Vec\u003c_\u003e = sccs.into_iter().filter(|scc| scc.len() \u003e 1).collect();\n\n        for (_cycle_id, cycle) in cycles.iter().enumerate() {\n            // Get component names for the cycle description\n            let component_names: Vec\u003cString\u003e = cycle\n                .iter()\n                .map(|\u0026node_idx| {\n                    let node_ref = \u0026petgraph[node_idx];\n                    match node_ref {\n                        ComponentNode::Module { path } =\u003e path.clone(),\n                        ComponentNode::Class { name, .. } =\u003e name.clone(),\n                        ComponentNode::Function { name, .. } =\u003e name.clone(),\n                    }\n                })\n                .collect();\n\n            // Create the cycle description\n            let description = format!(\n                \"Cyclic dependency detected between components: {}\",\n                component_names.join(\" → \")\n            );\n\n            // Create an architectural issue for each component in the cycle\n            for \u0026node_idx in cycle {\n                let node_ref = \u0026petgraph[node_idx];\n\n                // Find the file path of the component\n                let file_path = match node_ref {\n                    ComponentNode::Module { path } =\u003e path.clone(),\n                    ComponentNode::Class { file_path, .. } =\u003e file_path.clone(),\n                    ComponentNode::Function { file_path, .. } =\u003e file_path.clone(),\n                };\n\n                issues.push(ArchitecturalIssue {\n                    issue_id: None,\n                    analysis_run_id,\n                    anti_pattern_type_id: 1, // Assuming 1 is cyclic dependency type\n                    file_path,\n                    start_line: Some(1), // TODO: Extract actual line numbers from AST\n                    end_line: Some(1),\n                    severity: \"high\".to_string(), // Cyclic dependencies are typically high severity\n                    description: description.clone(),\n                    code_snippet: None,   // Will be populated separately if needed\n                    ai_explanation: None, // Will be populated by AI engine\n                });\n            }\n        }\n\n        let elapsed = start_time.elapsed();\n        info!(\n            \"Cycle detection completed in {:.2?}. Found {} cycles with {} total issues.\",\n            elapsed,\n            cycles.len(),\n            issues.len()\n        );\n\n        issues\n    }\n}\n\nimpl Default for CycleDetector {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n","traces":[{"line":28,"address":[3463791,3460944,3463819],"length":1,"stats":{"Line":0}},{"line":33,"address":[3461007],"length":1,"stats":{"Line":0}},{"line":35,"address":[3461055],"length":1,"stats":{"Line":0}},{"line":36,"address":[3461072],"length":1,"stats":{"Line":0}},{"line":38,"address":[3461105],"length":1,"stats":{"Line":0}},{"line":41,"address":[3461165,3461281],"length":1,"stats":{"Line":0}},{"line":43,"address":[3461335,3461430],"length":1,"stats":{"Line":0}},{"line":45,"address":[3462450,3461705,3462411],"leng prelude::*;\nuse std::path::{Path, PathBuf};\nuse tree_sitter::{Query, QueryCursor};\n\nuse crate::ast::tree_sitter::{\n    queries::{JAVASCRIPT_IMPORTS_QUERY, PYTHON_IMPORTS_QUERY, RUST_IMPORTS_QUERY},\n    AstParser, ParsedFile, SourceLanguage,\n};\npub use crate::database::models::{Dependency, DependencyType};\n\n/// AST-based dependency extractor\npub struct DependencyExtractor {\n    parser: AstParser,\n}\n\nimpl DependencyExtractor {\n    pub fn new() -\u003e Result\u003cSelf, ExtractionError\u003e {\n        let parser = AstParser::new().map_err(ExtractionError::AstError)?;\n        Ok(Self { parser })\n    }\n\n    /// Extract dependencies from a single file using AST parsing\n    pub fn extract_from_file(\u0026self, file_path: \u0026Path) -\u003e Result\u003cVec\u003cDependency\u003e, ExtractionError\u003e {\n        let parsed_file = self\n            .parser\n            .clone()\n            .parse_file(file_path)\n            .map_err(ExtractionError::AstError)?;\n        self.extract_from_ast(\u0026parsed_file)\n    }\n\n    /// Extracts dependencies from a previously parsed file\n    pub fn extract_from_ast(\n        \u0026self,\n        parsed_file: \u0026ParsedFile,\n    ) -\u003e Result\u003cVec\u003cDependency\u003e, ExtractionError\u003e {\n        let (query_str, dependency_type) = match parsed_file.language {\n            SourceLanguage::Rust =\u003e (RUST_IMPORTS_QUERY, DependencyType::Use),\n            SourceLanguage::Python =\u003e (PYTHON_IMPORTS_QUERY, DependencyType::Import),\n            SourceLanguage::JavaScript =\u003e (JAVASCRIPT_IMPORTS_QUERY, DependencyType::Import),\n        };\n\n        let query = Query::new(\n            \u0026parsed_file\n                .tree\n                .as_ref()\n                .expect(\"AST tree missing\")\n                .language(),\n            query_str,\n        )\n        .map_err(|e| ExtractionError::QueryError(e.to_string()))?;\n\n        let mut cursor = QueryCursor::new();\n        let matches = cursor.matches(\n            \u0026query,\n            parsed_file\n                .tree\n                .as_ref()\n                .expect(\"AST tree missing\")\n                .root_node(),\n            parsed_file.source.as_bytes(),\n        );\n\n        let mut dependencies = Vec::new();\n        for mat in matches {\n            for capture in mat.captures {\n                // Only process captures named \"path\"\n                let capture_name = query.capture_names()[capture.index as usize];\n                if capture_name != \"path\" {\n                    continue;\n                }\n\n                let node = capture.node;\n                let line_number = node.start_position().row + 1;\n                let mut module_name = node\n                    .utf8_text(parsed_file.source.as_bytes())\n                    .unwrap_or(\"\")\n                    .to_string();\n\n                // For Rust, resolve `mod` statements to file paths\n                if parsed_file.language == SourceLanguage::Rust\n                    \u0026\u0026 dependency_type == DependencyType::Use\n                {\n                    let mut potential_path = parsed_file.path.parent().unwrap().join(\u0026module_name);\n                    if !potential_path.exists() {\n                        potential_path.set_extension(\"rs\");\n                        if !potential_path.exists() {\n                            // Check for module/mod.rs\n                            let mod_path = parsed_file\n                                .path\n                                .parent()\n                                .unwrap()\n                                .join(\u0026module_name)\n                                .join(\"mod.rs\");\n                            if mod_path.exists() {\n                                potential_path = mod_path;\n                            }\n                        }\n                    }\n                    if potential_path.exists() {\n                        module_name = potential_path.to_string_lossy().into_owned();\n                    }\n                }\n\n                // Clean up the module name (e.g., remove quotes from strings)\n                if module_name.starts_with('\"') \u0026\u0026 module_name.ends_with('\"')\n                    || module_name.starts_with('\\'') \u0026\u0026 module_name.ends_with('\\'')\n                {\n                    module_name = module_name[1..module_name.len() - 1].to_string();\n                }\n\n                // Normalize JS/TS import paths to match file stem (e.g., './b.js' -\u003e 'b')\n                if let SourceLanguage::JavaScript = parsed_file.language {\n                    if module_name.starts_with(\"./\") {\n                        let name = module_name.trim_start_matches(\"./\");\n                        if let Some(stripped) = name.strip_suffix(\".js\") {\n                            module_name = stripped.to_string();\n                        } else if let Some(stripped) = name.strip_suffix(\".ts\") {\n                            module_name = stripped.to_string();\n                        } else {\n                            module_name = name.to_string();\n                        }\n                    }\n                }\n\n                if let SourceLanguage::Rust = parsed_file.language {\n                    if let Some(parent) = parsed_file.path.parent() {\n                        let mut path = parent.join(\u0026module_name);\n                        if !path.exists() {\n                            path.set_extension(\"rs\");\n                        }\n                        if path.exists() {\n                            module_name = path.to_string_lossy().to_string();\n                        }\n                    }\n                }\n\n                dependencies.push(Dependency {\n                    from_file: parsed_file.path.clone(),\n                    to_module: module_name,\n                    dependency_type: dependency_type.clone(),\n                    line_number: Some(line_number as u32),\n                });\n            }\n        }\n\n        debug!(\n            \"Extracted {} dependencies from {}\",\n            dependencies.len(),\n            parsed_file.path.display()\n        );\n        Ok(dependencies)\n    }\n\n    /// Extract dependencies from multiple files in parallel using rayon for performance\n    pub fn extract_from_files_parallel(\n        \u0026mut self,\n        file_paths: \u0026[\u0026std::path::Path],\n    ) -\u003e Vec\u003cResult\u003cVec\u003cDependency\u003e, ExtractionError\u003e\u003e {\n        file_paths\n            .par_iter()\n            .map(|path| self.extract_from_file(path))\n            .collect()\n    }\n}\n\n#[derive(thiserror::Error, Debug)]\npub enum ExtractionError {\n    #[error(\"AST error: {0}\")]\n    AstError(#[from] crate::ast::tree_sitter::AstError),\n    #[error(\"Query error: {0}\")]\n    QueryError(String),\n    #[error(\"IO error reading {0}: {1}\")]\n    IoError(PathBuf, std::io::Error),\n}\n","traces":[{"line":18,"address":[3469456],"length":1,"stats":{"Line":0}},{"line":19,"address":[3469473],"length":1,"stats":{"Line":0}},{"line":20,"address":[3469634],"length":1,"stats":{"Line":0}},{"line":24,"address":[3470194,3470188,3469696],"length":1,"stats":{"Line":0}},{"line":25,"address":[3469987,3469852,3469752],"length":1,"stats":{"Line":0}},{"line":29,"address":[3469808,3470081,3469939,3470207],"length":1,"stats":{"Line":0}},{"line":30,"address":[3470148],"length":1,"stats":{"Line":0}},{"line":34,"address":[3477500,3470224,3474378],"length":1,"stats":{"Line":0}},{"line":38,"address":[3470496,3470271],"length":1,"stats":{"Line":0}},{"line":39,"address":[3470337],"length":1,"stats":{"Line":0}},{"line":40,"address":[3470388],"length":1,"stats":{"Line":0}},{"line":41,"address":[3470439],"length":1,"stats":{"Line":0}},{"line":45,"address":[3470558],"length":1,"stats":{"Line":0}},{"line":52,"address":[3
