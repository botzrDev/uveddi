 // Create programmatically\n//! let config = Config {\n//!     ollama_model: Some(\"codellama:7b-instruct\".to_string()),\n//! };\n//! # Ok::\u003c(), Box\u003cdyn std::error::Error\u003e\u003e(())\n//! ```\n\nuse serde::{Deserialize, Serialize};\nuse std::{env, fs};\n\n/// Main configuration structure for Uveddi\n///\n/// Contains all configuration options that can be customized by users.\n/// All fields are optional to allow partial configuration and fallback\n/// to sensible defaults.\n///\n/// # Fields\n///\n/// * `ollama_model` - Optional model name for Ollama AI provider\n#[derive(Debug, Serialize, Deserialize, Clone)]\npub struct Config {\n    /// The Ollama model to use for AI-powered analysis\n    ///\n    /// Examples: \"deepseek-coder:6.7b-instruct-q4_0\", \"codellama:7b-instruct\"\n    pub ollama_model: Option\u003cString\u003e,\n}\n\nimpl Config {\n    /// Creates a new Config instance by loading values from environment variables.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if any of the required environment variables are not set.\n    pub fn from_env() -\u003e Result\u003cSelf, env::VarError\u003e {\n        let ollama_model = env::var(\"OLLAMA_MODEL\").ok();\n        Ok(Config { ollama_model })\n    }\n\n    /// Creates a new Config instance by loading values from a file.\n    ///\n    /// # Arguments\n    ///\n    /// * `path` - A string slice that represents the path to the configuration file.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the file cannot be read or if the contents cannot be parsed.\n    pub fn from_file(path: \u0026str) -\u003e Result\u003cSelf, Box\u003cdyn std::error::Error\u003e\u003e {\n        let content = fs::read_to_string(path)?;\n        let config: Config = toml::from_str(\u0026content)?;\n        Ok(config)\n    }\n}\n\n/// Provides an abstraction for database operations, allowing for easier testing and swapping of implementations.\n///\n/// # Example\n/// ```rust\n/// use uveddi::config::DatabaseService;\n/// struct MyDb;\n/// impl DatabaseService for MyDb {\n///     fn get_or_create_project_id(\u0026self, project_path: \u0026std::path::Path) -\u003e rusqlite::Result\u003ci64\u003e { unimplemented!() }\n///     fn create_analysis_run(\u0026self, project_path: \u0026std::path::Path) -\u003e rusqlite::Result\u003cuveddi::database::models::AnalysisRun\u003e { unimplemented!() }\n///     fn update_analysis_run(\u0026self, run: \u0026uveddi::database::models::AnalysisRun) -\u003e rusqlite::Result\u003c()\u003e { unimplemented!() }\n///     fn store_anti_pattern_type(\u0026self, anti_pattern_type: \u0026mut uveddi::database::models::AntiPatternType) -\u003e rusqlite::Result\u003c()\u003e { unimplemented!() }\n///     fn store_issues(\u0026mut self, issues: \u0026[uveddi::database::models::ArchitecturalIssue]) -\u003e rusqlite::Result\u003c()\u003e { unimplemented!() }\n/// }\n/// ```\npub trait DatabaseService {\n    /// Gets or creates a project ID for the given path.\n    fn get_or_create_project_id(\u0026self, project_path: \u0026std::path::Path) -\u003e rusqlite::Result\u003ci64\u003e;\n    /// Creates a new analysis run for the given project.\n    fn create_analysis_run(\n        \u0026self,\n        project_path: \u0026std::path::Path,\n    ) -\u003e rusqlite::Result\u003ccrate::database::models::AnalysisRun\u003e;\n    /// Updates an existing analysis run.\n    fn update_analysis_run(\n        \u0026self,\n        run: \u0026crate::database::models::AnalysisRun,\n    ) -\u003e rusqlite::Result\u003c()\u003e;\n    /// Stores a new anti-pattern type.\n    fn store_anti_pattern_type(\n        \u0026self,\n        anti_pattern_type: \u0026mut crate::database::models::AntiPatternType,\n    ) -\u003e rusqlite::Result\u003c()\u003e;\n    /// Stores architectural issues in the database.\n    fn store_issues(\n        \u0026mut self,\n        issues: \u0026[crate::database::models::ArchitecturalIssue],\n    ) -\u003e rusqlite::Result\u003c()\u003e;\n}\n\n/// Provides an abstraction for AI-powered analysis engines.\n///\n/// This trait allows for different AI providers or mock engines to be used interchangeably.\npub trait AiEngineService {\n    /// Analyzes the given codebase path.\n    fn analyze(\u0026self, codebase_path: \u0026str) -\u003e Result\u003c(), crate::error::UveddiError\u003e;\n    /// Analyzes a single architectural issue asynchronously.\n    fn analyze_issue(\n        \u0026self,\n        issue: \u0026mut crate::database::models::ArchitecturalIssue,\n    ) -\u003e std::pin::Pin\u003c\n        Box\u003cdyn std::future::Future\u003cOutput = Result\u003c(), crate::error::UveddiError\u003e\u003e + Send\u003e,\n    \u003e;\n}\n\n/// Provides an abstraction for AST parsing services.\n///\n/// Enables the use of different AST backends or mocks for testing.\npub trait AstService {\n    /// Parses a file and returns a parsed AST representation.\n    fn parse_file(\n        \u0026self,\n        file_path: \u0026std::path::Path,\n    ) -\u003e Result\u003ccrate::ast::tree_sitter::ParsedFile, crate::error::UveddiError\u003e;\n}\n\n/// Provides an abstraction for security checks and permission validation.\n///\n/// This trait allows for custom or mock security policies in tests and production.\npub trait SecurityService {\n    /// Validates an API key for access control.\n    fn validate_api_key(\u0026self, api_key: \u0026str) -\u003e bool;\n    /// Checks if the given action is permitted on a resource.\n    fn check_permissions(\u0026self, resource: \u0026str, action: \u0026str) -\u003e bool;\n}\n","traces":[{"line":67,"address":[3775088],"length":1,"stats":{"Line":0}},{"line":68,"address":[3775102],"length":1,"stats":{"Line":0}},{"line":69,"address":[3775151],"length":1,"stats":{"Line":0}},{"line":81,"address":[3775805,3775811,3775232],"length":1,"stats":{"Line":0}},{"line":82,"address":[3775265],"length":1,"stats":{"Line":0}},{"line":83,"address":[3775479,3775413],"length":1,"stats":{"Line":0}},{"line":84,"address":[3775733],"length":1,"stats":{"Line":0}}],"covered":0,"coverable":7},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","database","crud.rs"],"content":"use crate::database::models::{AnalysisRun, AntiPatternType, ArchitecturalIssue};\nuse chrono::Utc;\nuse rusqlite::{Connection, Result};\nuse std::path::Path;\n\npub struct Database {\n    conn: Connection,\n}\n\nimpl Database {\n    /// Creates a new database connection and initializes tables if needed.\n    ///\n    /// # Arguments\n    ///\n    /// * `db_path` - Optional path to the SQLite database file. If `None`, uses an in-memory database.\n    ///\n    /// # Returns\n    ///\n    /// * `Ok(Database)` - The initialized database instance.\n    /// * `Err(rusqlite::Error)` - If the database cannot be opened or initialized.\n    pub fn new(db_path: Option\u003c\u0026Path\u003e) -\u003e Result\u003cSelf\u003e {\n        let conn = match db_path {\n            Some(path) =\u003e Connection::open(path)?,\n            None =\u003e Connection::open_in_memory()?,\n        };\n        conn.execute_batch(\"\n            CREATE TABLE IF NOT EXISTS analysis_runs (\n                run_id INTEGER PRIMARY KEY AUTOINCREMENT,\n                project_id INTEGER NOT NULL,\n                start_time TEXT NOT NULL,\n                end_time TEXT,\n                status TEXT NOT NULL,\n                total_files_analyzed INTEGER,\n                total_issues_found INTEGER,\n                analysis_config TEXT NOT NULL\n            );\n            CREATE TABLE IF NOT EXISTS anti_pattern_types (\n                anti_pattern_type_id INTEGER PRIMARY KEY AUTOINCREMENT,\n                name TEXT NOT NULL UNIQUE,\n                description TEXT NOT NULL,\n                category TEXT NOT NULL\n            );\n            CREATE TABLE IF NOT EXISTS architectural_issues (\n                issue_id INTEGER PRIMARY KEY AUTOINCREMENT,\n                analysis_run_id INTEGER NOT NULL,\n                anti_pattern_type_id INTEGER NOT NULL,\n                file_path TEXT NOT NULL,\n                start_line INTEGER,\n                end_line INTEGER,\n                severity TEXT NOT NULL,\n                description TEXT NOT NULL,\n                code_snippet TEXT,\n                ai_explanation TEXT,\n                FOREIGN KEY (analysis_run_id) REFERENCES analysis_runs(run_id),\n                FOREIGN KEY (anti_pattern_type_id) REFERENCES anti_pattern_types(anti_pattern_type_id)\n            );\n            CREATE TABLE IF NOT EXISTS projects (\n                project_id INTEGER PRIMARY KEY AUTOINCREMENT,\n                path TEXT NOT NULL UNIQUE\n            );\n        \")?;\n        Ok(Self { conn })\n    }\n\n    /// Gets the project ID for the given path, creating a new project entry if needed.\n    ///\n    /// # Arguments\n    ///\n    /// * `project_path` - Path to the project directory.\n    ///\n    /// # Returns\n    ///\n    /// * `Ok(i64)` - The project ID.\n    /// * `Err(rusqlite::Error)` - If the query or insert fails.\n    pub fn get_or_create_project_id(\u0026self, project_path: \u0026Path) -\u003e Result\u003ci64\u003e {\n        let path_str = project_path.to_string_lossy().to_string();\n        let mut stmt = self\n            .conn\n            .prepare(\"SELECT project_id FROM projects WHERE path = ?\")?;\n        let mut rows = stmt.query([\u0026path_str])?;\n\n        if let Some(row) = rows.next()? {\n            Ok(row.get(0)?)\n        } else {\n            self.conn\n                .execute(\"INSERT INTO projects (path) VALUES (?)\", [\u0026path_str])?;\n            Ok(self.conn.last_insert_rowid())\n        }\n    }\n\n    /// Creates a new analysis run entry for the given project path.\n    ///\n    /// # Arguments\n    ///\n    /// * `project_path` - Path to the project directory.\n    ///\n    /// # Returns\n    ///\n    /// * `Ok(AnalysisRun)` - The created analysis run record.\n    /// * `Err(rusqlite::Error)` - If the insert fails.\n    pub fn create_analysis_run(\u0026self, project_path: \u0026Path) -\u003e Result\u003cAnalysisRun\u003e {\n        let project_id = self.get_or_create_project_id(project_path)?;\n        let analysis_run = AnalysisRun {\n            run_id: None,\n            project_id,\n            start_time: Utc::now(),\n            end_time: None,\n            status: \"running\".to_string(),\n            total_files_analyzed: None,\n            total_issues_found: None,\n            analysis_config: \"{}\".to_string(), // Default empty JSON config\n        };\n\n        self.conn.execute(\n            \"INSERT INTO analysis_runs (project_id, start_time, status, analysis_config) VALUES (?, ?, ?, ?)\",\n            rusqlite::params![\n                analysis_run.project_id,\n                analysis_run.start_time.to_rfc3339(),\n                analysis_run.status,\n                analysis_run.analysis_config,\n            ],\n        )?;\n\n        let last_id = self.conn.last_insert_rowid();\n        Ok(AnalysisRun {\n            run_id: Some(last_id),\n            ..analysis_run\n        })\n    }\n\n    /// Updates an existing analysis run with new status, end time, and metrics.\n    ///\n    /// # Arguments\n    ///\n    /// * `run` - The analysis run to update (must have a valid `run_id`).\n    ///\n    /// # Returns\n    ///\n    /// * `Ok(())` - If the update succeeds.\n    /// * `Err(rusqlite::Error)` - If the update fails.\n    pub fn update_analysis_run(\u0026self, run: \u0026AnalysisRun) -\u003e Result\u003c()\u003e {\n        self.conn.execute(\n            \"UPDATE analysis_runs SET end_time = ?, status = ?, total_files_analyzed = ?, total_issues_found = ? WHERE run_id = ?\",\n            rusqlite::params![\n                run.end_time.map(|dt| dt.to_rfc3339()),\n                run.status,\n                run.total_files_analyzed,\n                run.total_issues_found,\n                run.run_id,\n            ],\n        )?;\n        Ok(())\n    }\n\n    /// Stores a single anti-pattern type in the database, updating its ID if newly inserted.\n    ///\n    /// # Arguments\n    ///\n    /// * `anti_pattern_type` - The anti-pattern type to store (ID will be set if inserted).\n    ///\n    /// # Returns\n    ///\n    /// * `Ok(())` - If the operation succeeds.\n    /// * `Err(rusqlite::Error)` - If the insert or query fails.\n    pub fn store_anti_pattern_type(\u0026self, anti_pattern_type: \u0026mut AntiPatternType) -\u003e Result\u003c()\u003e {\n        self.conn.execute(\n            \"INSERT OR IGNORE INTO anti_pattern_types (name, description, category) VALUES (?, ?, ?)\",\n            rusqlite::params![\n                anti_pattern_type.name,\n                anti_pattern_type.description,\n                anti_pattern_type.category,\n            ],\n        )?;\n        if anti_pattern_type.anti_pattern_type_id.is_none() {\n            let mut stmt = self\n                .conn\n                .prepare(\"SELECT anti_pattern_type_id FROM anti_pattern_types WHERE name = ?\")?;\n            anti_pattern_type.anti_pattern_type_id =\n                Some(stmt.query_row([\u0026anti_pattern_type.name], |row| row.get(0))?);\n        }\n        Ok(())\n    }\n\n    /// Stores architectural issues in a transaction to ensure data consistency.\n    ///\n    /// # Arguments\n    ///\n    /// * `issues` - Slice of architectural issues to store.\n    ///\n    /// # Returns\n    ///\n    /// * `Ok(())` - If all issues are stored successfully.\n    /// * `Err(rusqlite::Error)` - If any insert fails.\n    pub fn store_issues(\u0026mut self, issues: \u0026[ArchitecturalIssue]) -\u003e Result\u003c()\u003e {\n        let tx = self.conn.transaction()?;\n        for issue in issues {\n            tx.execute(\n                \"INSERT INTO architectural_issues (analysis_run_id, anti_pattern_type_id, file_path, start_line, end_line, severity, description, code_snippet, ai_explanation) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)\",\n                rusqlite::params![\n                    issue.analysis_run_id,\n                    issue.anti_pattern_type_id,\n                    issue.file_path,\n                    issue.start_line,\n                    issue.end_line,\n                    issue.severity,\n                    issue.description,\n                    issue.code_snippet,\n                    issue.ai_explanation,\n                ],\n            )?;\n        }\n        tx.commit()\n    }\n\n    /// Stores multiple anti-pattern types in a batch operation.\n    ///\n    /// # Arguments\n    ///\n    /// * `anti_pattern_types` - Mutable slice of anti-pattern types to store (IDs will be set if inserted).\n    ///\n    /// # Returns\n    ///\n    /// * `Ok(())` - If all types are stored successfully.\n    /// * `Err(rusqlite::Error)` - If any insert or query fails.\n    pub fn store_anti_pattern_types_batch(\n        \u0026mut self,\n        anti_pattern_types: \u0026mut [AntiPatternType],\n    ) -\u003e Result\u003c()\u003e {\n        let tx = self.conn.transaction()?;\n        {\n            let mut stmt = tx.prepare(\n                \"INSERT OR IGNORE INTO anti_pattern_types (name, description, category) VALUES (?, ?, ?)\"\n            )?;\n            for anti_pattern_type in anti_pattern_types.iter_mut() {\n                stmt.execute(rusqlite::params![\n                    anti_pattern_type.name,\n                    anti_pattern_type.description,\n                    anti_pattern_type.category,\n                ])?;\n                if anti_pattern_type.anti_pattern_type_id.is_none() {\n                    let mut id_stmt = tx.prepare(\n                        \"SELECT anti_pattern_type_id FROM anti_pattern_types WHERE name = ?\",\n                    )?;\n                    anti_pattern_type.anti_pattern_type_id =\n                        Some(id_stmt.query_row([\u0026anti_pattern_type.name], |row| row.get(0))?);\n                }\n            }\n        }\n        tx.commit()?;\n        Ok(())\n    }\n}\n","traces":[{"line":21,"address":[3821811,3821040,3821817],"length":1,"stats":{"Line":0}},{"line":22,"address":[3821066],"length":1,"stats":{"Line":0}},{"line":23,"address":[3821094,3821390],"length":1,"stats":{"Line":0}},{"line":24,"address":[3821179],"length":1,"stats":{"Line":0}},{"line":26,"address":[3821338,3821546,3821678],"length":1,"stats":{"Line":0}},{"line":62,"address":[3821704],"length":1,"stats":{"Line":0}},{"line":75,"address":[3821840,3823768,3823774],"length":1,"stats":{"Line":0}},{"line":76,"address":[3821922],"length":1,"stats":{"Line":0}},{"line":77,"address":[3822051,3822205,3823816],"length":1,"stats":{"Line":0}},{"line":80,"address":[3822493,3822396],"length":1,"stats":{"Line":0}},{"line":82,"address":[3823608,3822719,3823734,3822770],"length":1,"stats":{"Line":0}},{"line":83,"address":[3823362,3823143,3822995],"length":1,"stats":{"Line":0}},{"line":85,"address":[3823729,3823519,3823041,3823386],"length":1,"stats":{"Line":0}},{"line":86,"address":[3823033,3823455],"length":1,"stats":{"Line":0}},{"line":87,"address":[3823569],"length":1,"stats":{"Line":0}},{"line":101,"address":[3825266,3825272,3823824],"length":1,"stats":{"Line":0}},{"line":102,"address":[3823870],"length":1,"stats":{"Line":0}},{"line":106,"address":[3824021],"length":1,"stats":{"Line":0}},{"line":108,"address":[3824049],"length":1,"stats":{"Line":0}},{"line":111,"address":[3824110],"length":1,"stats":{"Line":0}},{"line":114,"address":[3824599,3824688,3824821],"length":1,"stats":{"Line":0}},{"line":116,"address":[3824497],"length":1,"stats":{"Line":0}},{"line":118,"address":[3824424],"length":1,"stats":{"Line":0}},{"line":124,"address":[3824890],"length":1,"stats":{"Line":0}},{"line":125,"address":[3824940],"length":1,"stats":{"Line":0}},{"line":126,"address":[3824920],"length":1,"stats":{"Line":0}},{"line":141,"address":[3825296,3825836,3825830],"length":1,"stats":{"Line":0}},{"line":142,"address":[3825534,3825620,3825731],"l overable":56},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","database","mod.rs"],"content":"//! Database Layer for Uveddi\n//!\n//! This module provides comprehensive database functionality for persisting analysis\n//! results, project metadata, and architectural insights. It uses SQLite for local\n//! storage with support for both in-memory and file-based databases.\n//!\n//! # Architecture\n//!\n//! The database layer is organized into several key components:\n//!\n//! - **Models**: Data structures representing database entities\n//! - **CRUD Operations**: Create, Read, Update, Delete operations\n//! - **Migrations**: Database schema management\n//! - **Connection Management**: Database connection pooling and lifecycle\n//!\n//! # Key Features\n//!\n//! - **Analysis Persistence**: Store analysis runs and their results\n//! - **Issue Tracking**: Track architectural issues and anti-patterns\n//! - **Project Management**: Manage project metadata and history\n//! - **Performance Optimization**: Efficient queries and indexing\n//!\n//! # Usage\n//!\n//! ```rust,no_run\n//! use uveddi::database::Database;\n//! use std::path::Path;\n//!\n//! // Initialize database\n//! let db = Database::new(\"analysis.db\")?;\n//!\n//! // Create a new analysis run\n//! let project_path = Path::new(\"./src\");\n//! let run = db.create_analysis_run(project_path)?;\n//!\n//! println!(\"Created analysis run with ID: {}\", run.id);\n//! # Ok::\u003c(), Box\u003cdyn std::error::Error\u003e\u003e(())\n//! ```\n//!\n//! # Database Schema\n//!\n//! The database schema includes tables for:\n//! - `projects`: Project metadata and paths\n//! - `analysis_runs`: Individual analysis executions\n//! - `anti_pattern_types`: Definitions of detectable anti-patterns\n//! - `architectural_issues`: Specific issues found during analysis\n//! - `dependencies`: Code dependency relationships\n//!\n//! See the [`models`] module for detailed entity definitions.\n\npub mod crud;\npub mod models;\n\npub use self::crud::Database;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","database","models.rs"],"content":"//! Database Models for Uveddi\n//!\n//! This module defines the data structures that represent entities in the Uveddi database.\n//! These models correspond to the database schema and are used for serialization,\n//! deserialization, and data transfer between application layers.\n//!\n//! # Entity Relationships\n//!\n//! The models follow this relationship hierarchy:\n//! - **Project** → **AnalysisRun** → **ArchitecturalIssue**\n//! - **AntiPatternType** ← **ArchitecturalIssue**\n//! - **Dependency** (standalone, linked by analysis run)\n//!\n//! # Serialization\n//!\n//! All models implement `Serialize` and `Deserialize` for JSON export/import\n//! and API compatibility. This enables easy integration with reporting systems\n//! and external tools.\n//!\n//! # Usage\n//!\n//! ```rust\n//! use uveddi::database::models::{AnalysisRun, ArchitecturalIssue};\n//! use chrono::Utc;\n//!\n//! // Create a new analysis run\n//! let run = AnalysisRun {\n//!     run_id: None,\n//!     project_id: 1,\n//!     start_time: Utc::now(),\n//!     end_time: None,\n//!     status: \"running\".to_string(),\n//!     total_files_analyzed: None,\n//!     total_issues_found: None,\n//!     analysis_config: \"{}\".to_string(),\n//! };\n//! ```\n\nuse chrono::{DateTime, Utc};\nuse serde::{Deserialize, Serialize};\nuse std::collections::HashMap;\nuse std::path::PathBuf;\n\n/// Core analysis run tracking entity\n///\n/// Represents a single execution of the analysis engine on a project.\n/// This is the primary entity that groups all analysis results and\n/// tracks execution metadata.\n///\n/// # Database Mapping\n///\n/// Maps to the `analysis_runs` table in the database schema.\n///\n/// # Status Values\n///\n/// - `\"running\"`: Analysis is currently in progress\n/// - `\"completed\"`: Analysis finished successfully\n/// - `\"failed\"`: Analysis encountered an error and stopped\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct AnalysisRun {\n    /// Unique identifier for this analysis run (auto-generated)\n    pub run_id: Option\u003ci64\u003e,\n    /// Foreign key reference to the project being analyzed\n    pub project_id: i64,\n    /// Timestamp when the analysis started\n    pub start_time: DateTime\u003cUtc\u003e,\n    /// Timestamp when the analysis completed (None if still running)\n    pub end_time: Option\u003cDateTime\u003cUtc\u003e\u003e,\n    /// Current status of the analysis run\n    pub status: String,\n    /// Total number of source files processed\n    pub total_files_analyzed: Option\u003ci32\u003e,\n    /// Total number of issues detected across all files\n    pub total_issues_found: Option\u003ci32\u003e,\n    /// JSON-serialized configuration used for this analysis\n    pub analysis_config: String,\n}\n\n/// Architectural issue detected during analysis\n///\n/// Represents a specific code quality issue, anti-pattern, or architectural\n/// problem identified by the analysis engine. Each issue is associated with\n/// a particular analysis run and anti-pattern type.\n///\n/// # Database Mapping\n///\n/// Maps to the `architectural_issues` table in the database schema.\n///\n/// # Severity Levels\n///\n/// - `\"low\"`: Minor issues that don't significantly impact maintainability\n/// - `\"medium\"`: Moderate issues that should be addressed over time  \n/// - `\"high\"`: Important issues that impact code quality\n/// - `\"critical\"`: Severe issues that require immediate attention\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct ArchitecturalIssue {\n    /// Unique identifier for this issue (auto-generated)\n    pub issue_id: Option\u003ci64\u003e,\n    /// Foreign key reference to the analysis run that found this issue\n    pub analysis_run_id: i64,\n    /// Foreign key reference to the type of anti-pattern detected\n    pub anti_pattern_type_id: i64,\n    /// Path to the file where this issue was found\n    pub file_path: String,\n    /// Starting line number of the problematic code (optional)\n    pub start_line: Option\u003ci32\u003e,\n    /// Ending line number of the problematic code (optional)\n    pub end_line: Option\u003ci32\u003e,\n    /// Severity level of this issue\n    pub severity: String,\n    /// Human-readable description of the issue\n    pub description: String,\n    /// Optional code snippet showing the problematic code\n    pub code_snippet: Option\u003cString\u003e,\n    /// Optional AI-generated explanation and remediation advice\n    pub ai_explanation: Option\u003cString\u003e,\n}\n\n/// Dependency relationship between code modules\n///\n/// Represents a dependency edge in the codebase dependency graph.\n/// Dependencies track how different parts of the code reference each other,\n/// enabling architectural analysis and cycle detection.\n///\n/// # Usage in Analysis\n///\n/// Dependencies are used for:\n/// - Cycle detection in module relationships\n/// - Architectural pattern recognition\n/// - Impact analysis for changes\n/// - Complexity measurement\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]\npub struct Dependency {\n    /// Path to the source file that has the dependency\n    pub from_file: PathBuf,\n    /// Name or path of the target module being depended upon\n    pub to_module: String,\n    /// Type of dependency relationship\n    pub dependency_type: DependencyType,\n    /// Line number where the dependency is declared (optional)\n    pub line_number: Option\u003cu32\u003e,\n}\n\n/// Types of dependency relationships\n///\n/// Categorizes different ways that code can depend on other code,\n/// enabling more sophisticated analysis of architectural patterns.\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize, Eq)]\npub enum DependencyType {\n    /// Rust `use` statement or similar language-specific import\n    Use,\n    /// Rust `mod` declaration for module inclusion\n    Mod,\n    /// External crate/package dependency\n    External,\n    /// Generic import statement (Python, JavaScript, etc.)\n    Import,\n}\n\n/// Anti-pattern type definitions\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct AntiPatternType {\n    pub anti_pattern_type_id: Option\u003ci64\u003e,\n    pub name: String,\n    pub description: String,\n    pub category: String, // \"structural\", \"behavioral\", \"creational\"\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","engine.rs"],"content":"//! Engine module for Uveddi\n//!\n//! This module is intended to provide the main orchestration logic for codebase analysis.\n//! (Currently a stub. Implement analysis engine logic here.)\n\n\nlet _codebase_path = /* existing code */;","traces":[],"covered":0,"coverable":0},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","error.rs"],"content":"//! Error types and error handling for Uveddi\n//!\n//! This module defines the unified error type [`UveddiError`] used throughout the codebase.\n//! All fallible operations should return `Result\u003cT, UveddiError\u003e`. Error variants cover\n//! filesystem, database, AST parsing, AI provider, report generation, and configuration errors.\n//!\n//! [`UveddiError`]: enum.UveddiError.html\n\nuse crate::analysis::detectors::dependency::ExtractionError;\nuse thiserror::Error;\n\n/// Unified error type for all Uveddi operations with comprehensive documentation\n#[derive(Debug, Error)]\npub enum UveddiError {\n    // === Path and File System Errors ===\n    #[error(\"Path not found: {0}\")]\n    PathNotFound(String),\n    #[error(\"Invalid input path: {path}\")]\n    InvalidInputPath { path: std::path::PathBuf },\n    #[error(\"IO error: {0}\")]\n    Io(#[from] std::io::Error),\n\n    // === Database Errors ===\n    #[error(\"Database error: {0}\")]\n    Database(#[from] rusqlite::Error),\n\n    // === AST Parsing Errors ===\n    #[error(\"AST parsing error: {0}\")]\n    AstParsing(String),\n    #[error(\"Tree-sitter query error: {0}\")]\n    QueryError(String),\n    #[error(\"Language not supported: {0}\")]\n    UnsupportedLanguage(String),\n\n    #[error(\"Analysis error: {0}\")]\n    Analysis(String),\n\n    #[error(\"Anti-pattern detection error: {0}\")]\n    AntiPatternDetection(String),\n\n    // === AI Provider Errors ===\n    #[error(\"AI API error: {provider}: {message}\")]\n    AiApi { provider: String, message: String },\n    #[error(\"AI context building error: {0}\")]\n    AiContext(String),\n    #[error(\"AI response parsing error: {0}\")]\n    AiResponseParsing(String),\n    #[error(\"No AI providers available\")]\n    NoAiProviders,\n\n    // === Report Generation Errors ===\n    #[error(\"Report generation error: {0}\")]\n    ReportGeneration(String),\n    #[error(\"Unsupported output format: {0}\")]\n    UnsupportedOutputFormat(String),\n    #[error(\"JSON serialization error: {0}\")]\n    JsonSerialization(#[from] serde_json::Error),\n\n    // === Configuration Errors ===\n    #[error(\"Configuration error: {0}\")]\n    Configuration(String),\n    #[error(\"Missing required configuration: {0}\")]\n    MissingConfiguration(String),\n    #[error(\"CLI argument error: {0}\")]\n    Clap(#[from] clap::Error),\n    #[error(\"TOML parsing error: {0}\")]\n    Toml(#[from] toml::de::Error),\n\n    #[error(\"Plugin error: {0}\")]\n    PluginError(String),\n    // WASM error conversion temporarily disabled for debugging\n    // #[error(\"WASM runtime error: {0}\")]\n    // WasmRuntimeError(#[from] wasmtime::Error),\n\n    // === Cache Errors ===\n    #[error(\"Cache error: {0}\")]\n    Cache(String),\n\n    // === Network and External Service Errors ===\n    #[error(\"Network error: {0}\")]\n    Network(#[from] reqwest::Error),\n\n    // === Validation Errors ===\n    #[error(\"Validation error: {0}\")]\n    Validation(String),\n\n    #[error(\"Other error: {0}\")]\n    Other(String),\n}\n\n// Comprehensive From implementations for common error types\nimpl From\u003ccrate::ast::tree_sitter::AstError\u003e for UveddiError {\n    fn from(err: crate::ast::tree_sitter::AstError) -\u003e Self {\n        match err {\n            crate::ast::tree_sitter::AstError::Io(io_err) =\u003e UveddiError::Io(io_err),\n            crate::ast::tree_sitter::AstError::UnsupportedLanguage(lang) =\u003e {\n                UveddiError::UnsupportedLanguage(lang)\n            }\n            _ =\u003e UveddiError::AstParsing(err.to_string()),\n        }\n    }\n}\n\nimpl From\u003cExtractionError\u003e for UveddiError {\n    fn from(err: ExtractionError) -\u003e Self {\n        match err {\n            ExtractionError::AstError(ast_err) =\u003e ast_err.into(),\n            ExtractionError::IoError(_path, io_err) =\u003e UveddiError::Io(io_err),\n            _ =\u003e UveddiError::Analysis(err.to_string()),\n        }\n    }\n}\n\nimpl From\u003canyhow::Error\u003e for UveddiError {\n    fn from(err: anyhow::Error) -\u003e Self {\n        UveddiError::Other(err.to_string())\n    }\n}\n","traces":[{"line":92,"address":[15186361,15185848],"length":1,"stats":{"Line":0}},{"line":93,"address":[27175600],"length":1,"stats":{"Line":0}},{"line":94,"address":[23025664],"length":1,"stats":{"Line":0}},{"line":95,"address":[19094789],"length":1,"stats":{"Line":0}},{"line":96,"address":[15186332,15185554,15186297],"length":1,"stats":{"Line":0}},{"line":97,"address":[4734058,4733779],"length":1,"stats":{"Line":0}},{"line":99,"address":[19094816],"length":1,"stats":{"Line":0}},{"line":104,"address":[21527370,21527448],"length":1,"stats":{"Line":0}},{"line":105,"address":[3700518,3699920,3700024,3700485],"length":1,"stats":{"Line":0}},{"line":106,"address":[4734286],"length":1,"stats":{"Line":0}},{"line":107,"address":[19094853],"length":1,"stats":{"Line":0}},{"line":108,"address":[22314147,22314128],"length":1,"stats hing the configured extensions.\n    ///\n    /// # Arguments\n    ///\n    /// * `root` - The root directory to start walking from.\n    ///\n    /// # Returns\n    ///\n    /// * `impl Stream\u003cItem = Result\u003cPathBuf, std::io::Error\u003e\u003e` - Stream of file paths or errors.\n    ///\n    /// # Example\n    /// ```rust,ignore\n    /// use uveddi::ingestion::AsyncWalker;\n    /// use tokio_stream::StreamExt;\n    /// let walker = AsyncWalker::for_source_code();\n    /// let mut stream = walker.walk(Path::new(\"./src\"));\n    /// while let Some(Ok(path)) = stream.next().await {\n    ///     println!(\"Found file: {}\", path.display());\n    /// }\n    /// ```\n    pub fn walk(\u0026self, root: \u0026Path) -\u003e impl Stream\u003cItem = Result\u003cPathBuf, std::io::Error\u003e\u003e + '_ {\n        self.walk_recursive(root.to_path_buf())\n    }\n\n    fn walk_recursive(\n        \u0026self,\n        path: PathBuf,\n    ) -\u003e Pin\u003cBox\u003cdyn Stream\u003cItem = Result\u003cPathBuf, std::io::Error\u003e\u003e + Send + '_\u003e\u003e {\n        Box::pin(async_stream::stream! {\n            let mut stack = vec![path];\n\n            while let Some(current_path) = stack.pop() {\n                let metadata = match fs::metadata(\u0026current_path).await {\n                    Ok(metadata) =\u003e metadata,\n                    Err(e) =\u003e {\n                        yield Err(e);\n                        continue;\n                    }\n                };\n\n                if metadata.is_file() {\n                    if self.should_include_file(\u0026current_path) {\n                        yield Ok(current_path);\n                    }\n                } else if metadata.is_dir() {\n                    let read_dir = match fs::read_dir(\u0026current_path).await {\n                        Ok(read_dir) =\u003e read_dir,\n                        Err(e) =\u003e {\n                            yield Err(e);\n                            continue;\n                        }\n                    };\n\n                    let mut entries = ReadDirStream::new(read_dir);\n                    while let Some(entry_result) = entries.next().await {\n                        match entry_result {\n                            Ok(entry) =\u003e {\n                                stack.push(entry.path());\n                            }\n                            Err(e) =\u003e {\n                                yield Err(e);\n                            }\n                        }\n                    }\n                }\n            }\n        })\n    }\n\n    fn should_include_file(\u0026self, path: \u0026Path) -\u003e bool {\n        if let Some(extension) = path.extension().and_then(|ext| ext.to_str()) {\n            self.include_extensions.contains(\u0026extension.to_string())\n        } else {\n            false\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tempfile::tempdir;\n    use tokio::fs::File;\n    use tokio::io::AsyncWriteExt;\n\n    #[tokio::test]\n    async fn test_async_walker() {\n        let temp_dir = tempdir().unwrap();\n        let temp_path = temp_dir.path();\n\n        // Create test files\n        let mut rust_file = File::create(temp_path.join(\"test.rs\")).await.unwrap();\n        rust_file.write_all(b\"fn main() {}\").await.unwrap();\n\n        let mut python_file = File::create(temp_path.join(\"test.py\")).await.unwrap();\n        python_file.write_all(b\"print('hello')\").await.unwrap();\n\n        let mut txt_file = File::create(temp_path.join(\"test.txt\")).await.unwrap();\n        txt_file.write_all(b\"ignored\").await.unwrap();\n\n        // Test walker\n        let walker = AsyncWalker::for_source_code();\n        let files: Result\u003cVec\u003c_\u003e, _\u003e = walker.walk(temp_path).collect().await;\n        let files = files.unwrap();\n\n        assert_eq!(files.len(), 2);\n        assert!(files.iter().any(|p| p.file_name().unwrap() == \"test.rs\"));\ \u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n//! // Initialize the application with configuration\n//! let config = Config::default();\n//! let mut orchestrator = AnalysisOrchestrator::new()?;\n//!\n//! // Run analysis on a project\n//! orchestrator.analyze_project(\"/path/to/project\")?;\n//! # Ok(())\n//! # }\n//! ```\n//!\n//! ## Architecture\n//!\n//! The library is organized into several key modules:\n//!\n//! - [`ai`]: AI provider integrations for intelligent analysis\n//! - [`analysis`]: Core analysis engines and algorithms\n//! - [`ast`]: Abstract Syntax Tree parsing and manipulation\n//! - [`database`]: Data persistence and querying capabilities\n//! - [`report`]: Report generation and formatting utilities\n//!\n//! See individual module documentation for detailed usage information.\n\n#![warn(missing_docs)]\n#![warn(rustdoc::missing_crate_level_docs)]\n\npub mod ai;\npub mod analysis;\npub mod application;\npub mod ast;\npub mod cache;\npub mod cli;\npub mod config;\npub mod database;\npub mod error;\npub mod ingestion;\npub mod models;\npub mod report;\npub mod semantic_search;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","main.rs"],"content":"//! Uveddi CLI Application Entry Point\n//!\n//! This is the main entry point for the Uveddi command-line interface. It handles\n//! command-line argument parsing, initializes the application environment, and\n//! delegates execution to the appropriate subcommands.\n//!\n//! # Application Overview\n//!\n//! Uveddi is a comprehensive code analysis tool that combines static analysis\n//! with AI-powered insights. It provides:\n//!\n//! - **Multi-language AST analysis**: Parse and analyze code across different languages\n//! - **Anti-pattern detection**: Identify code quality issues and architectural problems\n//! - **AI-powered explanations**: Generate intelligent explanations for detected issues\n//! - **Flexible reporting**: Output results in multiple formats (Markdown, JSON, etc.)\n//!\n//! # Available Commands\n//!\n//! ## `analyze`\n//! Performs comprehensive analysis of a codebase:\n//! ```bash\n//! uveddi analyze ./src --output-format markdown --enable-ai\n//! ```\n//!\n//! ## `config`\n//! Manages application configuration:\n//! ```bash\n//! uveddi config show\n//! uveddi config set ollama.model \"deepseek-coder:6.7b\"\n//! ```\n//!\n//! # Environment Variables\n//!\n//! - `OLLAMA_API_URL`: Base URL for Ollama API (default: http://localhost:11434)\n//! - `OLLAMA_MODEL`: Default model for AI analysis\n//! - `RUST_LOG`: Logging level (error, warn, info, debug, trace)\n//!\n//! # Error Handling\n//!\n//! The application uses `color-eyre` for enhanced error reporting with:\n//! - Colorized error messages\n//! - Stack traces for debugging\n//! - Contextual error information\n//! - Suggestions for common issues\n\nuse clap::{Parser, Subcommand};\nuse color_eyre::eyre::Result;\nuse uveddi::cli::analyze_command::AnalyzeCommand;\nuse uveddi::cli::config_command::ConfigCommand;\n\n/// Uveddi CLI application\n///\n/// A comprehensive code analysis tool that combines static analysis with\n/// AI-powered insights to help developers understand and improve their codebases.\n#[derive(Parser)]\n#[command(name = \"uveddi\")]\n#[command(about = \"A Rust-based code analysis and exploration tool with AI integration\")]\n#[command(\n    long_about = \"Uveddi performs comprehensive code analysis using static analysis \\\n    techniques combined with AI-powered insights. It can detect anti-patterns, analyze \\\n    architectural issues, and provide intelligent explanations for code quality problems.\"\n)]\n#[command(version)]\nstruct Cli {\n    /// Subcommand to execute\n    #[command(subcommand)]\n    command: Commands,\n}\n\n/// Available subcommands for the Uveddi CLI\n#[derive(Subcommand)]\nenum Commands {\n    /// Analyze a codebase for quality issues and architectural problems\n    ///\n    /// Performs comprehensive static analysis on the specified path, detecting\n    /// anti-patterns, architectural issues, and code quality problems. Optionally\n    /// integrates with AI providers for enhanced explanations and recommendations.\n    Analyze(AnalyzeCommand),\n\n    /// Manage Uveddi configuration settings\n    ///\n    /// View and modify configuration settings for AI providers, output preferences,\n    /// and analysis parameters. Configuration can be stored per-user or per-project.\n    Config(ConfigCommand),\n}\n\n/// Main entry point for Uveddi. All errors are handled and logged consistently.\nfn main() -\u003e Result\u003c()\u003e {\n    // Set up color_eyre for better error reporting\n    color_eyre::install()?;\n    env_logger::init();\n    uveddi::application::run_app().map_err(|e| color_eyre::eyre::eyre!(e))\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","models","antipattern_type.rs"],"content":"/// AntiPatternType represents a type of architectural anti-pattern.\n/// This will be used for DSL-based anti-pattern specification and reporting.\nuse serde::{Deserialize, Serialize};\n\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]\npub struct AntiPatternType {\n    pub id: i64,\n    pub name: String,\n    pub description: String,\n    pub dsl_rule: Option\u003cString\u003e, // DSL rule for detection (optional for now)\n    pub category: Option\u003cString\u003e,\n}\n\nimpl AntiPatternType {\n    /// Creates a new `AntiPatternType` instance.\n    ///\n    /// # Arguments\n    ///\n    /// * `id` - Unique identifier for the anti-pattern type.\n    /// * `name` - Name of the anti-pattern.\n    /// * `description` - Description of the anti-pattern.\n    /// * `dsl_rule` - Optional DSL rule for detection.\n    /// * `category` - Optional category for classification.\n    ///\n    /// # Returns\n    ///\n    /// * `AntiPatternType` - The constructed anti-pattern type.\n    ///\n    /// # Example\n    /// ```rust\n    /// use uveddi::models::antipattern_type::AntiPatternType;\n    /// let ap = AntiPatternType::new(1, \"God Object\", \"A class that does too much\", None, Some(\"OO\"));\n    /// ```\n    pub fn new(\n        id: i64,\n        name: \u0026str,\n        description: \u0026str,\n        dsl_rule: Option\u003c\u0026str\u003e,\n        category: Option\u003c\u0026str\u003e,\n    ) -\u003e Self {\n        Self {\n            id,\n            name: name.to_string(),\n            description: description.to_string(),\n            dsl_rule: dsl_rule.map(|s| s.to_string()),\n            category: category.map(|s| s.to_string()),\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn test_antipatterntype_serialization() {\n        let ap = AntiPatternType::new(\n            1,\n            \"God Object\",\n            \"A class that does too much\",\n            Some(\"size \u003e 1000\"),\n            Some(\"OO\"),\n        );\n        let json = serde_json::to_string(\u0026ap).unwrap();\n        let de: AntiPatternType = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(ap, de);\n    }\n}\n","traces":[{"line":34,"address":[3464530,3463968,3464536],"length":1,"stats":{"Line":0}},{"line":43,"address":[3464151],"length":1,"stats":{"Line":0}},{"line":44,"address":[3464190],"length":1,"stats":{"Line":0}},{"line":45,"address":[3464245],"length":1,"stats":{"Line":0}},{"line":46,"address":[3464312],"length":1,"stats":{"Line":0}}],"covered":0,"coverable":5},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","models","dependency_graph.rs"],"content":"use petgraph::Directed;\nuse petgraph::Graph;\nuse serde::{Deserialize, Serialize};\n\n/// Represents a dependency graph with nodes and edges.\n#[derive(Debug, Serialize, Deserialize, Clone, Default)]\npub struct DependencyGraph {\n    pub nodes: Vec\u003cString\u003e,\n    pub edges: Vec\u003c(Strin /// ```\n    pub fn get_node_from_index(\u0026self, index: usize) -\u003e Option\u003c\u0026String\u003e {\n        self.nodes.get(index)\n    }\n}\n","traces":[{"line":14,"address":[4104672],"length":1,"stats":{"Line":0}},{"line":15,"address":[4104680],"length":1,"stats":{"Line":0}},{"line":19,"address":[4104936,4104910,4104704],"length":1,"stats":{"Line":0}},{"line":20,"address":[4104723,4104801],"length":1,"stats":{"Line":0}},{"line":21,"address":[4104890,4104836],"length":1,"stats":{"Line":0}},{"line":26,"address":[4105318,4104944],"length":1,"stats":{"Line":0}},{"line":27,"address":[4105068,4104974],"length":1,"stats":{"Line":0}},{"line":28,"address":[4105089],"length":1,"stats":{"Line":0}},{"line":29,"address":[4105141],"length":1,"stats":{"Line":0}},{"line":33,"address":[4105360,4106463,4106469],"length":1,"stats":{"Line":0}},{"line":34,"address":[4105399],"length":1,"stats":{"Line":0}},{"line":35,"address":[4105524,4105440],"length":1,"stats":{"Line":0}},{"line":38,"address":[3557200,3557227],"length":1,"stats":{"Line":0}},{"line":40,"address":[4105629,4105720],"length":1,"stats":{"Line":0}},{"line":41,"address":[4106238],"length":1,"stats":{"Line":0}},{"line":42,"address":[3557294,3557280],"length":1,"stats":{"Line":0}},{"line":43,"address":[3557328,3557342],"length":1,"stats":{"Line":0}},{"line":45,"address":[4106343],"length":1,"stats":{"Line":0}},{"line":48,"address":[4105889],"length":1,"stats":{"Line":0}},{"line":68,"address":[4106512],"length":1,"stats":{"Line":0}},{"line":69,"address":[4106530],"length":1,"stats":{"Line":0}}],"covered":0,"coverable":21},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","models","mod.rs"],"content":"//! Data models for Uveddi\n//!\n//! This module defines core data structures for projects, analysis runs, and database row conversion utilities.\n//! The main types are `Project`, `AnalysisRun`, `ArchitecturalIssue`, `CodeSnippet`, `Organization`, and `User`.\n//! Each of these types corresponds to a database table or view, and the module provides functionality to convert\n//! between database rows and Rust structs, as well as serialization and deserialization to and from JSON.\n//!\n//! The module also declares sub-modules for anti-pattern types and dependency graphs, which are used in\n//! architectural analysis, and re-exports some types for external use.\n//!\n//! # Main Types\n//!\n//! - `Project`: Represents a project with associated metadata and configuration.\n//! - `AnalysisRun`: Represents a single analysis run on a project, including statistics and results.\n//! - `ArchitecturalIssue`: Represents an architectural issue found during analysis, with details and suggestions.\n//! - `CodeSnippet`: Represents a code snippet associated with an architectural issue, providing context.\n//! - `Organization`: Represents an organization that owns projects.\n//! - `User`: Represents a user who can own projects and organizations.\n//!\n//! # Sub-modules\n//!\n//! - `antipattern_type`: Defines types and functionality related to anti-patterns detected in code.\n//! - `dependency_graph`: Defines types and functionality for representing and analyzing dependency graphs.\n\nuse rusqlite::Row;\nuse serde::{Deserialize, Serialize};\nuse std::time::{SystemTime, UNIX_EPOCH};\n\n/// Converts a `SystemTime` to a Unix timestamp (seconds since epoch).\n///\n/// # Arguments\n///\n/// * `time` - The `SystemTime` to convert.\n///\n/// # Returns\n///\n/// * `i64` - The Unix timestamp in seconds.\npub fn system_time_to_unix_timestamp(time: SystemTime) -\u003e i64 {\n    time.duration_since(UNIX_EPOCH)\n        .unwrap_or_default()\n        .as_secs() as i64\n}\n\n/// Converts a Unix timestamp (seconds since epoch) to `SystemTime`.\n///\n/// # Arguments\n///\n/// * `timestamp` - The Unix timestamp in seconds.\n///\n/// # Returns\n///\n/// * `SystemTime` - The corresponding `SystemTime` value.\npub fn unix_timestamp_to_system_time(timestamp: i64) -\u003e SystemTime {\n    UNIX_EPOCH + std::time::Duration::from_secs(timestamp as u64)\n}\n\n/// Helper trait for converting database rows to structs\npub trait FromRow: Sized {\n    fn from_row(row: \u0026Row) -\u003e rusqlite::Result\u003cSelf\u003e;\n}\n\n/// Project model\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct Project {\n    pub project_id: Option\u003ci64\u003e,\n    pub organization_id: Option\u003ci64\u003e,\n    pub name: String,\n    pub repository_url: String,\n    pub last_analyzed_commit: Option\u003cString\u003e,\n    pub config_data: Option\u003cserde_json::Value\u003e,\n    pub created_at: SystemTime,\n}\n\nimpl FromRow for Project {\n    fn from_row(row: \u0026Row) -\u003e rusqlite::Result\u003cSelf\u003e {\n        let config_data: Option\u003cString\u003e = row.get(\"config_data\")?;\n        let config_data = config_data\n            .map(|s| serde_json::from_str(\u0026s))\n            .transpose()\n            .map_err(|e| {\n                rusqlite::Error::FromSqlConversionFailure(\n                    0,\n                    rusqlite::types::Type::Text,\n                    Box::new(e),\n                )\n            })?;\n\n        Ok(Project {\n            project_id: Some(row.get(\"project_id\")?),\n            organization_id: row.get(\"organization_id\")?,\n            name: row.get(\"name\")?,\n            repository_url: row.get(\"repository_url\")?,\n            last_analyzed_commit: row.get(\"last_analyzed_commit\")?,\n            config_data,\n            created_at: unix_timestamp_to_system_time(row.get(\"created_at\")?),\n        })\n    }\n}\n\n/// AnalysisRun model\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct AnalysisRun {\n    pub run_id: Option\u003ci64\u003e,\n    pub project_id: i64,\n    pub user_id: Option\u003ci64\u003e,\n    pub start_time: SystemTime,\n    pub end_time: Option\u003cSystemTime\u003e,\n    pub status: String,\n    pub ai_model_used: Option\u003cString\u003e,\n    pub total_files_scanned: Option\u ored: bool,\n    pub ignored_by_user_id: Option\u003ci64\u003e,\n    pub ignored_at: Option\u003cSystemTime\u003e,\n}\n\nimpl FromRow for ArchitecturalIssue {\n    fn from_row(row: \u0026Row) -\u003e rusqlite::Result\u003cSelf\u003e {\n        let ignored_at: Option\u003ci64\u003e = row.get(\"ignored_at\")?;\n        let ignored_at = ignored_at.map(unix_timestamp_to_system_time);\n\n        // SQLite stores booleans as integers\n        let is_ignored: i64 = row.get(\"is_ignored\")?;\n\n        Ok(ArchitecturalIssue {\n            issue_id: Some(row.get(\"issue_id\")?),\n            run_id: row.get(\"run_id\")?,\n            anti_pattern_type_id: row.get(\"anti_pattern_type_id\")?,\n            file_path: row.get(\"file_path\")?,\n            line_start: row.get(\"line_start\")?,\n            line_end: row.get(\"line_end\")?,\n            severity: row.get(\"severity\")?,\n            title: row.get(\"title\")?,\n            description: row.get(\"description\")?,\n            ai_refactoring_suggestion: row.get(\"ai_refactoring_suggestion\")?,\n            is_ignored: is_ignored != 0,\n            ignored_by_user_id: row.get(\"ignored_by_user_id\")?,\n            ignored_at,\n        })\n    }\n}\n\n/// CodeSnippet model\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct CodeSnippet {\n    pub snippet_id: Option\u003ci64\u003e,\n    pub issue_id: i64,\n    pub content: String,\n    pub language: Option\u003cString\u003e,\n    pub context_lines_before: Option\u003ci64\u003e,\n    pub context_lines_after: Option\u003ci64\u003e,\n}\n\nimpl FromRow for CodeSnippet {\n    fn from_row(row: \u0026Row) -\u003e rusqlite::Result\u003cSelf\u003e {\n        Ok(CodeSnippet {\n            snippet_id: Some(row.get(\"snippet_id\")?),\n            issue_id: row.get(\"issue_id\")?,\n            content: row.get(\"content\")?,\n            language: row.get(\"language\")?,\n            context_lines_before: row.get(\"context_lines_before\")?,\n            context_lines_after :{"Line":0}},{"line":252,"address":[4160163,4160245],"length":1,"stats":{"Line":0}}],"covered":0,"coverable":78},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","report","diagrams.rs"],"content":"//! Mermaid.js diagram generation for code dependencies\n\nuse crate::analysis::dependency::Dependency;\nuse crate::models::ArchitecturalIssue;\nuse std::collections::HashSet;\n\n/// Generates a Mermaid.js diagram representing code dependencies and highlights issues.\n///\n/// This function creates a graph in Mermaid.js syntax, showing modules as nodes and dependencies as edges.\n/// Nodes associated with architectural issues are visually highlighted.\n///\n/// # Arguments\n///\n/// * `deps` - Slice of `Dependency` objects representing code dependencies.\n/// * `issues` - Slice of `ArchitecturalIssue` objects to highlight in the diagram.\n///\n/// # Returns\n///\n/// * `String` - Mermaid.js formatted diagram as a string.\n///\n/// # Example\n/// ```rust\n/// use uveddi::report::diagrams::generate_mermaid_diagram;\n/// let diagram = generate_mermaid_diagram(\u0026deps, \u0026issues);\n/// println!(\"{}\", diagram);\n/// ```\npub fn generate_mermaid_diagram(deps: \u0026[Dependency], issues: \u0026[ArchitecturalIssue]) -\u003e String {\n    let mut output = String::from(\"```mermaid\\ngraph TD;\\n\");\n    let mut processed_nodes = HashSet::new();\n\n    for dep in deps {\n        if processed_nodes.insert(\u0026dep.from) {\n            output.push_str(\u0026format!(\"    {}[{}];\\n\", dep.from.id, dep.from.name));\n        }\n        if processed_nodes.insert(\u0026dep.to) {\n            output.push_str(\u0026format!(\"    {}[{}];\\n\", dep.to.id, dep.to.name));\n        }\n        output.push_str(\u0026format!(\"    {} --\u003e {};\\n\", dep.from.id, dep.to.id));\n    }\n\n    // Highlight nodes with issues\n    for issue in issues {\n        if let Some(file_id) = \u0026issue.file_id {\n            output.push_str(\u0026format!(\"    {}[\\\"{}\\\" class=\\\"issue\\\"];\\n\", file_id, file_id));\n        }\n    }\n    output.push_str(\"classDef issue fill:#f96,stroke:#333,stroke-width:2px;\\n\");\n    output.push_str(\"```\\n\");\n    output\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::analysis::dependency::{Dependency, Node};\n    use crate::models::ArchitecturalIssue;\n\n    #[test]\n    fn test_generate_mermaid_diagram() {\n        let deps = vec![\n            Dependency {\n                from: Node { id: \"mod1\".to_string(), name: \"Module1\".to_string() },\n                to: Node { id: \"mod2\".to_string(), name: \"Module2\".to_string() },\n                kind: \"imports\".to_string(),\n            },\n        ];\n        let issues = vec![ArchitecturalIssue { file_id: Some(\"mod1\".to_string()), ..Default::default() }];\n        let diagram = generate_mermaid_diagram(\u0026deps, \u0026issues);\n        assert!(diagram.contains(\"mod1 --\u003e mod2\"));\n        assert!(diagram.contains(\"classDef issue\"));\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","report","mod.rs"],"content":"//! Report Generation Module for Uveddi\n//!\n//! This module provides comprehensive report generation capabilities for analysis results.\n//! It supports multiple output formats and includes advanced features like AI explanations,\n//! code snippets, and visual diagrams.\n//!\n//! # Supported Formats\n//!\n//! ## Markdown Reports\n//! Rich, human-readable reports with:\n//! - Executive summary with key metrics\n//! - Issues organized by severity level\n//! - Detailed issue descriptions with context\n//! - Optional code snippets and AI explanations\n//! - Mermaid.js diagrams for architectural visualization\n//!\n//! ## JSON Reports  \n//! Structured data format for:\n//! - Integration with external tools\n//! - Automated processing and analysis\n//! - API consumption\n//! - Custom toolchain integration\n//!\n//! # Key Features\n//!\n//! - **Multi-format Output**: Markdown for humans, JSON for machines\n//! - **AI Integration**: Optional AI-generated explanations and recommendations\n//! - **Visual Diagrams**: Mermaid.js integration for architectural visualization\n//! - **Customizable Content**: Configure inclusion of code snippets, AI explanations, diagrams\n//! - **Performance Optimized**: Efficient processing for large analysis results\n//! - **ERD Compliant**: Follows Entity Relationship Diagram specifications (ER-F-011 to ER-F-014)\n//!\n//! # Usage Examples\n//!\n//! ## Basic Report Generation\n//!\n//! ```rust,no_run\n//! use uveddi::report::ReportGenerator;\n//! use uveddi::database::models::{AnalysisRun, ArchitecturalIssue, AntiPatternType};\n//!\n//! let generator = ReportGenerator::new()\n//!     .with_ai_explanations(true)\n//!     .with_code_snippets(true)\n//!     .with_diagrams(true);\n//!\n//! let run = AnalysisRun { /* ... */ };\n//! let issues = vec![/* ArchitecturalIssue instances */];\n//! let anti_patterns = vec![/* AntiPatternType instances */];\n//!\n//! // Generate markdown report\n//! let markdown = generator.generate_markdown_report(\u0026run, \u0026issues, \u0026anti_patterns)?;\n//!\n//! // Generate JSON report\n//! let json = generator.generate_json_report(\u0026run, \u0026issues, \u0026anti_patterns)?;\n//! # Ok::\u003c(), Box\u003cdyn std::error::Error\u003e\u003e(())\n//! ```\n//!\n//! ## Writing Reports to Files\n//!\n//! ```rust,no_run\n//! # use uveddi::report::ReportGenerator;\n//! # let generator = ReportGenerator::new();\n//! # let markdown_content = String::new();\n//! use std::path::Path;\n//!\n//! // Write markdown report\n//! generator.write_report_to_file(\u0026markdown_content, Path::new(\"analysis_report.md\"))?;\n//!\n//! // Write JSON report  \n//! generator.write_report_to_file(\u0026json_content, Path::new(\"analysis_report.json\"))?;\n//! # Ok::\u003c(), Box\u003cdyn std::error::Error\u003e\u003e(())\n//! ```\n//!\n//! # Report Structure\n//!\n//! ## Markdown Report Sections\n//!\n//! 1. **Executive Summary**: High-level metrics and overview\n//! 2. **Analysis Overview**: Configuration and execution details\n//! 3. **Issues by Severity**: Grouped and prioritized issue lists\n//! 4. **Detailed Analysis**: In-depth issue descriptions\n//! 5. **Architectural Diagrams**: Visual representations (if enabled)\n//! 6. **Recommendations**: AI-generated suggestions (if enabled)\n//!\n//! ## JSON Report Schema\n//!\n//! ```json\n//! {\n//!   \"analysis_run\": { /* AnalysisRun metadata */ },\n//!   \"summary\": {\n//!     \"total_issues\": 42,\n//!     \"by_severity\": { \"critical\": 2, \"high\": 8, \"medium\": 15, \"low\": 17 },\n//!     \"files_analyzed\": 156\n//!   },\n//!   \"issues\": [ /* Array of ArchitecturalIssue objects */ ],\n//!   \"anti_patterns\": [ /* Array of AntiPatternType definitions */ ]\n//! }\n//! ```\n\n// use crate::analysis::graph::ComponentNode;\nuse crate::database::models::{AnalysisRun, AntiPatternType, ArchitecturalIssue};\nuse chrono::{DateTime, Local};\nuse log::{error, info};\nuse serde_json::Value;\nuse std::collections::HashMap;\nuse std::fs;\nuse std::io::Write;\nuse std::path::Path;\n\n/// Configurable report generator with multi-format support\n///\n/// The `ReportGenerator` provides a flexible interface for creating analysis reports\n/// in multiple formats. It follows the builder pattern for configuration and supports\n/// various output customization options.\n///\n/// # Configuration Options\n///\n/// - **AI Explanations**: Include AI-generated issue explanations and recommendations\n/// - **Code Snippets**: Embed relevant code snippets in issue descriptions  \n/// - **Diagrams**: Generate Mermaid.js diagrams for architectural visualization\n///\n/// # Thread Safety\n///\n/// This struct is designed to be thread-safe and can be used across multiple\n/// async tasks for concurrent report generation.\npub struct ReportGenerator {\n    /// Whether to include AI-generated explanations in reports\n    include_ai_explanations: bool,\n    /// Whether to include code snippets in issue descriptions\n    include_code_snippets: bool,\n    /// Whether to generate and include architectural diagrams\n    include_diagrams: bool,\n    include_severity_summary: bool,\n    include_remediation_steps: bool,\n}\n\nimpl Default for ReportGenerator {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\nimpl ReportGenerator {\n    /// Creates a new `ReportGenerator` with default configuration.\n    ///\n    /// # Returns\n    ///\n    /// * `ReportGenerator` - A new instance with all features enabled by default.\n    pub fn new() -\u003e Self {\n        Self {\n            include_ai_explanations: true,\n            include_code_snippets: true,\n            include_diagrams: true,\n            include_severity_summary: true,\n            include_remediation_steps: true,\n        }\n    }\n\n    /// Configures whether AI explanations should be included in the report.\n    ///\n    /// # Arguments\n    ///\n    /// * `include` - If true, include AI explanations in the report.\n    ///\n    /// # Returns\n    ///\n    /// * `Self` - The updated report generator.\n    pub fn with_ai_explanations(mut self, include: bool) -\u003e Self {\n        self.include_ai_explanations = include;\n        self\n    }\n\n    /// Configures whether code snippets should be included in the report.\n    ///\n    /// # Arguments\n    ///\n    /// * `include` - If true, include code snippets in the report.\n    ///\n    /// # Returns\n    ///\n    /// * `Self` - The updated report generator.\n    pub fn with_code_snippets(mut self, include: bool) -\u003e Self {\n        self.include_code_snippets = include;\n        self\n    }\n\n    /// Configures whether diagrams should be included in the report.\n    ///\n    /// # Arguments\n    ///\n    /// * `include` - If true, include diagrams in the report.\n    ///\n    /// # Returns\n    ///\n    /// * `Self` - The updated report generator.\n    pub fn with_diagrams(mut self, include: bool) -\u003e Self {\n        self.include_diagrams = include;\n        self\n    }\n\n    /// Configures whether a severity summary should be included in the report.\n    ///\n    /// # Arguments\n    ///\n    /// * `include` - If true, include a severity summary in the report.\n    ///\n    /// # Returns\n    ///\n    /// * `Self` - The updated report generator.\n    pub fn with_severity_summary(mut self, include: bool) -\u003e Self {\n        self.include_severity_summary = include;\n        self\n    }\n\n    /// Configures whether remediation steps should be included in the report.\n    ///\n    /// # Arguments\n    ///\n    /// * `include` - If true, include remediation steps in the report.\n    ///\n    /// # Returns\n    ///\n    /// * `Self` - The updated report generator.\n    pub fn with_remediation_steps(mut self, include: bool) -\u003e Self {\n        self.include_remediation_steps = include;\n        self\n    }\n\n    /// Generates a Markdown report for the given analysis run and issues.\n    ///\n    /// # Arguments\n    ///\n    /// * `analysis_run` - The analysis run metadata.\n    /// * `issues` - Slice of architectural issues to include in the report.\n    /// * `anti_pattern_types` - Map of anti-pattern type IDs to definitions.\n    /// * `output_path` - Optional path to write the report to disk.\n    ///\n    /// # Returns\n    ///\n    /// * `Ok(String)` - The generated Markdown report as a string.\n    /// * `Err(std::io::Error)` - If writing to disk fails.\n    pub fn generate_markdown_report(\n        \u0026self,\n        analysis_run: \u0026AnalysisRun,\n        issues: \u0026[ArchitecturalIssue],\n        anti_pattern_types: \u0026HashMap\u003ci64, AntiPatternType\u003e,\n        output_path: Option\u003c\u0026Path\u003e,\n    ) -\u003e Result\u003cString, String\u003e {\n        info!(\"Generating markdown report with {} issues\", issues.len());\n\n        let now: DateTime\u003cLocal\u003e = Local::now();\n        let report_title = format!(\n            \"# Uveddi Architectural Analysis Report\\n\\n_Generated on {}_\\n\\n\",\n            now.format(\"%Y-%m-%d %H:%M:%S\")\n        );\n\n        // Build the report sections\n        let mut report = String::new();\n        report.push_str(\u0026report_title);\n\n        // Add executive summary\n        report.push_str(\"## Executive Summary\\n\\n\");\n        report.push_str(\u0026self.generate_executive_summary(analysis_run, issues));\n        report.push_str(\"\\n\\n\");\n\n        // Add severity summary if enabled\n        if self.include_severity_summary {\n            report.push_str(\"## Issues by Severity\\n\\n\");\n            report.push_str(\u0026self.generate_severity_summary(issues));\n            report.push_str(\"\\n\\n\");\n        }\n\n        // Add issues grouped by anti-pattern type\n        report.push_str(\"## Detailed Analysis\\n\\n\");\n        report.push_str(\u0026self.generate_detailed_analysis(issues, anti_pattern_types));\n\n        // Add diagrams if enabled\n        if self.include_diagrams {\n            report.push_str(\"## Architecture Diagrams\\n\\n\");\n            report.push_str(\u0026self.generate_diagrams_section(issues, anti_pattern_types));\n        }\n\n        // Write to file if output path is provided\n        if let Some(path) = output_path {\n            match fs::File::create(path) {\n                Ok(mut file) =\u003e {\n                    if let Err(e) = file.write_all(report.as_bytes()) {\n                        error!(\"Failed to write report to file: {}\", e);\n                        return Err(format!(\"Failed to write report to file: {}\", e));\n                    }\n                    info!(\"Report written to {}\", path.display());\n                }\n                Err(e) =\u003e {\n                    error!(\"Failed to create report file: {}\", e);\n                    return Err(format!(\"Failed to create report file: {}\", e));\n                }\n            }\n        }\n\n        Ok(report)\n    }\n\n    /// Generate the executive summary section\n    fn generate_executive_summary(\n        \u0026self,\n        analysis_run: \u0026AnalysisRun,\n        issues: \u0026[ArchitecturalIssue],\n    ) -\u003e String {\n        let total_issues = issues.len();\n        let high_severity = issues.iter().filter(|i| i.severity == \"high\").count();\n        let medium_severity = issues.iter().filter(|i| i.severity == \"medium\").count();\n        let low_severity = issues.iter().filter(|i| i.severity == \"low\").count();\n\n        let unique_files = issues\n            .iter()\n            .map(|i| \u0026i.file_path)\n            .collect::\u003cstd::collections::HashSet\u003c_\u003e\u003e()\n            .len();\n\n        format!(\n            \"This report analyzes the codebase at `{}` and identified **{} architectural issues** across **{} files**.\\n\\n\\\n            - **High Severity**: {} issues\\n\\\n            - **Medium Severity**: {} issues\\n\\\n            - **Low Severity**: {} issues\\n\\n\\\n            The analysis took {:.2} seconds to complete.\",\n            \"Unknown\".to_string(), // TODO: Add codebase_path to AnalysisRun model\n            total_issues,\n            unique_files,\n            high_severity,\n            medium_severity,\n            low_severity,\n            analysis_run.end_time.and_then(|end|\n                Some((end - analysis_run.start_time).num_seconds() as f64)\n            ).unwrap_or(0.0)\n        )\n    }\n\n    /// Generate the severity summary section with tables\n    fn generate_severity_summary(\u0026self, issues: \u0026[ArchitecturalIssue]) -\u003e String {\n        let mut summary = String::new();\n\n        // Group issues by severity\n        let high_issues: Vec\u003c_\u003e = issues.iter().filter(|i| i.severity == \"high\").collect();\n        let medium_issues: Vec\u003c_\u003e = issues.iter().filter(|i| i.severity == \"medium\").collect();\n        let low_issues: Vec\u003c_\u003e = issues.iter().filter(|i| i.severity == \"low\").collect();\n\n        // High severity table\n        if !high_issues.is_empty() {\n            summary.push_str(\"### 🔴 High Severity Issues\\n\\n\");\n            summary.push_str(\"| File | Issue |\\n\");\n            summary.push_str(\"|------|-------|\\n\");\n\n            for issue in high_issues {\n                let file_path = Path::new(\u0026issue.file_path);\n                let file_name = file_path.file_name().unwrap_or_default().to_string_lossy();\n                let lines = if let (Some(start), Some(end)) = (issue.start_line, issue.end_line) {\n                    format!(\":{}-{}\", start, end)\n                } else {\n                    String::new()\n                };\n\n                summary.push_str(\u0026format!(\n                    \"| `{}{}`| {} |\\n\",\n                    file_name, lines, issue.description\n                ));\n            }\n\n            summary.push_str(\"\\n\");\n        }\n\n        // Medium severity table\n        if !medium_issues.is_empty() {\n            summary.push_str(\"### 🟠 Medium Severity Issues\\n\\n\");\n            summary.push_str(\"| File | Issue |\\n\");\n            summary.push_str(\"|------|-------|\\n\");\n\n            for issue in medium_issues {\n                let file_path = Path::new(\u0026issue.file_path);\n                let file_name = file_path.file_name().unwrap_or_default().to_string_lossy();\n                let lines = if let (Some(start), Some(end)) = (issue.start_line, issue.end_line) {\n                    format!(\":{}-{}\", start, end)\n                } else {\n                    String::new()\n                };\n\n                summary.push_str(\u0026format!(\n                    \"| `{}{}`| {} |\\n\",\n                    file_name, lines, issue.description\n                ));\n            }\n\n            summary.push_str(\"\\n\");\n        }\n\n        // Low severity table\n        if !low_issues.is_empty() {\n            summary.push_str(\"### 🟡 Low Severity Issues\\n\\n\");\n            summary.push_str(\"| File | Issue |\\n\");\n            summary.push_str(\"|------|-------|\\n\");\n\n            for issue in low_issues {\n                let file_path = Path::new(\u0026issue.file_path);\n                let file_name = file_path.file_name().unwrap_or_default().to_string_lossy();\n                let lines = if let (Some(start), Some(end)) = (issue.start_line, issue.end_line) {\n                    format!(\":{}-{}\", start, end)\n                } else {\n                    String::new()\n                };\n\n                summary.push_str(\u0026format!(\n                    \"| `{}{}`| {} |\\n\",\n                    file_name, lines, issue.description\n                ));\n            }\n        }\n\n        summary\n    }\n\n    /// Generate the detailed analysis section, grouped by anti-pattern type\n    fn generate_detailed_analysis(\n        \u0026self,\n        issues: \u0026[ArchitecturalIssue],\n        anti_pattern_types: \u0026HashMap\u003ci64, AntiPatternType\u003e,\n    ) -\u003e String {\n        let mut analysis = String::new();\n\n        // Group issues by anti-pattern type\n        let mut issues_by_type: HashMap\u003ci64, Vec\u003c\u0026ArchitecturalIssue\u003e\u003e = HashMap::new();\n        for issue in issues {\n            issues_by_type\n                .entry(issue.anti_pattern_type_id)\n                .or_default()\n                .push(issue);\n        }\n\n        // Sort anti-pattern types by name for consistent ordering\n        let mut anti_pattern_ids: Vec\u003ci64\u003e = issues_by_type.keys().cloned().collect();\n        anti_pattern_ids.sort_by_key(|id| {\n            anti_pattern_types\n                .get(id)\n                .map(|ap| ap.name.clone())\n                .unwrap_or_default()\n        });\n\n        // Generate a section for each anti-pattern type\n        for type_id in anti_pattern_ids {\n            let issues = issues_by_type.get(\u0026type_id).unwrap();\n            let anti_pattern = anti_pattern_types.get(\u0026type_id);\n\n            let name = anti_pattern\n                .map(|ap| ap.name.clone())\n                .unwrap_or_else(|| format!(\"Unknown (ID: {})\", type_id));\n\n            let description = anti_pattern\n                .map(|ap| ap.description.clone())\n                .unwrap_or_else(|| \"No description available\".to_string());\n\n            analysis.push_str(\u0026format!(\"### {}\\n\\n\", name));\n            analysis.push_str(\u0026format!(\"{}\\n\\n\", description));\n\n            // Add each issue of this type\n            for (i, issue) in issues.iter().enumerate() {\n                analysis.push_str(\u0026format!(\"#### Issue #{}: {}\\n\\n\", i + 1, issue.description));\n                analysis.push_str(\u0026format!(\"- **File**: `{}`\\n\", issue.file_path));\n                analysis.push_str(\u0026format!(\"- **Severity**: {}\\n\", issue.severity));\n\n                if let (Some(start), Some(end)) = (issue.start_line, issue.end_line) {\n                    analysis.push_str(\u0026format!(\"- **Location**: Lines {}-{}\\n\", start, end));\n                }\n\n                // Add code snippet if available and enabled\n                if self.include_code_snippets \u0026\u0026 issue.code_snippet.is_some() {\n                    analysis.push_str(\"\\n**Code Snippet**:\\n\\n\");\n                    analysis.push_str(\"```\\n\");\n                    analysis.push_str(issue.code_snippet.as_ref().unwrap());\n                    analysis.push_str(\"\\n```\\n\\n\");\n                }\n\n                // Add AI explanation if available and enabled\n                if self.include_ai_explanations \u0026\u0026 issue.ai_explanation.is_some() {\n                    analysis.push_str(\"**AI Analysis**:\\n\\n\");\n\n                    // Try to parse as JSON first (structured format)\n                    if let Ok(json) =\n                        serde_json::from_str::\u003cValue\u003e(issue.ai_explanation.as_ref().unwrap())\n                    {\n                        if let Some(title) = json.get(\"title\").and_then(|v| v.as_str()) {\n                            analysis.push_str(\u0026format!(\"*{}*\\n\\n\", title));\n                        }\n\n                        if let Some(explanation) = json.get(\"explanation\").and_then(|v| v.as_str())\n                        {\n                            analysis.push_str(\u0026format!(\"{}\\n\\n\", explanation));\n                        }\n\n                        if self.include_remediation_steps {\n                            if let Some(refactoring) =\n                                json.get(\"refactoring\").and_then(|v| v.as_str())\n                            {\n                                analysis.push_str(\"**Recommended Refactoring**:\\n\\n\");\n                                analysis.push_str(\u0026format!(\"{}\\n\\n\", refactoring));\n                            }\n                        }\n                    } else {\n                        // Fall back to raw text if not valid JSON\n                        analysis\n                            .push_str(\u0026format!(\"{}\\n\\n\", issue.ai_explanation.as_ref().unwrap()));\n                    }\n                }\n\n                analysis.push_str(\"\\n\");\n            }\n        }\n\n        analysis\n    }\n\n    /// Generate diagrams section with Mermaid.js syntax\n    fn generate_diagrams_section(\n        \u0026self,\n        issues: \u0026[ArchitecturalIssue],\n        anti_pattern_types: \u0026HashMap\u003ci64, AntiPatternType\u003e,\n    ) -\u003e String {\n        let mut diagrams = String::new();\n\n        // Add dependency cycles diagram if there are cyclic dependency issues\n        let cycle_issues: Vec\u003c_\u003e = issues\n            .iter()\n            .filter(|i| {\n                anti_pattern_types\n                    .get(\u0026i.anti_pattern_type_id)\n                    .map(|apt| apt.name.contains(\"Cyclic\") || apt.name.contains(\"cycle\"))\n                    .unwrap_or(false)\n            })\n            .collect();\n\n        if !cycle_issues.is_empty() {\n            diagrams.push_str(\"### Dependency Cycles\\n\\n\");\n            diagrams.push_str(\"```mermaid\\ngraph TD;\\n\");\n\n            // Extract component names from cycle descriptions\n            let mut components = std::collections::HashSet::new();\n            let mut dependencies = std::collections::HashSet::new();\n\n            for issue in cycle_issues {\n                // Simple parsing of cycle components from description\n                // Example: \"Cyclic dependency detected between components: A → B → C\"\n                if let Some(components_str) = issue.description.split(\": \").nth(1) {\n                    let parts: Vec\u003c\u0026str\u003e = components_str.split(\" → \").collect();\n\n                    for part in \u0026parts {\n                        components.insert(part.trim().to_string());\n                    }\n\n                    // Add dependencies\n                    for i in 0..parts.len() - 1 {\n                        dependencies\n                            .insert((parts[i].trim().to_string(), parts[i + 1].trim().to_string()));\n                    }\n\n                    // Add the last to first dependency to complete the cycle\n                    if parts.len() \u003e 1 {\n                        dependencies.insert((\n                            parts[parts.len() - 1].trim().to_string(),\n                            parts[0].trim().to_string(),\n                        ));\n                    }\n                }\n            }\n\n            // Add components to diagram\n            for component in \u0026components {\n                diagrams.push_str(\u0026format!(\"    {}[{}];\\n\", component, component));\n            }\n\n            // Add dependencies to diagram\n            for (from, to) in \u0026dependencies {\n                diagrams.push_str(\u0026format!(\"    {} --\u003e {};\\n\", from, to));\n            }\n\n            diagrams.push_str(\"```\\n\\n\");\n        }\n\n        // Add god object diagrams if there are god object issues\n        let god_object_issues: Vec\u003c_\u003e = issues\n            .iter()\n            .filter(|i| {\n                anti_pattern_types\n                    .get(\u0026i.anti_pattern_type_id)\n                    .map(|apt| apt.name.contains(\"God Object\") || apt.name.contains(\"god object\"))\n                    .unwrap_or(false)\n            })\n            .collect();\n\n        if !god_object_issues.is_empty() {\n            diagrams.push_str(\"### God Objects\\n\\n\");\n\n            for issue in god_object_issues {\n                // Extract the god object name from the description\n                let god_object_name = issue\n                    .description\n                    .split_whitespace()\n                    .next()\n                    .unwrap_or(\"Unknown\");\n\n                diagrams.push_str(\u0026format!(\"#### {}\\n\\n\", god_object_name));\n                diagrams.push_str(\"```mermaid\\nclassDiagram\\n\");\n                diagrams.push_str(\u0026format!(\"    class {} {{\\n\", god_object_name));\n\n                // If we have a code snippet, try to extract methods\n                if let Some(code) = \u0026issue.code_snippet {\n                    let lines: Vec\u003c\u0026str\u003e = code.lines().collect();\n                    for line in lines {\n                        let trimmed = line.trim();\n                        // Very simple heuristic for method declarations\n                        if (trimmed.starts_with(\"fn \")\n                            || trimmed.starts_with(\"pub fn \")\n                            || trimmed.starts_with(\"def \")\n
