# Docker Compose configuration for Uveddi with Image Rendering Service
version: '3.8'

services:
  # Main Rust application
  uveddi:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      - RUST_LOG=info
      - DATABASE_URL=sqlite:///app/data/uveddi.db
      - RENDERING_SERVICE_URL=http://rendering-service:3001
      - RENDERING_SERVICE_TIMEOUT=30
    volumes:
      - ./data:/app/data
      - ./target/analysis:/app/analysis
    ports:
      - "8080:8080"
    depends_on:
      rendering-service:
        condition: service_healthy
    networks:
      - uveddi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "./uveddi", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Image rendering service
  rendering-service:
    build:
      context: .
      dockerfile: rendering-service/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MAX_WORKERS=3
    ports:
      - "3001:3001"
    networks:
      - uveddi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Optional: PostgreSQL for team collaboration
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=uveddi
      - POSTGRES_USER=uveddi
      - POSTGRES_PASSWORD=uveddi_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - uveddi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uveddi -d uveddi"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - uveddi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  uveddi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
