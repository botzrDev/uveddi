apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uveddi-ingress
  namespace: uveddi
  labels:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: uveddi-platform
  annotations:
    # NGINX Ingress annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:" always;
    
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
    # Request size limits
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/client-max-body-size: "10m"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    
    # Certificate management (cert-manager)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/acme-challenge-type: "http01"
    
    # Monitoring
    nginx.ingress.kubernetes.io/enable-access-log: "true"
    nginx.ingress.kubernetes.io/enable-rewrite-log: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - uveddi.example.com  # Replace with actual domain
    - api.uveddi.example.com
    secretName: uveddi-tls
  rules:
  - host: uveddi.example.com  # Replace with actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: uveddi-api
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: uveddi-api
            port:
              number: 80
      - path: /health
        pathType: Exact
        backend:
          service:
            name: uveddi-api
            port:
              number: 80
      - path: /ready
        pathType: Exact
        backend:
          service:
            name: uveddi-api
            port:
              number: 80
  - host: api.uveddi.example.com  # API subdomain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: uveddi-api
            port:
              number: 80