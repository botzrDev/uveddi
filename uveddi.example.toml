# Uveddi Configuration Example - v0.9.0-alpha
# ⚠️ WARNING: Many options documented here may not work as expected
# This file shows both working and non-working configuration options

# ==============================================================================
# ✅ WORKING CONFIGURATION OPTIONS
# These settings are actually implemented and functional
# ==============================================================================

[analysis]
# Timeout for analysis operations (actually works)
timeout_seconds = 300  # Default: 300, increase for large codebases

# Output format configuration (works)
default_output_format = "json"  # Options: "json", "markdown", "html"

# ==============================================================================
# ⚠️ PARTIALLY WORKING OPTIONS
# These work but with significant limitations
# ==============================================================================

# Dead code detection configuration
[dead_code]
# Confidence threshold (partially works, algorithm is imperfect)
confidence_threshold = 0.9  # 0.0-1.0, higher = fewer false positives

# Library mode (works but may miss valid dead code)
library_mode = true  # Set to true for libraries that export APIs

# Ignore patterns (basic pattern matching only)
ignore_patterns = ["test", "spec", "mock", "__test__"]

# Keep alive symbols (basic implementation)
keep_alive = ["main", "init", "setup"]

# Large class detection configuration  
[large_classes]
# These thresholds work but detection requires tree-sitter feature
max_logical_loc = 1000        # Max lines of code
max_methods = 20              # Max number of methods
max_fields = 15               # Max number of fields
max_cyclomatic_complexity = 50  # McCabe complexity
max_cognitive_complexity = 40   # Cognitive complexity
max_lcom_score = 0.8          # Lack of cohesion (0.0-1.0)
max_coupling = 30             # Coupling between objects

# Patterns to ignore (basic glob matching)
ignore_patterns = ["tests/", "examples/", "vendor/"]

# ==============================================================================
# ⚠️ EXPERIMENTAL OPTIONS
# These options exist but are unstable or unreliable
# ==============================================================================

# AI Integration (requires Ollama, often fails)
[ai]
# ⚠️ Only Ollama provider works, and it's experimental
provider = "ollama"  # Only "ollama" is partially implemented

# Model selection (must be pre-downloaded in Ollama)
ollama_model = "deepseek-coder:6.7b"  # Must match exact Ollama model name

# API endpoint (must have Ollama running)
ollama_api_url = "http://localhost:11434"  # Default Ollama URL

# Enable AI explanations (very slow, may timeout)
enable_explanations = false  # Set to false for stability

# Memory optimization (experimental, may cause crashes)
[memory]
# ⚠️ These settings are experimental and may not work
enable_optimization = false  # Keep false for stability
memory_limit_gb = 8.0       # May be ignored
cache_size_mb = 512         # Cache implementation is buggy

# Plugin system configuration (alpha quality)
[plugins]
# ⚠️ Plugin system is very unstable
enabled = false              # Keep disabled unless testing
plugin_dir = "./plugins"     # Directory for WASM plugins
max_plugin_memory_mb = 256   # Memory limit per plugin
plugin_timeout_seconds = 30  # Execution timeout

