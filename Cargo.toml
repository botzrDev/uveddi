[package]
name = "codeatlas"
version = "0.1.0"
edition = "2024"
description = "A Rust-based code analysis and exploration tool"
authors = ["Phillip Austin Green <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/yourusername/codeatlas"
keywords = ["code", "analysis", "tools", "visualization"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
refinery = { version = "0.8", features = ["rusqlite"] }
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.8"
