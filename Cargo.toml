[package]
name = "uveddi"
version = "0.1.0"
edition = "2021"
description = "A Rust-based code analysis and exploration tool"
authors = ["Phillip Austin Green <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/botzrDev/uveddi"
keywords = ["code", "analysis", "tools", "visualization", "uveddi"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
rusqlite = { version = "0.31.0", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }
tokio = { version = "1.37.0", features = ["full"] }
tokio-stream = { version = "0.1.15", features = ["fs"] }
futures = "0.3"
async-stream = "0.3"
chrono = { version = "0.4.38", features = ["serde"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
bincode = "1.3.3"
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0.61"
anyhow = "1.0.86"
clap = { version = "4.5.4", features = ["derive", "env"] }
log = "0.4.21"
env_logger = "0.11.3"
regex = "1.10"
tree-sitter = "0.22.6"
tree-sitter-rust = "0.21.0"
tree-sitter-python = "0.21.0"
tree-sitter-javascript = "0.21.0"
tree-sitter-typescript = "0.21.0"
reqwest = { version = "0.12.4", features = ["json"] }
walkdir = "2.5.0"
ignore = "0.4.22"
wasmtime = "21.0.1"
wasmtime-wasi = "21.0.1"
wit-bindgen = "0.25.0"
cap-std = "3.0.0"
wasi-common = "21.0.1"
toml = "0.8.0"
sha2 = "0.10.0"
uveddi-plugin-api = { path = "plugins/uveddi-plugin-api" }
async-trait = "0.1.88"
md5 = "0.8.0"
petgraph = "0.8.2"
color-eyre = "0.6"


[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
mockall = "0.11"
mockito = "0.31"
assert_cmd = "2.0"
predicates = "2.1"
serde_json = "1.0"
criterion = { version = "0.5.1", features = ["async_tokio"] }
