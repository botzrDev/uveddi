apiVersion: v1
kind: Secret
metadata:
  name: uveddi-secrets
  namespace: uveddi
  labels:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: uveddi-platform
type: Opaque
data:
  # Database configuration (base64 encoded)
  # Use 'echo -n "your-value" | base64' to encode
  DATABASE_URL: c3FsaXRlOi8vL2FwcC9kYXRhL3V2ZWRkaS5kYg== # sqlite:///app/data/uveddi.db
  
  # PostgreSQL connection (if using external database)
  # POSTGRES_PASSWORD: ""
  # POSTGRES_CONNECTION_STRING: ""
  
  # Redis connection (if using external cache)
  # REDIS_URL: ""
  
  # API Keys for external services
  # OLLAMA_API_KEY: ""
  
  # JWT signing key (generate with 'openssl rand -base64 32 | base64')
  # JWT_SECRET: ""
  
  # Encryption key for sensitive data
  # ENCRYPTION_KEY: ""
  
---
apiVersion: v1
kind: Secret
metadata:
  name: uveddi-tls
  namespace: uveddi
  labels:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: uveddi-platform
type: kubernetes.io/tls
data:
  # TLS certificate and key (will be populated by cert-manager)
  tls.crt: ""
  tls.key: ""