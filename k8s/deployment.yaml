# Production Kubernetes Deployment for Uveddi Analysis Engine
# High-availability, auto-scaling, production-ready configuration

apiVersion: apps/v1
kind: Deployment
metadata:
  name: uveddi-analysis-engine
  namespace: uveddi
  labels:
    app: uveddi-analysis-engine
    version: v0.9.0-alpha
    component: analysis-engine
spec:
  # High availability with rolling updates
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2

  selector:
    matchLabels:
      app: uveddi-analysis-engine

  template:
    metadata:
      labels:
        app: uveddi-analysis-engine
        version: v0.9.0-alpha
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      # Service account for RBAC
      serviceAccountName: uveddi-service-account

      containers:
      - name: analysis-engine
        image: uveddi/analysis-engine:v0.9.0-alpha
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: websocket
          containerPort: 8080
          protocol: TCP

        # Environment configuration
        env:
        - name: RUST_LOG
          value: "info"
        - name: CONFIG_FILE
          value: "/app/config/production.yaml"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        # Resource limits and requests
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "6Gi"
            cpu: "4000m"

        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1

        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

        # Volume mounts
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: data-storage
          mountPath: /app/data
        - name: cache-storage
          mountPath: /app/cache
        - name: temp-storage
          mountPath: /app/temp

        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

      # Volumes
      volumes:
      - name: config
        configMap:
          name: uveddi-config
      - name: data-storage
        persistentVolumeClaim:
          claimName: uveddi-data-pvc
      - name: cache-storage
        emptyDir:
          sizeLimit: "4Gi"
      - name: temp-storage
        emptyDir:
          sizeLimit: "2Gi"

      # Pod scheduling
      affinity:
        # Prefer spreading pods across nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - uveddi-analysis-engine
              topologyKey: kubernetes.io/hostname

      # Node selection
      nodeSelector:
        kubernetes.io/arch: amd64
        node-type: compute-optimized

      # Tolerations for dedicated nodes
      tolerations:
      - key: "uveddi-dedicated"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

      # Graceful termination
      terminationGracePeriodSeconds: 30

---
# Horizontal Pod Autoscaler for dynamic scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: uveddi-analysis-engine-hpa
  namespace: uveddi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: uveddi-analysis-engine

  minReplicas: 3
  maxReplicas: 20

  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  # Custom metrics for cache efficiency
  - type: Pods
    pods:
      metric:
        name: cache_hit_rate
      target:
        type: AverageValue
        averageValue: "0.8"

  # Scale-up policy
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60