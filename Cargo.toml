path = "src/bin/simple_cycle_demo.rs"

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"
mockall = "0.13.1"
mockito = "1.7.0"
assert_cmd = "2.0"
predicates = "3.1.3"
serde_json = "1.0"
rstest = "0.26.1"
criterion = { version = "0.7.0", features = ["html_reports"] }
iai-callgrind = "0.16.1"
serial_test = "3.0"
proptest = "1.4"
# Note: Coverage tools (tarpaulin, cargo-llvm-cov) are installed via CI, not as dependencies

[build-dependencies]
# PHF code generation for build-time index creation
phf_codegen = "0.13.1"
# JSON serialization for knowledge base processing
serde_json = "1.0"
# Compression for build-time knowledge library preparation
flate2 = "1.0"
# SHA-256 hashing for checksums
sha2 = "0.10"
# Chrono for build timestamp
chrono = { version = "=0.4.41", features = ["serde"] }

[[test]]
name = "analysis_engine"
path = "tests/analysis/engine.rs"

[[test]]
name = "application"
path = "tests/application.rs"

[[test]]
name = "config"
path = "tests/config.rs"

[[test]]
name = "cli_analyze"
path = "tests/cli_analyze.rs"

[[test]]
name = "database_crud"
path = "tests/database_crud.rs"

[[test]]
name = "comprehensive_coverage"
path = "tests/coverage/comprehensive_coverage.rs"

[[test]]
name = "edge_case_testing"
path = "tests/coverage/edge_case_testing.rs"

[[test]]
name = "regression_prevention"
path = "tests/coverage/regression_prevention.rs"

[[test]]
name = "security_tests"
path = "tests/security_tests.rs"

# Benchmarks removed for Alpha release

# Optimized build profiles for different development scenarios

# Ultra-fast development profile for rapid iteration
[profile.dev-ultra-fast]
inherits = "dev"
opt-level = 0          # No optimization for fastest compilation
debug = false          # Minimal debug info to reduce memory usage
debug-assertions = false # Skip debug assertions for speed
overflow-checks = false  # Skip overflow checks for speed
lto = false            # No link-time optimization
panic = 'unwind'       # Standard panic handling
incremental = true     # Enable incremental compilation
codegen-units = 256    # Maximum parallelism for compilation speed
rpath = false          # Disable rpath for faster linking

# Memory-optimized development profile (based on memory hierarchy research)
[profile.dev-fast]
inherits = "dev"
opt-level = 0          # No optimization for fastest compilation
debug = false          # Minimal debug info to reduce memory
debug-assertions = false
overflow-checks = false
lto = false           # No link-time optimization for speed
panic = 'unwind'      # Standard panic handling
incremental = true    # Enable incremental compilation
codegen-units = 16    # Maximum parallelism for multi-core builds

# Memory-efficient development with some optimization
[profile.dev-optimized]
inherits = "dev"
opt-level = 1          # Light optimization
debug = true           # Keep debug info for development
lto = false
incremental = true
codegen-units = 8      # Balance between parallelism and optimization

# Test profile optimized for CI/CD speed
[profile.test-fast]
inherits = "test"
opt-level = 0          # Fast compilation for tests
debug = false          # Minimal debug info for CI
incremental = true     # Incremental compilation for CI caching
codegen-units = 16     # Parallel compilation

# Release profile with performance optimizations
[profile.release]
opt-level = 3          # Maximum optimization
lto = "fat"            # Full link-time optimization for production
codegen-units = 1      # Single codegen unit for best optimization
panic = "abort"        # Abort on panic for smaller binaries
strip = true           # Strip debug symbols for smaller binaries

# Optimized release profile for size-constrained environments
[profile.release-small]
inherits = "release"
opt-level = "z"        # Optimize for size
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

