# Docker Compose for Uveddi TUI Testing Environment
# Provides isolated testing environment for TUI integration validation

version: '3.8'

services:
  # Main testing environment container
  uveddi-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uveddi-tui-test
    
    # Mount source code for testing
    volumes:
      - ../../:/workspace:ro  # Mount Uveddi source as read-only
      - test-results:/home/testuser/test-workspace/results  # Persist test results
    
    # Interactive terminal for TUI testing
    stdin_open: true
    tty: true
    
    # Environment variables for testing
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - TERM=xterm-256color
    
    # Working directory
    working_dir: /home/testuser/test-workspace
    
    # Default command drops into bash for interactive testing
    command: ["/bin/bash"]
    
    # Network configuration (if needed for web testing)
    ports:
      - "8080:8080"  # For testing web dashboard
      - "3001:3001"  # For testing rendering service
    
    # Resource limits for realistic testing
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'

  # Separate service for automated testing (non-interactive)
  uveddi-test-automated:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uveddi-automated-tests
    
    volumes:
      - ../../:/workspace:ro
      - test-results:/home/testuser/test-workspace/results
    
    environment:
      - RUST_LOG=info
      - AUTOMATED_TESTING=true
    
    # Run automated tests and exit
    command: >
      bash -c "
        cd /home/testuser && 
        ./scripts/test-setup.sh && 
        ./scripts/comprehensive-tui-test.sh && 
        ./scripts/user-experience-test.sh
      "
    
    # No TTY for automated testing
    tty: false
    stdin_open: false

# Named volumes for persistence
volumes:
  test-results:
    driver: local

# Network for service communication (if needed)
networks:
  default:
    name: uveddi-test-network
    driver: bridge