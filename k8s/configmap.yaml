# ConfigMap for Uveddi Analysis Engine Production Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: uveddi-config
  namespace: uveddi
  labels:
    app: uveddi-analysis-engine
data:
  production.yaml: |
    # Kubernetes-optimized production configuration

    # Server configuration
    server:
      host: "0.0.0.0"
      port: 8080
      workers: 0  # Auto-detect based on available CPUs

    # Cache configuration - tuned for Kubernetes resource limits
    cache:
      layers:
        ast:
          max_entries: 75000
          ttl_seconds: 3600
          memory_limit_mb: 3072
          eviction_policy: "lru_with_ttl"

        analysis:
          max_entries: 37500
          ttl_seconds: 1800
          memory_limit_mb: 1536
          eviction_policy: "adaptive"

        graph:
          max_entries: 15000
          ttl_seconds: 7200
          memory_limit_mb: 768
          eviction_policy: "lru"

      compression:
        enabled: true
        algorithm: "lz4"
        threshold_bytes: 1024

      persistence:
        enabled: true
        directory: "/app/data/cache"
        sync_interval_seconds: 300
        recovery_on_startup: true

    # Database configuration
    database:
      type: "sqlite"
      connection_string: "/app/data/analysis.db"
      connection_pool:
        max_connections: 30
        min_connections: 10
        connection_timeout_seconds: 30

      performance:
        wal_mode: true
        synchronous: "normal"
        cache_size_kb: 204800  # 200MB SQLite cache

    # Analysis engine configuration
    analysis:
      max_concurrent_files: 0  # Auto-detect based on CPU cores
      timeout_seconds: 900

      languages:
        - rust
        - python
        - javascript
        - typescript

      detectors:
        security:
          enabled: true
          severity_threshold: "medium"
        architecture:
          enabled: true
          anti_patterns: true
          circular_dependencies: true
        performance:
          enabled: true
          memory_analysis: true

    # Kubernetes-aware monitoring
    monitoring:
      metrics:
        enabled: true
        endpoint: "/metrics"
        format: "prometheus"

      tracing:
        enabled: true
        service_name: "uveddi-analysis-engine"
        endpoint: "http://jaeger-collector.monitoring:14268/api/traces"
        sample_rate: 0.1

      logging:
        level: "info"
        format: "json"
        output: "stdout"
        fields:
          service: "uveddi"
          version: "0.9.0-alpha"
          environment: "production"
          cluster: "k8s"

    # Security configuration
    security:
      authentication:
        enabled: true
        jwt_secret_file: "/app/secrets/jwt_secret"
        token_expiry_seconds: 3600

      rate_limiting:
        requests_per_minute: 2000
        analysis_requests_per_minute: 20
        websocket_connections_per_ip: 10

      cors:
        enabled: true
        allowed_origins:
          - "https://uveddi-frontend.example.com"
          - "https://dashboard.example.com"
        allowed_methods: ["GET", "POST", "PUT", "DELETE"]
        allowed_headers: ["Content-Type", "Authorization"]

    # Kubernetes resource-aware limits
    resources:
      memory:
        heap_limit_mb: 5120  # Leave 1GB for system
        cache_limit_mb: 4096

      cpu:
        analysis_threads: 0  # Auto-detect
        io_threads: 8

      disk:
        temp_directory: "/app/temp"
        max_temp_size_mb: 1536
        cleanup_interval_seconds: 3600

    # High availability for Kubernetes
    ha:
      health_check:
        interval_seconds: 10
        timeout_seconds: 5
        failure_threshold: 3

      graceful_shutdown:
        timeout_seconds: 25  # Less than terminationGracePeriodSeconds
        drain_connections: true

      circuit_breaker:
        failure_threshold: 5
        timeout_seconds: 60
        half_open_max_calls: 3

---
