name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      force_deploy:
        description: 'Force deployment (skip checks)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and Push Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.meta.outputs.tags }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=Uveddi
          org.opencontainers.image.description=Architectural Analysis Tool
          org.opencontainers.image.vendor=Uveddi Team
          org.opencontainers.image.licenses=MIT
        
    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
  file: ./deploy/Dockerfile.production
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
        
    - name: Output image
      id: image
      run: |
        echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  security-scan:
    name: Container Security Scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.build.outputs.image }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        
    - name: Check for critical vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.build.outputs.image }}
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL'

  test-deployment:
    name: Test Container Deployment
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Test container startup
      run: |
        docker run --rm -d --name uveddi-test \
          -p 8080:8080 \
          -e DATABASE_URL=sqlite:///tmp/test.db \
          ${{ needs.build.outputs.image }}
        
        # Wait for container to start
        sleep 30
        
        # Test health endpoint
        curl -f http://localhost:8080/health
        
        # Test API endpoint
        curl -f http://localhost:8080/api/v1/health
        
        # Cleanup
        docker stop uveddi-test

  deploy-staging:
    name: Deploy to Staging
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') == false)
    needs: [build, security-scan, test-deployment]
    runs-on: ubuntu-latest
    environment: 
      name: staging
      url: https://staging.uveddi.example.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBECONFIG_STAGING }}
        
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'
        
    - name: Add Helm repositories
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo update
        
    - name: Deploy to staging
      run: |
        # Extract image tag
        IMAGE_TAG=$(echo "${{ needs.build.outputs.tag }}" | head -n1 | cut -d: -f2)
        
        # Deploy using Helm
        helm upgrade --install uveddi ./helm/uveddi \
          --namespace uveddi \
          --create-namespace \
          --values ./helm/uveddi/values-staging.yaml \
          --set image.tag=${IMAGE_TAG} \
          --set environment=staging \
          --wait \
          --timeout=600s
        
    - name: Verify deployment
      run: |
        kubectl -n uveddi rollout status deployment/uveddi --timeout=300s
        kubectl -n uveddi get pods
        kubectl -n uveddi get services
        
    - name: Run smoke tests
      run: |
        # Wait for service to be ready
        kubectl -n uveddi wait --for=condition=ready pod -l app.kubernetes.io/name=uveddi --timeout=300s
        
        # Port forward for testing
        kubectl -n uveddi port-forward service/uveddi 8080:80 &
        KUBECTL_PID=$!
        sleep 10
        
        # Run smoke tests
        curl -f http://localhost:8080/health
        curl -f http://localhost:8080/ready
        
        # Cleanup
        kill $KUBECTL_PID

  deploy-production:
    name: Deploy to Production
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [build, security-scan, test-deployment]
    runs-on: ubuntu-latest
    environment: 
      name: production
      url: https://uveddi.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBECONFIG_PRODUCTION }}
        
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'
        
    - name: Add Helm repositories
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo update
        
    - name: Pre-deployment checks
      run: |
        # Check cluster health
        kubectl cluster-info
        kubectl get nodes
        
        # Check existing deployment
        kubectl -n uveddi get deployment uveddi || echo "No existing deployment found"
        
        # Verify external secrets
        if kubectl -n uveddi get externalsecret; then
          kubectl -n uveddi get externalsecret -o wide
        fi
        
    - name: Run database migration
      run: |
        IMAGE_TAG=$(echo "${{ needs.build.outputs.tag }}" | head -n1 | cut -d: -f2)
        
        # Create migration job
        kubectl -n uveddi delete job uveddi-migration --ignore-not-found=true
        
        sed "s|ghcr.io/botzrdev/uveddi:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}|g" \
          k8s/migrations/migration-job.yaml | kubectl -n uveddi apply -f -
        
        # Wait for migration to complete
        kubectl -n uveddi wait --for=condition=complete job/uveddi-migration --timeout=600s
        
        # Check migration logs
        kubectl -n uveddi logs job/uveddi-migration
        
    - name: Deploy to production
      run: |
        # Extract image tag
        IMAGE_TAG=$(echo "${{ needs.build.outputs.tag }}" | head -n1 | cut -d: -f2)
        
        # Deploy using Helm with production values
        helm upgrade --install uveddi ./helm/uveddi \
          --namespace uveddi \
          --create-namespace \
          --values ./helm/uveddi/values-production.yaml \
          --set image.tag=${IMAGE_TAG} \
          --set environment=production \
          --wait \
          --timeout=900s
        
    - name: Verify production deployment
      run: |
        # Wait for rollout to complete
        kubectl -n uveddi rollout status deployment/uveddi --timeout=600s
        
        # Check pod status
        kubectl -n uveddi get pods -o wide
        
        # Check services
        kubectl -n uveddi get services
        
        # Check ingress
        kubectl -n uveddi get ingress
        
    - name: Production smoke tests
      run: |
        # Wait for all pods to be ready
        kubectl -n uveddi wait --for=condition=ready pod -l app.kubernetes.io/name=uveddi --timeout=600s
        
        # Test internal service
        kubectl -n uveddi port-forward service/uveddi 8080:80 &
        KUBECTL_PID=$!
        sleep 15
        
        # Run comprehensive smoke tests
        curl -f http://localhost:8080/health
        curl -f http://localhost:8080/ready
        curl -f http://localhost:8080/metrics
        
        # Cleanup
        kill $KUBECTL_PID
        
    - name: Post-deployment monitoring check
      run: |
        # Check HPA status
        kubectl -n uveddi get hpa
        
        # Check PDB status
        kubectl -n uveddi get pdb
        
        # Check recent events
        kubectl -n uveddi get events --sort-by=.metadata.creationTimestamp
        
        echo "✅ Production deployment completed successfully"

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: Notify success
      if: ${{ needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success' }}
      run: |
        if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
          echo "🚀 Production deployment completed successfully!"
          echo "Application is now live at https://uveddi.com"
        elif [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
          echo "🚀 Staging deployment completed successfully!"
          echo "Application is now live at https://staging.uveddi.example.com"
        fi
        
    - name: Notify failure
      if: ${{ needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure' }}
      run: |
        echo "❌ Deployment failed!"
        echo "Please check the logs for details and run rollback if necessary"
        exit 1