---
apiVersion: v1
kind: Service
metadata:
  name: uveddi-blue
  namespace: uveddi-production
  labels:
    app: uveddi
    version: blue
    environment: production
spec:
  selector:
    app: uveddi
    version: blue
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: uveddi-green
  namespace: uveddi-production
  labels:
    app: uveddi
    version: green
    environment: production
spec:
  selector:
    app: uveddi
    version: green
  ports:
  - name: http
    port: 80
    targetPort: 8080
