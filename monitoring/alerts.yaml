# Prometheus Alert Rules for Uveddi Analysis Engine Production Monitoring
# Critical alerts for cache performance, system health, and user experience

groups:
  - name: uveddi.cache.performance
    interval: 30s
    rules:
      # Critical: Cache hit rate below performance target
      - alert: CacheHitRateLow
        expr: (rate(uveddi_cache_hits_total[5m]) / rate(uveddi_cache_requests_total[5m])) < 0.75
        for: 2m
        labels:
          severity: warning
          service: uveddi-analysis-engine
          category: performance
        annotations:
          summary: "Uveddi cache hit rate is below target"
          description: "Cache hit rate is {{ $value | humanizePercentage }} for instance {{ $labels.instance }}, layer {{ $labels.layer }}. Target is 75%+"

      # Critical: Cache hit rate critically low
      - alert: CacheHitRateCritical
        expr: (rate(uveddi_cache_hits_total[5m]) / rate(uveddi_cache_requests_total[5m])) < 0.50
        for: 1m
        labels:
          severity: critical
          service: uveddi-analysis-engine
          category: performance
        annotations:
          summary: "CRITICAL: Uveddi cache hit rate critically low"
          description: "Cache hit rate is {{ $value | humanizePercentage }} for instance {{ $labels.instance }}, layer {{ $labels.layer }}. Immediate investigation required."

      # Cache memory usage high
      - alert: CacheMemoryHigh
        expr: (uveddi_cache_memory_bytes / uveddi_cache_memory_limit_bytes) > 0.90
        for: 5m
        labels:
          severity: warning
          service: uveddi-analysis-engine
          category: resource
        annotations:
          summary: "Cache memory usage is high"
          description: "Cache memory usage is {{ $value | humanizePercentage }} for layer {{ $labels.layer }} on instance {{ $labels.instance }}"

  - name: uveddi.analysis.performance
    interval: 30s
    rules:
      # Analysis throughput low
      - alert: AnalysisThroughputLow
        expr: rate(uveddi_analyses_completed_total[5m]) < 0.1
        for: 5m
        labels:
          severity: warning
          service: uveddi-analysis-engine
          category: performance
        annotations:
          summary: "Analysis throughput is low"
          description: "Completing {{ $value | humanize }} analyses per second, which is below expected rate"

      # Analysis queue depth high
      - alert: AnalysisQueueHigh
        expr: uveddi_analysis_queue_length > 20
        for: 3m
        labels:
          severity: warning
          service: uveddi-analysis-engine
          category: performance
        annotations:
          summary: "Analysis queue depth is high"
          description: "{{ $value }} analyses queued on instance {{ $labels.instance }}, indicating potential bottleneck"

      # Analysis timeout rate high
      - alert: AnalysisTimeoutHigh
        expr: rate(uveddi_analysis_timeouts_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          service: uveddi-analysis-engine
          category: reliability
        annotations:
          summary: "High analysis timeout rate"
          description: "{{ $value | humanize }} analyses timing out per second on instance {{ $labels.instance }}"

  - name: uveddi.system.health
    interval: 30s
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: uveddi-analysis-engine
          category: resource
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value | humanize }}% on instance {{ $labels.instance }}"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / 1024 / 1024 / 1024) > 5
        for: 3m
        labels:
          severity: warning
          service: uveddi-analysis-engine
          category: resource
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value | humanize }}GB on instance {{ $labels.instance }}"

      # Service down
      - alert: ServiceDown
        expr: up{job="uveddi-analysis-engine"} == 0
        for: 1m
        labels:
          severity: critical
          service: uveddi-analysis-engine
          category: availability
        annotations:
          summary: "Uveddi Analysis Engine is down"
          description: "Instance {{ $labels.instance }} is not responding to health checks"

  - name: uveddi.api.reliability
    interval: 30s
    rules:
      # HTTP error rate high
      - alert: HighHTTPErrorRate
        expr: rate(uveddi_http_requests_total{status=~"5.."}[5m]) / rate(uveddi_http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          service: uveddi-analysis-engine
          category: reliability
        annotations:
          summary: "High HTTP error rate"
          description: "{{ $value | humanizePercentage }} of HTTP requests are returning 5xx errors on instance {{ $labels.instance }}"

      # Response time high
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(uveddi_request_duration_seconds_bucket[5m])) > 10
        for: 3m
        labels:
          severity: warning
          service: uveddi-analysis-engine
          category: performance
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value | humanizeDuration }} on instance {{ $labels.instance }}"

      # WebSocket connection failures
      - alert: WebSocketConnectionFailures
        expr: rate(uveddi_websocket_connection_failures_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          service: uveddi-analysis-engine
          category: connectivity
        annotations:
          summary: "WebSocket connection failures detected"
          description: "{{ $value | humanize }} WebSocket connection failures per second on instance {{ $labels.instance }}"

  - name: uveddi.business.sla
    interval: 60s
    rules:
      # SLA: 99.9% availability
      - alert: SLAAvailabilityBreach
        expr: (rate(uveddi_http_requests_total{status!~"5.."}[1h]) / rate(uveddi_http_requests_total[1h])) < 0.999
        for: 5m
        labels:
          severity: critical
          service: uveddi-analysis-engine
          category: sla
        annotations:
          summary: "SLA availability breach detected"
          description: "Service availability is {{ $value | humanizePercentage }}, below 99.9% SLA target"

      # SLA: Response time target
      - alert: SLAResponseTimeBreach
        expr: histogram_quantile(0.95, rate(uveddi_request_duration_seconds_bucket[1h])) > 5
        for: 10m
        labels:
          severity: warning
          service: uveddi-analysis-engine
          category: sla
        annotations:
          summary: "SLA response time target breach"
          description: "95th percentile response time is {{ $value | humanizeDuration }}, above 5s SLA target"

      # Business metric: Cache effectiveness
      - alert: CacheEffectivenessLow
        expr: avg(uveddi_analysis_speedup_factor) < 2.0
        for: 10m
        labels:
          severity: warning
          service: uveddi-analysis-engine
          category: business
        annotations:
          summary: "Cache effectiveness below business target"
          description: "Average analysis speedup is {{ $value | humanize }}x, below 2x business target"