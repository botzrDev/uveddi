apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: uveddi-servicemonitor
  namespace: uveddi
  labels:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: uveddi-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: uveddi
      app.kubernetes.io/component: api
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    metricRelabelings:
    - sourceLabels: [__name__]
      regex: '^go_.*'
      action: drop
    - sourceLabels: [__name__]
      regex: '^process_.*'
      action: drop
  namespaceSelector:
    matchNames:
    - uveddi