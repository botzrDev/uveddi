openapi: 3.0.3
info:
  title: Uveddi Monitoring API
  version: 1.0.0
  description: |
    Comprehensive API for the Uveddi static code analysis system with AI-powered insights,
    real-time monitoring, and enterprise-grade security features.
    
    ## Features
    - Multi-language code analysis (Rust, Python, JavaScript, TypeScript)
    - AI-powered anti-pattern detection with 95%+ accuracy
    - Real-time performance monitoring (4.3M+ metrics/sec capacity)
    - WebSocket-based live updates
    - Enterprise security with RBAC
    - Comprehensive reporting and visualization
    
  contact:
    name: Uveddi API Support
    url: https://github.com/uveddi/uveddi
    email: support@uveddi.com
  license:
    name: MIT
    url: https://github.com/uveddi/uveddi/blob/main/LICENSE

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.uveddi.com
    description: Production server

paths:
  /api/v1/analysis:
    post:
      summary: Trigger comprehensive code analysis
      description: |
        Initiates a comprehensive static code analysis with configurable detection options.
        Supports multi-language analysis with AI-powered insights and real-time progress tracking.
      tags:
        - Analysis
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
            examples:
              basic_analysis:
                summary: Basic code analysis
                value:
                  project_path: "/path/to/project"
                  languages: ["rust", "python"]
                  detectors: ["god_object", "dead_code", "tight_coupling"]
                  output_format: "json"
              ai_enhanced:
                summary: AI-enhanced analysis
                value:
                  project_path: "/path/to/project"
                  languages: ["rust", "javascript", "typescript"]
                  detectors: ["all"]
                  enable_ai: true
                  ai_provider: "ollama"
                  output_format: "markdown"
                  include_suggestions: true
      responses:
        '200':
          description: Analysis completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
              examples:
                successful_analysis:
                  summary: Successful analysis result
                  value:
                    analysis_id: "analysis_001"
                    status: "completed"
                    duration_ms: 15000
                    summary:
                      total_files: 125
                      issues_found: 23
                      critical_issues: 3
                      warnings: 20
                    anti_patterns:
                      - type: "god_object"
                        severity: "critical"
                        file_path: "src/large_service.rs"
                        line_number: 45
                        description: "Class exceeds recommended size limits"
                        ai_explanation: "This class has grown too large and handles multiple responsibilities..."
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/analysis/{id}:
    get:
      summary: Get analysis result by ID
      description: Retrieve the complete results of a previously run analysis
      tags:
        - Analysis
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique analysis identifier
      responses:
        '200':
          description: Analysis result retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
        '404':
          description: Analysis not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/analysis/{id}/status:
    get:
      summary: Get analysis execution status
      description: Check the current status of a running or completed analysis
      tags:
        - Analysis
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique analysis identifier
      responses:
        '200':
          description: Analysis status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisStatus'

  /api/v1/metrics:
    get:
      summary: Get real-time performance metrics
      description: |
        Retrieve current system performance metrics including CPU, memory, and analysis throughput.
        Supports high-frequency polling for real-time monitoring dashboards.
      tags:
        - Monitoring
      security:
        - BearerAuth: []
      parameters:
        - name: timerange
          in: query
          required: false
          schema:
            type: string
            enum: [5m, 15m, 1h, 6h, 24h]
            default: 5m
          description: Time range for metric aggregation
        - name: include_historical
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include historical trend data
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'

  /api/v1/health:
    get:
      summary: System health check
      description: Get comprehensive system health status including all service dependencies
      tags:
        - Monitoring
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: System is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/v1/config:
    get:
      summary: Get current configuration
      description: Retrieve the current system configuration settings
      tags:
        - Configuration
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
    
    put:
      summary: Update system configuration
      description: Update system configuration settings (requires admin privileges)
      tags:
        - Configuration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Configuration'
      responses:
        '200':
          description: Configuration updated successfully
        '403':
          description: Insufficient privileges
        '400':
          description: Invalid configuration

  /api/v1/reports:
    get:
      summary: List available reports
      description: Get a list of all generated analysis reports
      tags:
        - Reports
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Reports list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsListResponse'

  /api/v1/reports/{id}:
    get:
      summary: Get report by ID
      description: Download a specific analysis report in the requested format
      tags:
        - Reports
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [json, markdown, html, pdf]
            default: json
      responses:
        '200':
          description: Report retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
            text/markdown:
              schema:
                type: string
            text/html:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary

  /ws/monitoring:
    get:
      summary: WebSocket endpoint for real-time monitoring
      description: |
        WebSocket connection for real-time performance metrics and analysis updates.
        Supports high-throughput streaming (4.3M+ metrics/sec capacity).
        
        ## Message Types
        - `metrics`: Real-time performance data
        - `analysis_progress`: Live analysis updates
        - `alerts`: Critical system alerts
        - `heartbeat`: Connection keep-alive
      tags:
        - WebSocket
      security:
        - BearerAuth: []
      responses:
        '101':
          description: WebSocket connection established
        '401':
          description: Authentication required
        '403':
          description: Insufficient privileges

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for API authentication

  schemas:
    AnalysisRequest:
      type: object
      required:
        - project_path
      properties:
        project_path:
          type: string
          description: Path to the project root directory
          example: "/path/to/project"
        languages:
          type: array
          items:
            type: string
            enum: [rust, python, javascript, typescript, java, cpp]
          description: Programming languages to analyze
          default: ["rust"]
        detectors:
          type: array
          items:
            type: string
          description: |
            Anti-pattern detectors to enable. Use "all" for all detectors.
            Available: god_object, dead_code, tight_coupling, large_classes, cyclic_dependencies, magic_values
          default: ["all"]
        enable_ai:
          type: boolean
          description: Enable AI-powered explanations and suggestions
          default: false
        ai_provider:
          type: string
          enum: [ollama, openai]
          description: AI provider for enhanced analysis
          default: "ollama"
        output_format:
          type: string
          enum: [json, markdown, html]
          description: Output format for analysis results
          default: "json"
        include_suggestions:
          type: boolean
          description: Include AI-powered refactoring suggestions
          default: false
        max_analysis_time_ms:
          type: integer
          description: Maximum analysis time in milliseconds
          default: 300000
          minimum: 1000
          maximum: 1800000

    AnalysisResult:
      type: object
      properties:
        analysis_id:
          type: string
          description: Unique identifier for this analysis
          example: "analysis_001"
        status:
          type: string
          enum: [running, completed, failed, timeout]
          description: Current status of the analysis
        duration_ms:
          type: integer
          description: Analysis execution time in milliseconds
          example: 15000
        timestamp:
          type: string
          format: date-time
          description: Analysis completion timestamp
        summary:
          $ref: '#/components/schemas/AnalysisSummary'
        anti_patterns:
          type: array
          items:
            $ref: '#/components/schemas/AntiPattern'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/Dependency'
        metrics:
          $ref: '#/components/schemas/AnalysisMetrics'
        ai_insights:
          type: array
          items:
            $ref: '#/components/schemas/AIInsight'

    AnalysisSummary:
      type: object
      properties:
        total_files:
          type: integer
          description: Total number of files analyzed
          example: 125
        lines_of_code:
          type: integer
          description: Total lines of code analyzed
          example: 15420
        issues_found:
          type: integer
          description: Total number of issues detected
          example: 23
        critical_issues:
          type: integer
          description: Number of critical severity issues
          example: 3
        warnings:
          type: integer
          description: Number of warning-level issues
          example: 20
        analysis_accuracy:
          type: number
          format: float
          description: Statistical confidence in analysis results (0.0-1.0)
          example: 0.95

    AntiPattern:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this issue
        type:
          type: string
          enum: [god_object, dead_code, tight_coupling, large_classes, cyclic_dependencies, magic_values, leaky_abstraction]
          description: Type of anti-pattern detected
        severity:
          type: string
          enum: [critical, high, medium, low, info]
          description: Severity level of the issue
        file_path:
          type: string
          description: File path where the issue was found
          example: "src/analysis/engine.rs"
        line_number:
          type: integer
          description: Line number where the issue starts
          example: 145
        column_number:
          type: integer
          description: Column number where the issue starts
          example: 12
        description:
          type: string
          description: Human-readable description of the issue
          example: "Class exceeds recommended size limits with 1500+ lines"
        ai_explanation:
          type: string
          description: AI-generated detailed explanation (when AI is enabled)
          example: "This class has grown too large and appears to handle multiple responsibilities..."
        suggestion:
          type: string
          description: AI-generated refactoring suggestion
        confidence_score:
          type: number
          format: float
          description: Detection confidence score (0.0-1.0)
          example: 0.92

    Dependency:
      type: object
      properties:
        from:
          type: string
          description: Source file/module
        to:
          type: string
          description: Target file/module
        type:
          type: string
          enum: [import, function_call, inheritance, composition]
          description: Type of dependency relationship
        strength:
          type: number
          format: float
          description: Dependency strength (0.0-1.0)

    AnalysisMetrics:
      type: object
      properties:
        parse_time_ms:
          type: integer
          description: Time spent parsing source code
        detection_time_ms:
          type: integer
          description: Time spent running detectors
        ai_processing_time_ms:
          type: integer
          description: Time spent on AI analysis (when enabled)
        memory_usage_mb:
          type: integer
          description: Peak memory usage during analysis
        files_per_second:
          type: number
          format: float
          description: Analysis throughput in files per second

    AIInsight:
      type: object
      properties:
        type:
          type: string
          enum: [explanation, suggestion, pattern_recognition, best_practice]
        title:
          type: string
          description: Brief title of the insight
        description:
          type: string
          description: Detailed AI-generated insight
        relevance_score:
          type: number
          format: float
          description: Relevance score for this insight (0.0-1.0)
        related_files:
          type: array
          items:
            type: string
          description: Files related to this insight

    AnalysisStatus:
      type: object
      properties:
        analysis_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled, timeout]
        progress_percentage:
          type: integer
          minimum: 0
          maximum: 100
        current_phase:
          type: string
          enum: [parsing, detection, ai_analysis, report_generation, completed]
        files_processed:
          type: integer
        total_files:
          type: integer
        estimated_completion_time:
          type: string
          format: date-time
        error_message:
          type: string
          description: Error message if status is 'failed'

    MetricsResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        cpu_usage_percent:
          type: number
          format: float
          example: 25.5
        memory_usage_mb:
          type: integer
          example: 512
        disk_usage_percent:
          type: number
          format: float
          example: 45.2
        active_analyses:
          type: integer
          description: Number of currently running analyses
        total_requests:
          type: integer
          description: Total API requests processed
        requests_per_second:
          type: number
          format: float
          description: Current request rate
        websocket_connections:
          type: integer
          description: Active WebSocket connections
        metrics_per_second:
          type: integer
          description: Current metrics collection rate
          example: 4300000
        error_rate:
          type: number
          format: float
          description: Current error rate (0.0-1.0)
        response_time_p95_ms:
          type: number
          format: float
          description: 95th percentile response time

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: "1.0.0"
        uptime_seconds:
          type: integer
        services:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ServiceHealth'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheck'

    ServiceHealth:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        last_check:
          type: string
          format: date-time
        response_time_ms:
          type: integer
        error_message:
          type: string

    HealthCheck:
      type: object
      properties:
        name:
          type: string
          example: "database_connection"
        status:
          type: string
          enum: [pass, fail, warn]
        details:
          type: string
        duration_ms:
          type: integer

    Configuration:
      type: object
      properties:
        analysis:
          type: object
          properties:
            max_concurrent_analyses:
              type: integer
              default: 10
            default_timeout_ms:
              type: integer
              default: 300000
            enable_ai_by_default:
              type: boolean
              default: false
        monitoring:
          type: object
          properties:
            metrics_retention_days:
              type: integer
              default: 30
            websocket_port:
              type: integer
              default: 8080
            alert_thresholds:
              type: object
              properties:
                cpu_percent:
                  type: number
                  default: 80.0
                memory_percent:
                  type: number
                  default: 85.0
                error_rate:
                  type: number
                  default: 0.05
        security:
          type: object
          properties:
            require_authentication:
              type: boolean
              default: true
            jwt_expiration_hours:
              type: integer
              default: 24
            rate_limit_requests_per_minute:
              type: integer
              default: 100

    ReportsListResponse:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/ReportSummary'
        total_count:
          type: integer
        has_more:
          type: boolean

    ReportSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        created_at:
          type: string
          format: date-time
        analysis_id:
          type: string
        format:
          type: string
        size_bytes:
          type: integer

    Report:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        created_at:
          type: string
          format: date-time
        analysis_result:
          $ref: '#/components/schemas/AnalysisResult'
        metadata:
          type: object
          additionalProperties: true

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          example: "INVALID_REQUEST"
        message:
          type: string
          description: Human-readable error message
          example: "The provided project path does not exist"
        details:
          type: object
          description: Additional error details
          additionalProperties: true
        request_id:
          type: string
          description: Unique request identifier for debugging

tags:
  - name: Analysis
    description: Core code analysis operations
  - name: Monitoring
    description: System performance and health monitoring
  - name: Configuration
    description: System configuration management
  - name: Reports
    description: Analysis report generation and retrieval
  - name: WebSocket
    description: Real-time WebSocket connections