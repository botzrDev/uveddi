<!DOCTYPE html>
<html>
<head>
    <title>Mermaid Test</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
</head>
<body>
    <h1>Mermaid Test Page</h1>
    
    <div id="test1">
        <h2>Test 1: Simple Graph</h2>
        <div id="mermaid1">Loading...</div>
    </div>
    
    <div id="test2">
        <h2>Test 2: Class Diagram</h2>
        <div id="mermaid2">Loading...</div>
    </div>
    
    <script>
        mermaid.initialize({ 
            startOnLoad: false,
            theme: 'default',
            securityLevel: 'loose'
        });
        
        async function renderTest1() {
            try {
                const diagram1 = `graph TD
    A[Start] --> B[Process]
    B --> C[End]`;
                
                const { svg } = await mermaid.render('test1', diagram1);
                document.getElementById('mermaid1').innerHTML = svg;
                console.log('Test 1 success');
            } catch (error) {
                console.error('Test 1 error:', error);
                document.getElementById('mermaid1').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        async function renderTest2() {
            try {
                const diagram2 = `classDiagram
    class GodObject {
        +field1: String
        +field2: String
        +massiveMethod()
        +anotherMethod()
    }
    
    GodObject --> DataLayer : manages
    
    class DataLayer {
        +save()
        +load()
    }`;
                
                const { svg } = await mermaid.render('test2', diagram2);
                document.getElementById('mermaid2').innerHTML = svg;
                console.log('Test 2 success');
            } catch (error) {
                console.error('Test 2 error:', error);
                document.getElementById('mermaid2').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        // Run tests
        setTimeout(() => {
            renderTest1();
            renderTest2();
        }, 100);
    </script>
</body>
</html>
