apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uveddi.fullname" . }}-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "uveddi.labels" . | nindent 4 }}
    {{- include "uveddi.environmentLabels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  # Environment configuration
  ENVIRONMENT: {{ .Values.environment | quote }}
  
  # Application configuration
  RUST_LOG: {{ .Values.app.config.rustLog | quote }}
  RUST_BACKTRACE: {{ .Values.app.config.rustBacktrace | quote }}
  CACHE_DIR: {{ .Values.app.config.cacheDir | quote }}
  LOG_DIR: {{ .Values.app.config.logDir | quote }}
  
  # Service configuration
  API_PORT: {{ .Values.app.ports.http | quote }}
  METRICS_PORT: {{ .Values.app.ports.metrics | quote }}
  RENDERING_PORT: {{ .Values.app.ports.rendering | quote }}
  
  # Performance configuration
  MAX_CONNECTIONS: {{ .Values.app.config.maxConnections | quote }}
  WORKER_THREADS: {{ .Values.app.config.workerThreads | quote }}
  REQUEST_TIMEOUT: {{ .Values.app.config.requestTimeout | quote }}
  
  # Security configuration
  ENABLE_CORS: {{ .Values.app.config.security.enableCors | quote }}
  SECURE_HEADERS: {{ .Values.app.config.security.secureHeaders | quote }}
  ENABLE_SANDBOX: {{ .Values.app.config.security.enableSandbox | quote }}
  MAX_FILE_SIZE_MB: {{ .Values.app.config.security.maxFileSizeMb | quote }}
  
  # Analysis configuration
  MAX_DEPTH: {{ .Values.app.config.analysis.maxDepth | quote }}
  TIMEOUT_SECONDS: {{ .Values.app.config.analysis.timeoutSeconds | quote }}
  SUPPORTED_LANGUAGES: {{ join "," .Values.app.config.analysis.languages | quote }}
  
  # Feature flags
  {{- range $key, $value := .Values.app.features }}
  FEATURE_{{ upper $key }}: {{ $value | quote }}
  {{- end }}
  
  # Monitoring configuration
  PROMETHEUS_ENDPOINT: "0.0.0.0:{{ .Values.app.ports.metrics }}"
  HEALTH_CHECK_PATH: "/health"
  READY_CHECK_PATH: "/ready"
  
  # Production configuration file
  production.toml: |
    [analysis]
    languages = {{ .Values.app.config.analysis.languages | toJson }}
    max_depth = {{ .Values.app.config.analysis.maxDepth }}
    timeout_seconds = {{ .Values.app.config.analysis.timeoutSeconds }}
    
    [thresholds]
    god_object_threshold = 100
    max_function_lines = 50
    cyclomatic_complexity_threshold = 10
    
    [performance]
    max_memory_mb = {{ .Values.app.config.performance.maxMemoryMb }}
    worker_threads = {{ .Values.app.config.workerThreads }}
    cache_size_mb = {{ .Values.app.config.performance.cacheSizeMb }}
    
    [security]
    enable_sandbox = {{ .Values.app.config.security.enableSandbox }}
    max_file_size_mb = {{ .Values.app.config.security.maxFileSizeMb }}
    allowed_extensions = {{ .Values.app.config.security.allowedExtensions | toJson }}
    
    [monitoring]
    enable_metrics = {{ .Values.monitoring.prometheus.enabled }}
    metrics_port = {{ .Values.app.ports.metrics }}
    log_level = {{ .Values.app.config.rustLog | quote }}
    
    [database]
    connection_pool_size = 10
    query_timeout_seconds = 30
    
    [api]
    cors_enabled = {{ .Values.app.config.security.enableCors }}
    rate_limit_per_minute = 100
    max_request_size_mb = 10