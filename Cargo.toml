# All dependencies are now pinned to specific versions for reproducible builds.

[package]
name = "uveddi"
version = "0.1.0"
edition = "2021"
resolver = "2"
description = "A Rust-based code analysis and exploration tool"
authors = ["Phillip Austin Green <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/botzrDev/uveddi"
keywords = ["code", "analysis", "tools", "visualization", "uveddi"]
categories = ["development-tools"]
readme = "README.md"

# Feature flags for modular compilation
[features]
default = ["local-ai", "image-rendering", "tree-sitter", "memory-optimization"]
# Tree-sitter parsing functionality (enabled by default)
tree-sitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust", 
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript"
]
# Core analysis features (without tree-sitter by default)
analysis = [] # No specific dependencies needed here, just a logical grouping
# AI feature for all AI-related functionality
ai = ["reqwest", "async-trait"]
# Local AI only (Ollama)
local-ai = ["ai"]
# Image rendering service integration
image-rendering = ["reqwest", "base64"]
# WASM plugin system
wasm-plugins = ["wasmtime", "wasmtime-wasi", "wit-bindgen"]
# Terminal User Interface
tui = ["ratatui", "crossterm", "tui-input"]
# Memory optimization features (UV-210, UV-26)
memory-optimization = ["mimalloc", "bumpalo", "bumpalo-herd", "memmap2", "rkyv"]

[dependencies]
rusqlite = { version = "0.31.0", features = ["bundled"] }
tokio = { version = "1.37.0", features = ["full", "time", "macros"] }  # Always needed
tokio-stream = { version = "0.1.15", features = ["fs"] }
futures = "0.3"
async-stream = "0.3"
chrono = { version = "=0.4.39", features = ["serde"] }
serde = { version = "1.0.203", features = ["derive", "rc"] }
serde_json = { version = "1.0.117" }  # Always needed
bincode = "1.3.3"
thiserror = "1.0.61"
anyhow = "1.0.86"
clap = { version = "4.5.4", features = ["derive", "env"] }
log = "0.4.21"
env_logger = "0.11.3"
regex = "1.10"
rayon = "1.8.0"
# AST parsing dependencies (optional via features)
tree-sitter = { version = "0.22.6", optional = true }
tree-sitter-rust = { version = "0.21.0", optional = true }
tree-sitter-python = { version = "0.21.0", optional = true }
tree-sitter-javascript = { version = "0.21.0", optional = true }
tree-sitter-typescript = { version = "0.21.0", optional = true }
# HTTP client for local AI (Ollama) and image rendering service
reqwest = { version = "0.12.22", features = ["json"], optional = true }  # Make optional
rustls = "0.23.28"  # Force newer rustls to get updated ring
# Resilience and retry dependencies
tracing = "0.1"
rand = "0.8"
# LRU cache for bounded memory management (UV-152)
lru = "0.12.0"
# Template engine for diagram generation
tera = "1.19.1"
# Base64 encoding/decoding for image handling
base64 = { version = "0.22.0", optional = true }
# UUID generation for component IDs
uuid = { version = "1.8.0", features = ["v4", "v5", "serde"] }
url = "2.5"
walkdir = "2.5.0"
ignore = "0.4.22"
toml = "0.8.0"
sha2 = "0.10.0"
async-trait = { version = "0.1.88", optional = true }  # Make optional
petgraph = "0.8.2"
color-eyre = "0.6"
ndarray = "0.16.1"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
# WASM plugin system dependencies (optional via features)
wasmtime = { version = "25.0.0", features = ["component-model"], optional = true }
wasmtime-wasi = { version = "25.0.0", optional = true }
arrow = { version = "52.0.0", optional = true }
arrow-ipc = { version = "52.0.0", optional = true }
arrow-schema = { version = "52.0.0", optional = true }
arrow-array = { version = "52.0.0", optional = true }
wit-bindgen = { version = "0.30.0", optional = true }
axum = { version = "0.7", features = ["ws", "macros"] }
tokio-tungstenite = "0.20"
questdb = "0.1"
criterion = { version = "0.5", features = ["html_reports"] }
sysinfo = "0.30"
# Memory optimization dependencies (UV-210)
# High-performance allocator for memory optimization
mimalloc = { version = "0.1", optional = true }
# Arena allocation for temporary objects
bumpalo = { version = "3.19", features = ["collections", "boxed"], optional = true }
bumpalo-herd = { version = "0.1", optional = true }
# Memory mapping for large data structures
memmap2 = { version = "0.9", optional = true }
# Zero-copy serialization for AST cache optimization
rkyv = { version = "0.7", optional = true }
# CPU count for pool sharding
num_cpus = "1.16"
# Lazy static for global instances
lazy_static = "1.4"

# TUI Core Dependencies (optional via tui feature)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.29", optional = true }
tui-input = { version = "0.14", optional = true }

# Configuration Management (for TUI settings)
confy = "1.0"

# State Persistence (for TUI state)
persisted = "1.0"

# Security patches to force newer versions

[[bin]]
name = "tui_test"
path = "src/bin/tui_test.rs"
required-features = ["tui"]

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
mockall = "0.11"
mockito = "0.31"
assert_cmd = "2.0"
predicates = "2.1"
serde_json = "1.0"

[[test]]
name = "analysis_engine"
path = "tests/analysis/engine.rs"

[[test]]
name = "application"
path = "tests/application.rs"

[[test]]
name = "config"
path = "tests/config.rs"

[[test]]
name = "cli_analyze"
path = "tests/cli_analyze.rs"

[[test]]
name = "database_crud"
path = "tests/database_crud.rs"
