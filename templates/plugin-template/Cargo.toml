[package]
name = "{{plugin_name}}"
version = "{{version}}"
edition = "2021"
description = "{{description}}"
authors = ["{{author}}"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# WIT bindings for Component Model
wit-bindgen = "0.16"

# Note: wit-bindgen generates all necessary types from the WIT file.
# No additional WASM-specific dependencies are needed.

[profile.release]
opt-level = "z"     # Optimize for size
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Build for the wasm32-wasi target
# Run: cargo build --release --target wasm32-wasi
