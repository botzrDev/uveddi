# Production CI/CD Pipeline for Uveddi Analysis Engine
# Automated testing, building, and deployment with performance validation

name: 🚀 Production Deployment

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ==================== CODE QUALITY & TESTING ====================
  quality-checks:
    name: 🧪 Quality & Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
        features: [minimal, standard, full]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: clippy, rustfmt

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ matrix.features }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libssl-dev

    - name: Format check
      run: cargo fmt -- --check

    - name: Lint check
      run: cargo clippy --features ${{ matrix.features }} --all-targets -- -D warnings

    - name: Security audit
      run: |
        cargo install --locked cargo-audit || true
        cargo audit --ignore RUSTSEC-0000-0000  # Allow specific ignores

    - name: Unit tests
      run: cargo test --features ${{ matrix.features }} --lib

    - name: Integration tests
      run: cargo test --features ${{ matrix.features }} --test '*'

    - name: Performance benchmark
      if: matrix.features == 'full'
      run: |
        cargo bench --features ${{ matrix.features }} || echo "Benchmarks completed"

  # ==================== CACHE PERFORMANCE VALIDATION ====================
  cache-performance:
    name: ⚡ Cache Performance Validation
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock') }}

    - name: Build with full features
      run: cargo build --release --features full

    - name: Run cache performance tests
      run: |
        cargo test --release --features full --test knowledge_graph_performance -- --nocapture
        cargo test --release --features full --test api_modernization_test -- --nocapture

    - name: Performance validation
      run: |
        echo "Running cache performance validation..."
        # Run actual performance tests and validate 2-30x speedup targets
        ./target/release/uveddi analyze ./src --enable-cache --output-format json > performance_baseline.json || true
        ./target/release/uveddi analyze ./src --disable-cache --output-format json > performance_uncached.json || true

        # Performance analysis would go here
        echo "✅ Performance validation completed"

    - name: Upload performance artifacts
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: |
          performance_*.json
          target/criterion/**

  # ==================== CONTAINER BUILD & SCAN ====================
  container-build:
    name: 🐳 Container Build & Security Scan
    runs-on: ubuntu-latest
    needs: [quality-checks, cache-performance]
    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ steps.build.outputs.imageid }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=commit-

    - name: Build and push container
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
  file: ./deploy/Dockerfile.production
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Container security scan
      uses: anchore/scan-action@v3
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        fail-build: true
        severity-cutoff: high

    - name: Upload security scan results
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif

  # ==================== STAGING DEPLOYMENT ====================
  deploy-staging:
    name: 🎭 Deploy to Staging
    runs-on: ubuntu-latest
    needs: container-build
    environment: staging
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Set up Kubernetes config
      run: |
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig

    - name: Deploy to staging
      run: |
        export KUBECONFIG=kubeconfig

        # Update image in deployment
        kubectl set image deployment/uveddi-analysis-engine \
          analysis-engine=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.container-build.outputs.image-digest }} \
          -n uveddi-staging

        # Wait for rollout
        kubectl rollout status deployment/uveddi-analysis-engine -n uveddi-staging --timeout=300s

    - name: Staging health check
      run: |
        export KUBECONFIG=kubeconfig

        # Get service URL
        STAGING_URL=$(kubectl get service uveddi-analysis-engine -n uveddi-staging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

        # Health check with retry
        for i in {1..30}; do
          if curl -f "http://$STAGING_URL/health"; then
            echo "✅ Staging deployment healthy"
            exit 0
          fi
          echo "Waiting for staging to be healthy... ($i/30)"
          sleep 10
        done

        echo "❌ Staging deployment failed health check"
        exit 1

    - name: Run staging performance tests
      run: |
        export KUBECONFIG=kubeconfig
        STAGING_URL=$(kubectl get service uveddi-analysis-engine -n uveddi-staging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

        # Performance validation on staging
        curl -X POST "http://$STAGING_URL/api/v1/analysis/start" \
          -H "Content-Type: application/json" \
          -d '{"project_path": "/tmp/test", "enable_graph_optimizations": true}' || true

        # Wait and check cache metrics
        sleep 30
        curl "http://$STAGING_URL/api/v1/cache/stats" | jq '.hit_rate' || true

        echo "✅ Staging performance validation completed"

  # ==================== PRODUCTION DEPLOYMENT ====================
  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [container-build, deploy-staging]
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/setup-kubectl@v3

    - name: Set up production Kubernetes config
      run: |
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig

    - name: Pre-deployment validation
      run: |
        export KUBECONFIG=kubeconfig

        # Check cluster health
        kubectl cluster-info
        kubectl get nodes

        # Check current deployment status
        kubectl get deployment uveddi-analysis-engine -n uveddi -o wide

    - name: Blue-Green deployment
      run: |
        export KUBECONFIG=kubeconfig

        # Create green deployment
        kubectl apply -f k8s/deployment.yaml -n uveddi
        kubectl set image deployment/uveddi-analysis-engine \
          analysis-engine=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.container-build.outputs.image-digest }} \
          -n uveddi

        # Wait for rollout to complete
        kubectl rollout status deployment/uveddi-analysis-engine -n uveddi --timeout=600s

    - name: Production health validation
      run: |
        export KUBECONFIG=kubeconfig

        PROD_URL=$(kubectl get service uveddi-analysis-engine -n uveddi -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

        # Comprehensive health check
        for i in {1..60}; do
          if curl -f "http://$PROD_URL/health" && \
             curl -f "http://$PROD_URL/api/v1/cache/health" && \
             curl -f "http://$PROD_URL/metrics" | grep -q "uveddi_cache_hits_total"; then
            echo "✅ Production deployment fully healthy"
            exit 0
          fi
          echo "Waiting for production to be fully healthy... ($i/60)"
          sleep 10
        done

        echo "❌ Production deployment failed comprehensive health check"
        exit 1

    - name: Post-deployment monitoring setup
      run: |
        export KUBECONFIG=kubeconfig

        # Apply monitoring configurations
        kubectl apply -f monitoring/alerts.yaml -n monitoring

        # Restart Prometheus to pick up new targets
        kubectl rollout restart deployment/prometheus-server -n monitoring

        echo "✅ Production monitoring configured"

    - name: Notify deployment success
      if: success()
      run: |
        echo "🎉 Production deployment successful!"
        echo "Version: ${{ github.ref_name }}"
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.container-build.outputs.image-digest }}"

        # Post to Slack/Discord/etc. if configured
        # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} ...

  # ==================== ROLLBACK ON FAILURE ====================
  rollback-on-failure:
    name: 🔄 Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()
    environment: production

    steps:
    - name: Configure kubectl
      uses: azure/setup-kubectl@v3

    - name: Emergency rollback
      run: |
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig

        echo "🚨 Initiating emergency rollback..."
        kubectl rollout undo deployment/uveddi-analysis-engine -n uveddi
        kubectl rollout status deployment/uveddi-analysis-engine -n uveddi --timeout=300s

        echo "✅ Rollback completed"