[package]
name = "dependency-tracker-plugin"
version = "1.0.0"
edition = "2021"
authors = ["Uveddi Security Team <security@uveddi.dev>"]
license = "MIT"
description = "Dependency vulnerability tracking plugin for Uveddi - monitors package dependencies for security issues"
repository = "https://github.com/uveddi/plugins/dependency-tracker"
readme = "README.md"
keywords = ["dependencies", "vulnerability", "security", "licensing", "packages"]
categories = ["development-tools", "web-programming"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.30.0"

[package.metadata.component]
package = "uveddi:dependency-tracker"

[package.metadata.component.dependencies]
"wasi:cli" = { path = "wit/deps/cli" }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1