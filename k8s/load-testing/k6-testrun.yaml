# UV-82 High-Concurrency Load Testing with k6-operator
# This manifest defines a distributed k6 test for 1000+ concurrent users
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: uveddi-high-concurrency-test
  namespace: uveddi-testing
  labels:
    app: uveddi
    component: load-testing
    version: v1.0.0
    test-type: high-concurrency
spec:
  # Number of distributed k6 pods (each pod can handle ~100-200 VUs efficiently)
  parallelism: 10
  
  script:
    configMap:
      name: k6-test-script
      file: load-test.js
  
  # CLI arguments passed to k6
  arguments: "--quiet"
  
  # Environment variables for the test
  env:
    - name: API_HOST
      value: "http://uveddi-service.uveddi.svc.cluster.local:8080"
    - name: RENDER_HOST
      value: "http://uveddi-render-service.uveddi.svc.cluster.local:8081"
  
  runner:
    # Ensure k6 pods are scheduled on spot instances
    tolerations:
    - key: "instance-type"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"
    - key: "node-purpose"
      operator: "Equal"
      value: "load-testing"
      effect: "NoSchedule"
    
    # Node affinity to prefer spot instances
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
            - key: "karpenter.sh/capacity-type"
              operator: In
              values: ["spot"]
        - weight: 80
          preference:
            matchExpressions:
            - key: "node.kubernetes.io/instance-type"
              operator: In
              values: ["c5.large", "c5.xlarge", "c5.2xlarge"]
    
    # Resource requests and limits
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    
    # Volume mounts for test data
    volumes:
    - name: test-data-volume
      emptyDir: {}
    
    volumeMounts:
    - name: test-data-volume
      mountPath: /test-data
    
    # InitContainer to download large test files
    initContainers:
    - name: data-downloader
      image: alpine/git:latest
      command:
      - "sh"
      - "-c"
      - |
        # Download test data from repository or S3
        echo "Downloading test data..."
        
        # Create test files JSON
        cat > /test-data/test-files.json << 'EOF'
        {
          "files": [
            {
              "name": "small_rust_file.rs",
              "size": "small",
              "content": "fn main() {\n    println!(\"Hello, world!\");\n}\n\nfn add(a: i32, b: i32) -> i32 {\n    a + b\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_add() {\n        assert_eq!(add(2, 3), 5);\n    }\n}"
            },
            {
              "name": "medium_rust_file.rs",
              "size": "medium",
              "content": "use std::collections::HashMap;\nuse std::fs;\nuse std::path::Path;\n\nstruct CodeAnalyzer {\n    files: Vec<String>,\n    metrics: HashMap<String, u32>,\n}\n\nimpl CodeAnalyzer {\n    fn new() -> Self {\n        Self {\n            files: Vec::new(),\n            metrics: HashMap::new(),\n        }\n    }\n\n    fn analyze_file(&mut self, path: &Path) -> Result<(), Box<dyn std::error::Error>> {\n        let content = fs::read_to_string(path)?;\n        self.files.push(path.to_string_lossy().to_string());\n        \n        // Count lines\n        let line_count = content.lines().count() as u32;\n        self.metrics.insert(\"lines\".to_string(), line_count);\n        \n        // Count functions\n        let fn_count = content.matches(\"fn \").count() as u32;\n        self.metrics.insert(\"functions\".to_string(), fn_count);\n        \n        Ok(())\n    }\n\n    fn generate_report(&self) -> String {\n        format!(\"Analyzed {} files with {} metrics\", self.files.len(), self.metrics.len())\n    }\n}\n\nfn main() {\n    let mut analyzer = CodeAnalyzer::new();\n    println!(\"Starting analysis...\");\n    println!(\"{}\", analyzer.generate_report());\n}"
            },
            {
              "name": "large_rust_file.rs",
              "size": "large",
              "content": "// Large Rust file for stress testing\nuse std::collections::{HashMap, HashSet, BTreeMap};\nuse std::sync::{Arc, Mutex, RwLock};\nuse std::thread;\nuse std::time::{Duration, Instant};\nuse tokio::time::sleep;\n\n#[derive(Debug, Clone)]\nstruct Component {\n    id: String,\n    name: String,\n    dependencies: Vec<String>,\n    metrics: ComponentMetrics,\n}\n\n#[derive(Debug, Clone)]\nstruct ComponentMetrics {\n    lines_of_code: usize,\n    cyclomatic_complexity: u32,\n    coupling_factor: f64,\n    maintainability_index: f64,\n}\n\nstruct AnalysisEngine {\n    components: Arc<RwLock<HashMap<String, Component>>>,\n    dependency_graph: Arc<Mutex<BTreeMap<String, HashSet<String>>>>,\n    metrics_cache: Arc<Mutex<HashMap<String, ComponentMetrics>>>,\n}\n\nimpl AnalysisEngine {\n    fn new() -> Self {\n        Self {\n            components: Arc::new(RwLock::new(HashMap::new())),\n            dependency_graph: Arc::new(Mutex::new(BTreeMap::new())),\n            metrics_cache: Arc::new(Mutex::new(HashMap::new())),\n        }\n    }\n\n    async fn analyze_component(&self, component: Component) -> Result<(), AnalysisError> {\n        let start = Instant::now();\n        \n        // Simulate complex analysis\n        for i in 0..1000 {\n            if i % 100 == 0 {\n                sleep(Duration::from_millis(1)).await;\n            }\n        }\n        \n        let mut components = self.components.write().unwrap();\n        components.insert(component.id.clone(), component.clone());\n        \n        let mut graph = self.dependency_graph.lock().unwrap();\n        graph.insert(component.id.clone(), component.dependencies.into_iter().collect());\n        \n        println!(\"Analysis completed in {:?}\", start.elapsed());\n        Ok(())\n    }\n\n    fn calculate_metrics(&self, code: &str) -> ComponentMetrics {\n        ComponentMetrics {\n            lines_of_code: code.lines().count(),\n            cyclomatic_complexity: self.calculate_complexity(code),\n            coupling_factor: self.calculate_coupling(code),\n            maintainability_index: self.calculate_maintainability(code),\n        }\n    }\n\n    fn calculate_complexity(&self, code: &str) -> u32 {\n        let keywords = [\"if\", \"else\", \"while\", \"for\", \"match\", \"loop\"];\n        keywords.iter()\n            .map(|&keyword| code.matches(keyword).count() as u32)\n            .sum::<u32>() + 1\n    }\n\n    fn calculate_coupling(&self, code: &str) -> f64 {\n        let imports = code.matches(\"use \").count();\n        let structs = code.matches(\"struct \").count();\n        if structs == 0 { 0.0 } else { imports as f64 / structs as f64 }\n    }\n\n    fn calculate_maintainability(&self, code: &str) -> f64 {\n        let complexity = self.calculate_complexity(code) as f64;\n        let lines = code.lines().count() as f64;\n        let comments = code.matches(\"//\").count() as f64;\n        \n        100.0 - (complexity * 2.0) - (lines / 50.0) + (comments * 0.5)\n    }\n}\n\n#[derive(Debug)]\nenum AnalysisError {\n    ParseError(String),\n    IoError(std::io::Error),\n    ConcurrencyError(String),\n}\n\nimpl std::fmt::Display for AnalysisError {\n    fn fmt(&self, f: &mut std::fmt::Formatter) -> std::fmt::Result {\n        match self {\n            AnalysisError::ParseError(msg) => write!(f, \"Parse error: {}\", msg),\n            AnalysisError::IoError(err) => write!(f, \"IO error: {}\", err),\n            AnalysisError::ConcurrencyError(msg) => write!(f, \"Concurrency error: {}\", msg),\n        }\n    }\n}\n\nimpl std::error::Error for AnalysisError {}\n\n#[tokio::main]\nasync fn main() -> Result<(), Box<dyn std::error::Error>> {\n    let engine = AnalysisEngine::new();\n    \n    let sample_component = Component {\n        id: \"test_component\".to_string(),\n        name: \"Test Component\".to_string(),\n        dependencies: vec![\"std::collections\".to_string(), \"tokio\".to_string()],\n        metrics: ComponentMetrics {\n            lines_of_code: 100,\n            cyclomatic_complexity: 5,\n            coupling_factor: 0.3,\n            maintainability_index: 85.0,\n        },\n    };\n    \n    engine.analyze_component(sample_component).await?;\n    println!(\"Analysis engine test completed successfully\");\n    \n    Ok(())\n}"
            }
          ]
        }
        EOF
        
        # Create test users JSON
        cat > /test-data/users.json << 'EOF'
        {
          "users": [
            {"username": "loadtest1", "password": "test123"},
            {"username": "loadtest2", "password": "test123"},
            {"username": "loadtest3", "password": "test123"},
            {"username": "loadtest4", "password": "test123"},
            {"username": "loadtest5", "password": "test123"}
          ]
        }
        EOF
        
        echo "Test data prepared successfully"
        ls -la /test-data/
      
      volumeMounts:
      - name: test-data-volume
        mountPath: /test-data

---
# ConfigMap containing the k6 test script
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-test-script
  namespace: uveddi-testing
  labels:
    app: uveddi
    component: load-testing
data:
  load-test.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import { SharedArray } from 'k6/data';
    import { Rate, Trend } from 'k6/metrics';

    // Custom metrics for UV-82 load testing
    const analysisSuccessRate = new Rate('analysis_success_rate');
    const renderingSuccessRate = new Rate('rendering_success_rate');
    const analysisLatency = new Trend('analysis_latency');
    const renderingLatency = new Trend('rendering_latency');

    // Load test data from files (provided by initContainer)
    const testFiles = new SharedArray('test-files', function () {
      try {
        return JSON.parse(open('/test-data/test-files.json')).files;
      } catch (e) {
        return [
          { name: 'small.rs', size: 'small', content: 'fn main() { println!("Hello, world!"); }' }
        ];
      }
    });

    const users = new SharedArray('users', function () {
      try {
        return JSON.parse(open('/test-data/users.json')).users;
      } catch (e) {
        return [{ username: 'testuser1', password: 'password123' }];
      }
    });

    // Load test configuration for 1000+ concurrent users
    export const options = {
      scenarios: {
        full_analysis_workflow: {
          executor: 'ramping-vus',
          exec: 'analysisJourney',
          stages: [
            { duration: '2m', target: 100 },   // Warm-up
            { duration: '3m', target: 500 },   // Ramp to half capacity
            { duration: '5m', target: 1000 },  // Target load: 1000 concurrent users
            { duration: '10m', target: 1000 }, // Sustained load
            { duration: '2m', target: 1500 },  // Spike test
            { duration: '1m', target: 1000 },  // Back to sustained
            { duration: '3m', target: 0 },     // Ramp down
          ],
        },
        diagram_rendering_workflow: {
          executor: 'ramping-vus',
          exec: 'renderingJourney',
          startTime: '1m',
          stages: [
            { duration: '4m', target: 200 },
            { duration: '10m', target: 200 },
            { duration: '2m', target: 400 },   // Spike
            { duration: '1m', target: 200 },
            { duration: '3m', target: 0 },
          ],
        },
      },
      thresholds: {
        'http_req_duration': ['p(95)<500', 'p(99)<1000'],
        'http_req_duration{scenario:full_analysis_workflow}': ['p(95)<500'],
        'http_req_duration{scenario:diagram_rendering_workflow}': ['p(99)<50'],
        'http_req_failed': ['rate<0.01'],
        'analysis_success_rate': ['rate>0.99'],
        'rendering_success_rate': ['rate>0.995'],
      },
    };

    export function setup() {
      const baseUrl = __ENV.API_HOST || 'http://localhost:8080';
      return { baseUrl: baseUrl };
    }

    export function analysisJourney(data) {
      const testFile = testFiles[Math.floor(Math.random() * testFiles.length)];
      
      const headers = { 'Content-Type': 'application/json' };

      // Analysis request
      const analysisStart = Date.now();
      const analysisPayload = {
        project_name: `project-${__VU}-${__ITER}`,
        content: testFile.content,
        file_name: testFile.name,
        language: 'rust',
      };

      const analysisRes = http.post(
        `${data.baseUrl}/api/analysis`, 
        JSON.stringify(analysisPayload), 
        { headers }
      );
      
      const analysisSuccess = check(analysisRes, {
        'analysis request successful': (r) => r.status === 202 || r.status === 200,
      });
      
      analysisSuccessRate.add(analysisSuccess);
      
      if (analysisSuccess) {
        const analysisLatencyMs = Date.now() - analysisStart;
        analysisLatency.add(analysisLatencyMs);
      }

      sleep(Math.random() * 2 + 1);
    }

    export function renderingJourney(data) {
      const headers = { 'Content-Type': 'application/json' };

      const renderingStart = Date.now();
      const renderingRes = http.post(
        `${data.baseUrl}/api/render/diagram`,
        JSON.stringify({
          mermaid_code: `graph TD
            A[User Request] --> B{Analysis Engine}
            B --> C[Component Extraction]
            B --> D[Dependency Analysis]
            C --> E[Mermaid Generation]
            D --> E
            E --> F[SVG Rendering]
            F --> G[Response]`,
          format: 'svg',
          width: 800,
          height: 600,
        }),
        { headers }
      );
      
      const renderingLatencyMs = Date.now() - renderingStart;
      renderingLatency.add(renderingLatencyMs);
      
      const renderingSuccess = check(renderingRes, {
        'rendering successful': (r) => r.status === 200,
        'rendering fast': (r) => renderingLatencyMs < 50,
      });
      
      renderingSuccessRate.add(renderingSuccess);

      sleep(Math.random() * 1 + 0.5);
    }