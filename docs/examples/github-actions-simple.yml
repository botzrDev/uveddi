# Build-Optimized GitHub Actions workflow for Uveddi CI integration
# Save this as .github/workflows/code-quality.yml in your repository

name: Code Quality Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  # Fast feedback for development branches (60-80% faster)
  quick-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-dev-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-dev-

    - name: Fast Development Build (60-80% faster)
      run: |
        # Build with minimal features for fastest feedback
        cargo build --features=minimal --profile=dev-fast

    - name: Quick Quality Check
      run: |
        # Fast analysis for development feedback
        cargo run --features=minimal --profile=dev-fast -- ci check . --max-debt 60 --max-critical 1

    - name: Generate Basic Report
      if: failure()
      run: |
        mkdir -p reports
        cargo run --features=standard --profile=dev-fast -- analyze . --output-format json --output reports/quick-report.json
        
  # Comprehensive check for main branch
  full-check:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-prod-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-prod-

    - name: Production Build
      run: |
        # Full production build with all features
        cargo build --release --features=full

    - name: Comprehensive Quality Gate
      run: |
        # Full analysis with all features
        cargo run --release --features=full -- ci check . --max-debt 50 --max-critical 0

    - name: Generate Full Report
      if: always()
      run: |
        mkdir -p reports
        cargo run --release --features=full -- analyze . --output-format html --output reports/quality-report.html
        cargo run --release --features=full -- analyze . --output-format json --output reports/quality-report.json

    - name: Upload Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: quality-report
        path: reports/
        retention-days: 30

  # Core vs. Full parsing checks (with Language Packs)
  language-specific:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        language: [rust, python, javascript, typescript]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: target/
        key: ${{ runner.os }}-${{ matrix.language }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Language Pack Builds
      run: |
        # Fastest core run (no parsers)
        cargo run --features=minimal --profile=dev-fast -- ci check . --max-debt 60 --max-critical 1 || true
        
        # Enable only relevant language parsers via packs
        case "${{ matrix.language }}" in
          rust|python)
            cargo build --features "minimal,tree-sitter,languages-core"
            ;;
          javascript|typescript)
            cargo build --features "minimal,tree-sitter,languages-web"
            ;;
        esac
