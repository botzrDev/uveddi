automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uveddi-migrations
  namespace: uveddi
  labels:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: migrations
    app.kubernetes.io/part-of: uveddi-platform
automountServiceAccountToken: false