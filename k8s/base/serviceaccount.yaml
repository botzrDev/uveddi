apiVersion: v1
kind: ServiceAccount
metadata:
  name: uveddi-api
  namespace: uveddi
  labels:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: uveddi-platform
  annotations:
    # Security best practices
    serviceaccount.kubernetes.io/enforce-mountable-secrets: "true"
automountServiceAccountToken: false
