apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: uveddi-alerts
  namespace: uveddi
  labels:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: uveddi-platform
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: uveddi.application
    rules:
    - alert: UveddiApplicationDown
      expr: up{job="uveddi"} == 0
      for: 5m
      labels:
        severity: critical
        service: uveddi
        component: application
      annotations:
        summary: "Uveddi application is down"
        description: "Uveddi application has been down for more than 5 minutes in {{ $labels.namespace }}"
        runbook_url: "https://docs.uveddi.dev/runbooks/application-down"
    
    - alert: UveddiHighErrorRate
      expr: |
        (
          rate(http_requests_total{job="uveddi",status=~"5.."}[5m])
          /
          rate(http_requests_total{job="uveddi"}[5m])
        ) * 100 > 5
      for: 10m
      labels:
        severity: warning
        service: uveddi
        component: application
      annotations:
        summary: "High error rate in Uveddi application"
        description: "Error rate is {{ $value }}% for the last 10 minutes in {{ $labels.namespace }}"
        runbook_url: "https://docs.uveddi.dev/runbooks/high-error-rate"
    
    - alert: UveddiHighLatency
      expr: |
        histogram_quantile(0.99,
          rate(http_request_duration_seconds_bucket{job="uveddi"}[5m])
        ) > 2
      for: 10m
      labels:
        severity: warning
        service: uveddi
        component: application
      annotations:
        summary: "High latency in Uveddi application"
        description: "99th percentile latency is {{ $value }}s for the last 10 minutes in {{ $labels.namespace }}"
        runbook_url: "https://docs.uveddi.dev/runbooks/high-latency"
    
    - alert: UveddiMemoryUsageHigh
      expr: |
        (
          container_memory_working_set_bytes{pod=~"uveddi-.*"}
          /
          container_spec_memory_limit_bytes{pod=~"uveddi-.*"}
        ) * 100 > 80
      for: 15m
      labels:
        severity: warning
        service: uveddi
        component: application
      annotations:
        summary: "High memory usage in Uveddi pods"
        description: "Memory usage is {{ $value }}% for pod {{ $labels.pod }} in {{ $labels.namespace }}"
        runbook_url: "https://docs.uveddi.dev/runbooks/high-memory-usage"
    
    - alert: UveddiCPUUsageHigh
      expr: |
        (
          rate(container_cpu_usage_seconds_total{pod=~"uveddi-.*"}[5m])
          /
          container_spec_cpu_quota{pod=~"uveddi-.*"} * container_spec_cpu_period{pod=~"uveddi-.*"}
        ) * 100 > 80
      for: 15m
      labels:
        severity: warning
        service: uveddi
        component: application
      annotations:
        summary: "High CPU usage in Uveddi pods"
        description: "CPU usage is {{ $value }}% for pod {{ $labels.pod }} in {{ $labels.namespace }}"
        runbook_url: "https://docs.uveddi.dev/runbooks/high-cpu-usage"
    
    - alert: UveddiPodCrashLooping
      expr: |
        increase(kube_pod_container_status_restarts_total{pod=~"uveddi-.*"}[15m]) > 0
      for: 5m
      labels:
        severity: critical
        service: uveddi
        component: application
      annotations:
        summary: "Uveddi pod is crash looping"
        description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes in {{ $labels.namespace }}"
        runbook_url: "https://docs.uveddi.dev/runbooks/pod-crash-looping"
    
    - alert: UveddiPodNotReady
      expr: |
        kube_pod_status_ready{condition="false",pod=~"uveddi-.*"} > 0
      for: 10m
      labels:
        severity: warning
        service: uveddi
        component: application
      annotations:
        summary: "Uveddi pod is not ready"
        description: "Pod {{ $labels.pod }} has been not ready for more than 10 minutes in {{ $labels.namespace }}"
        runbook_url: "https://docs.uveddi.dev/runbooks/pod-not-ready"

  - name: uveddi.database
    rules:
    - alert: UveddiDatabaseConnectionFailed
      expr: |
        database_connections_failed_total{job="uveddi"} > 0
      for: 5m
      labels:
        severity: warning
        service: uveddi
        component: database
      annotations:
        summary: "Database connection failures detected"
        description: "{{ $value }} database connection failures in the last 5 minutes in {{ $labels.namespace }}"
        runbook_url: "https://docs.uveddi.dev/runbooks/database-connection-failed"
    
    - alert: UveddiDatabaseSlowQueries
      expr: |
        histogram_quantile(0.95,
          rate(database_query_duration_seconds_bucket{job="uveddi"}[5m])
        ) > 1
      for: 10m
      labels:
        severity: warning
        service: uveddi
        component: database
      annotations:
        summary: "Slow database queries detected"
        description: "95th percentile query time is {{ $value }}s for the last 10 minutes in {{ $labels.namespace }}"
        runbook_url: "https://docs.uveddi.dev/runbooks/slow-database-queries"

  - name: uveddi.analysis
    rules:
    - alert: UveddiAnalysisJobsFailing
      expr: |
        rate(analysis_jobs_failed_total{job="uveddi"}[10m]) > 0
      for: 5m
      labels:
        severity: warning
        service: uveddi
        component: analysis
      annotations:
        summary: "Analysis jobs are failing"
        description: "{{ $value }} analysis jobs have failed per second in the last 5 minutes in {{ $labels.namespace }}"
        runbook_url: "https://docs.uveddi.dev/runbooks/analysis-jobs-failing"
    
    - alert: UveddiAnalysisQueueBacklog
      expr: |
        analysis_queue_size{job="uveddi"} > 100
      for: 10m
      labels:
        severity: warning
        service: uveddi
        component: analysis
      annotations:
        summary: "Large analysis queue backlog"
        description: "Analysis queue has {{ $value }} pending jobs in {{ $labels.namespace }}"
        runbook_url: "https://docs.uveddi.dev/runbooks/analysis-queue-backlog"

  - name: uveddi.infrastructure
    rules:
    - alert: UveddiDeploymentReplicasMismatch
      expr: |
        kube_deployment_status_replicas{deployment="uveddi"} !=
        kube_deployment_status_replicas_available{deployment="uveddi"}
      for: 15m
      labels:
        severity: warning
        service: uveddi
        component: infrastructure
      annotations:
        summary: "Deployment replicas mismatch"
        description: "Deployment {{ $labels.deployment }} has {{ $labels.replicas }} desired but only {{ $labels.replicas_available }} available in {{ $labels.namespace }}"
        runbook_url: "https://docs.uveddi.dev/runbooks/deployment-replicas-mismatch"
    
    - alert: UveddiPersistentVolumeUsageHigh
      expr: |
        (
          kubelet_volume_stats_used_bytes{persistentvolumeclaim=~"uveddi-data.*"}
          /
          kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"uveddi-data.*"}
        ) * 100 > 85
      for: 10m
      labels:
        severity: warning
        service: uveddi
        component: infrastructure
      annotations:
        summary: "High persistent volume usage"
        description: "PVC {{ $labels.persistentvolumeclaim }} usage is {{ $value }}% in {{ $labels.namespace }}"
        runbook_url: "https://docs.uveddi.dev/runbooks/high-volume-usage"