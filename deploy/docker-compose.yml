# Docker Compose configuration for Uveddi with Security Hardening
version: '3.8'

services:
  # Main Rust application with security constraints
  uveddi:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      - RUST_LOG=info
      - DATABASE_URL=sqlite:///app/data/uveddi.db
      - RENDERING_SERVICE_URL=http://rendering-service:3001
      - RENDERING_SERVICE_TIMEOUT=30
      - MEMORY_LIMIT=2048m
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./cache:/app/cache:rw
    ports:
      - "8080:8080"
    # Security constraints
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=50m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    user: "1001:1001"
    depends_on:
      rendering-service:
        condition: service_healthy
    networks:
      - uveddi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/docker-entrypoint.sh", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Image rendering service with security constraints
  rendering-service:
    build:
      context: .
      dockerfile: rendering-service/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MAX_WORKERS=3
    ports:
      - "3001:3001"
    # Security constraints
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=200m
      - /var/tmp:noexec,nosuid,size=100m
      - /app/cache:rw,noexec,nosuid,size=500m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    user: "1001:1001"
    networks:
      - uveddi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: PostgreSQL for team collaboration (security hardened)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=uveddi
      - POSTGRES_USER=uveddi
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-uveddi_password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    # Security constraints
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=100m
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    networks:
      - uveddi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uveddi -d uveddi"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Redis for caching (security hardened)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --protected-mode yes --bind 0.0.0.0
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    # Security constraints
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    user: "999:999"
    networks:
      - uveddi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  uveddi-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    labels:
      - "com.uveddi.network.security=hardened"
      - "com.uveddi.network.description=Isolated network for Uveddi services"
