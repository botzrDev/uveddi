apiVersion: v1
kind: Namespace
metadata:
  name: uveddi-production
  labels:
    name: uveddi-production
    environment: production
    managed-by: uveddi-deployment-pipeline
  annotations:
    deployment.kubernetes.io/revision: "1"
    uveddi.com/deployment-strategy: "blue-green"

---
apiVersion: v1
kind: Namespace
metadata:
  name: uveddi-monitoring
  labels:
    name: uveddi-monitoring
    environment: production
    purpose: monitoring
    managed-by: uveddi-deployment-pipeline

---
apiVersion: v1
kind: Namespace
metadata:
  name: uveddi-staging
  labels:
    name: uveddi-staging
    environment: staging
    managed-by: uveddi-deployment-pipeline