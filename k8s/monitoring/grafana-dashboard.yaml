apiVersion: v1
kind: ConfigMap
metadata:
  name: uveddi-grafana-dashboard
  namespace: monitoring
  labels:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: uveddi-platform
    grafana_dashboard: "1"
data:
  uveddi-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Uveddi Application Dashboard",
        "description": "Comprehensive monitoring dashboard for Uveddi architectural analysis tool",
        "tags": ["uveddi", "rust", "application", "monitoring"],
        "style": "dark",
        "timezone": "browser",
        "refresh": "30s",
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "Application Status",
            "type": "stat",
            "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "up{job=\"uveddi\"}",
                "legendFormat": "{{instance}}",
                "refId": "A"
              }
            ],
            "options": {
              "reduceOptions": {
                "values": false,
                "calcs": ["lastNotNull"],
                "fields": ""
              },
              "orientation": "auto",
              "textMode": "auto",
              "colorMode": "value"
            },
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "mappings": [
                  {"type": "value", "value": "0", "text": "DOWN"},
                  {"type": "value", "value": "1", "text": "UP"}
                ],
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": null},
                    {"color": "green", "value": 1}
                  ]
                }
              }
            }
          },
          {
            "id": 2,
            "title": "Request Rate",
            "type": "graph",
            "gridPos": {"h": 8, "w": 9, "x": 6, "y": 0},
            "targets": [
              {
                "expr": "rate(http_requests_total{job=\"uveddi\"}[5m])",
                "legendFormat": "{{method}} {{status}}",
                "refId": "A"
              }
            ],
            "yAxes": [
              {
                "label": "Requests/sec",
                "min": 0
              }
            ],
            "legend": {
              "show": true,
              "table": true,
              "values": true,
              "current": true,
              "max": true,
              "min": true
            }
          },
          {
            "id": 3,
            "title": "Response Time",
            "type": "graph",
            "gridPos": {"h": 8, "w": 9, "x": 15, "y": 0},
            "targets": [
              {
                "expr": "histogram_quantile(0.50, rate(http_request_duration_seconds_bucket{job=\"uveddi\"}[5m]))",
                "legendFormat": "50th percentile",
                "refId": "A"
              },
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=\"uveddi\"}[5m]))",
                "legendFormat": "95th percentile",
                "refId": "B"
              },
              {
                "expr": "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{job=\"uveddi\"}[5m]))",
                "legendFormat": "99th percentile",
                "refId": "C"
              }
            ],
            "yAxes": [
              {
                "label": "Seconds",
                "min": 0
              }
            ]
          },
          {
            "id": 4,
            "title": "Error Rate",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
            "targets": [
              {
                "expr": "rate(http_requests_total{job=\"uveddi\",status=~\"5..\"}[5m])",
                "legendFormat": "5xx errors",
                "refId": "A"
              },
              {
                "expr": "rate(http_requests_total{job=\"uveddi\",status=~\"4..\"}[5m])",
                "legendFormat": "4xx errors",
                "refId": "B"
              }
            ],
            "yAxes": [
              {
                "label": "Errors/sec",
                "min": 0
              }
            ]
          },
          {
            "id": 5,
            "title": "Memory Usage",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
            "targets": [
              {
                "expr": "container_memory_working_set_bytes{pod=~\"uveddi-.*\"} / 1024 / 1024",
                "legendFormat": "{{pod}}",
                "refId": "A"
              }
            ],
            "yAxes": [
              {
                "label": "Memory (MB)",
                "min": 0
              }
            ]
          },
          {
            "id": 6,
            "title": "CPU Usage",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{pod=~\"uveddi-.*\"}[5m]) * 100",
                "legendFormat": "{{pod}}",
                "refId": "A"
              }
            ],
            "yAxes": [
              {
                "label": "CPU (%)",
                "min": 0,
                "max": 100
              }
            ]
          },
          {
            "id": 7,
            "title": "Analysis Jobs",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
            "targets": [
              {
                "expr": "rate(analysis_jobs_completed_total{job=\"uveddi\"}[5m])",
                "legendFormat": "Completed",
                "refId": "A"
              },
              {
                "expr": "rate(analysis_jobs_failed_total{job=\"uveddi\"}[5m])",
                "legendFormat": "Failed",
                "refId": "B"
              },
              {
                "expr": "analysis_queue_size{job=\"uveddi\"}",
                "legendFormat": "Queue Size",
                "refId": "C"
              }
            ],
            "yAxes": [
              {
                "label": "Jobs/sec & Queue Size",
                "min": 0
              }
            ]
          },
          {
            "id": 8,
            "title": "Database Performance",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
            "targets": [
              {
                "expr": "rate(database_queries_total{job=\"uveddi\"}[5m])",
                "legendFormat": "Queries/sec",
                "refId": "A"
              },
              {
                "expr": "histogram_quantile(0.95, rate(database_query_duration_seconds_bucket{job=\"uveddi\"}[5m]))",
                "legendFormat": "95th percentile latency",
                "refId": "B"
              }
            ],
            "yAxes": [
              {
                "label": "Queries/sec & Seconds",
                "min": 0
              }
            ]
          },
          {
            "id": 9,
            "title": "Pod Status",
            "type": "table",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
            "targets": [
              {
                "expr": "kube_pod_info{pod=~\"uveddi-.*\"}",
                "format": "table",
                "refId": "A"
              }
            ],
            "transformations": [
              {
                "id": "organize",
                "options": {
                  "excludeByName": {
                    "__name__": true,
                    "job": true,
                    "instance": true
                  }
                }
              }
            ]
          }
        ],
        "templating": {
          "list": [
            {
              "name": "namespace",
              "type": "query",
              "query": "label_values(up{job=\"uveddi\"}, namespace)",
              "current": {
                "value": "uveddi",
                "text": "uveddi"
              }
            }
          ]
        },
        "annotations": {
          "list": [
            {
              "name": "Deployments",
              "datasource": "prometheus",
              "expr": "changes(kube_deployment_status_observed_generation{deployment=\"uveddi\"}[5m]) > 0"
            }
          ]
        }
      }
    }