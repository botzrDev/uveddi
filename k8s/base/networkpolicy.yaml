apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uveddi-network-policy
  namespace: uveddi
  labels:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: uveddi-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: uveddi
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  
  # Allow traffic from monitoring (Prometheus)
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  
  # Allow internal service communication
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: uveddi
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 3001
    - protocol: TCP
      port: 9090
  
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  
  # Allow HTTPS for external services (Ollama, package registries)
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 11434  # Ollama default port
  
  # Allow internal service communication
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: uveddi
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 3001
  
  # Allow database connections (if using external database)
  - to: []
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 6379  # Redis

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-default
  namespace: uveddi
  labels:
    app.kubernetes.io/name: uveddi
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: uveddi-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  # This creates a default deny-all policy
  # Specific allow rules are defined in other NetworkPolicy resources