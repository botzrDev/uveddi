ectors and\n//! infrastructure for dependency analysis.\n\npub mod anti_patterns;\npub mod cycle;\npub mod dependency;\n\npub use cycle::CycleDetector;\npub use dependency::{Dependency, DependencyExtractor};\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","analysis","engine.rs"],"content":"use crate::analysis::detectors::anti_patterns::code_duplication::CodeDuplicationDetector;\nuse crate::analysis::detectors::anti_patterns::god_object::GodObjectDetector;\nuse crate::analysis::detectors::cycle::CycleDetector;\nuse crate::analysis::detectors::dependency::{Dependency, DependencyExtractor};\nuse crate::analysis::graph::dependency::LocalDependencyGraph;\nuse crate::analysis::graph::dependency::{ComponentNode, LocalDependencyType};\nuse crate::analysis::AnalysisDetector;\nuse crate::ast::tree_sitter::AstParser;\nuse crate::cache::result_cache::ResultCache;\nuse crate::database::models::{AntiPatternType, ArchitecturalIssue};\nuse crate::ingestion::AsyncWalker;\nuse log::{info, warn};\nuse rayon::prelude::*;\nuse std::path::{Path, PathBuf};\nuse tokio_stream::StreamExt;\n\n#[derive(serde::Serialize, serde::Deserialize, Debug)]\nstruct CachedAnalysisResult {\n    issues: Vec\u003cArchitecturalIssue\u003e,\n    dependencies: Vec\u003cDependency\u003e,\n}\n\n/// Core analysis engine that orchestrates the detection of anti-patterns and architectural issues\n///\n/// The `AnalysisEngine` is the main entry point for running code analysis. It manages\n/// a collection of detectors, coordinates file parsing, builds dependency graphs,\n/// and aggregates results from all analysis phases.\n///\n/// ## Key Features:\n///\n/// - **Multi-detector Support**: Runs multiple detectors in parallel\n/// - **Caching**: Caches parsing and analysis results for performance\n/// - **Dependency Analysis**: Builds and analyzes dependency graphs\n/// - **Async Processing**: Processes files asynchronously for better performance\n/// - **Error Recovery**: Continues analysis even if individual files fail\n///\n/// ## Architecture:\n///\n/// 1. **File Discovery**: Uses `AsyncWalker` to find source files\n/// 2. **Parsing**: Leverages `AstParser` to create syntax trees\n/// 3. **Detection**: Runs all registered detectors on each file\n/// 4. **Graph Analysis**: Builds dependency graph and runs graph-based detectors\n/// 5. **Result Aggregation**: Combines all detected issues into final report\n///\n/// ## Usage\n///\n/// ```no_run\n/// use uveddi::analysis::AnalysisEngine;\n/// use std::path::Path;\n/// #[tokio::main]\n/// async fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n///     let mut engine = AnalysisEngine::new()?;\n///     let (issues, graph) = engine.analyze(Path::new(\"src/\")).await?;\n///     println!(\"Found {} issues\", issues.len());\n///     Ok(())\n/// }\n/// ```\npub struct AnalysisEngine {\n    ast_parser: AstParser,\n    dependency_extractor: DependencyExtractor,\n    detectors: Vec\u003cBox\u003cdyn AnalysisDetector + Send + Sync\u003e\u003e,\n    cycle_detector: CycleDetector,\n    files_analyzed: i32,\n    cache: ResultCache,\n}\n\nimpl AnalysisEngine {\n    /// Creates a new analysis engine with default configuration\n    ///\n    /// Initializes the engine with:\n    /// - AST parser for syntax tree generation\n    /// - Dependency extractor for import/include analysis\n    /// - Default set of anti-pattern detectors\n    /// - Result cache for performance optimization\n    ///\n    /// # Errors\n    ///\n    /// Returns `UveddiError` if:\n    /// - Cache database cannot be created\n    /// - AST parser initialization fails\n    /// - Dependency extractor setup fails\n    pub fn new() -\u003e Result\u003cSelf, crate::error::UveddiError\u003e {\n        let cache_path = PathBuf::from(\"uveddi_cache.db\");\n        Self::with_cache_path(\u0026cache_path)\n    }\n\n    /// Creates a new analysis engine with a custom cache database path\n    ///\n    /// This is primarily useful for testing to avoid database conflicts.\n    ///\n    /// # Arguments\n    ///\n    /// * `cache_path` - Path to the cache database file\n    ///\n    /// # Errors\n    ///\n    /// Returns `UveddiError` if:\n    /// - Cache database cannot be created\n    /// - AST parser initialization fails\n    /// - Dependency extractor setup fails\n    pub fn with_cache_path(cache_path: \u0026Path) -\u003e Result\u003cSelf, crate::error::UveddiError\u003e {\n        Ok(Self {\n            ast_parser: AstParser::new()?,\n            dependency_extractor: DependencyExtractor::new()?,\n            detectors: vec![\n                Box::new(GodObjectDetector::new(5, 8)), // More sensitive thresholds\n                Box::new(CodeDuplicationDetector::new()),\n            ],\n            cycle_detector: CycleDetector::new(),\n            files_analyzed: 0,\n            cache: ResultCache::new(cache_path)?,\n        })\n    }\n\n    /// Creates a new analysis engine with an in-memory cache database\n    ///\n    /// This is primarily useful for testing to avoid database conflicts\n    /// and ensure test isolation.\n    ///\n    /// # Errors\n    ///\n    /// Returns `UveddiError` if:\n    /// - Cache database cannot be created\n    /// - AST parser initialization fails\n    /// - Dependency extractor setup fails\n    pub fn new_with_memory_cache() -\u003e Result\u003cSelf, crate::error::UveddiError\u003e {\n        Ok(Self {\n            ast_parser: AstParser::new()?,\n            dependency_extractor: DependencyExtractor::new()?,\n            detectors: vec![\n                Box::new(GodObjectDetector::new(5, 8)), // More sensitive thresholds\n                Box::new(CodeDuplicationDetector::new()),\n            ],\n            cycle_detector: CycleDetector::new(),\n            files_analyzed: 0,\n            cache: ResultCache::new_in_memory()?,\n        })\n    }\n\n    /// Performs comprehensive analysis on a directory or file\n    ///\n    /// This is the main entry point for analysis. It:\n    /// 1. Discovers and parses all source files in the given path\n    /// 2. Runs file-level detectors on each parsed file\n    /// 3. Extracts dependencies and builds a dependency graph\n    /// 4. Runs graph-level detectors (cycle detection, architectural patterns)\n    /// 5. Aggregates and returns all detected issues\n    ///\n    /// # Arguments\n    ///\n    /// * `path` - Directory or file path to analyze\n    ///\n    /// # Returns\n    ///\n    /// A tuple containing:\n    /// - `Vec\u003cArchitecturalIssue\u003e` - All detected issues across all detectors\n    /// - `LocalDependencyGraph` - The constructed dependency graph\n    ///\n    /// # Errors\n    ///\n    /// Returns `UveddiError` if:\n    /// - Path is inaccessible or doesn't exist\n    /// - Critical parsing errors occur\n    /// - Cache operations fail\n    pub async fn analyze(\n        \u0026mut self,\n        path: \u0026Path,\n    ) -\u003e Result\u003c(Vec\u003cArchitecturalIssue\u003e, LocalDependencyGraph), crate::error::UveddiError\u003e {\n        let (mut file_issues, all_dependencies) =\n            self.analyze_files_and_collect_dependencies(path).await?;\n\n        info!(\"Building dependency graph...\");\n        let mut dependency_graph = LocalDependencyGraph::new();\n        for dep in all_dependencies {\n            let from_node = ComponentNode::Module {\n                path: dep.from_file.to_string_lossy().into_owned(),\n            };\n            let to_node = ComponentNode::Module {\n                path: dep.to_module.clone(),\n            };\n            dependency_graph.add_dependency(\u0026from_node, \u0026to_node, LocalDependencyType::Import);\n        }\n        info!(\"Dependency graph built.\");\n\n        info!(\"Detecting cycles...\");\n        // Assuming analysis_run_id is 0 for now. This will be managed by a higher-level process.\n        let cycle_issues = self.cycle_detector.detect_cycles(\u0026dependency_graph, 0);\n        info!(\"Found {} cycles.\", cycle_issues.len());\n        file_issues.extend(cycle_issues);\n\n        // Run graph-based anti-pattern detectors\n        for detector in \u0026self.detectors {\n            let issues = detector.detect(\u0026dependency_graph);\n            file_issues.extend(issues);\n        }\n\n        Ok((file_issues, dependency_graph))\n    }\n\n    async fn analyze_files_and_collect_dependencies(\n        \u0026mut self,\n        path: \u0026Path,\n    ) -\u003e Result\u003c(Vec\u003cArchitecturalIssue\u003e, Vec\u003cDependency\u003e), crate::error::UveddiError\u003e {\n        let mut all_issues = Vec::new();\n        let mut all_dependencies = Vec::new();\n        self.files_analyzed = 0;\n\n        let walker = AsyncWalker::for_source_code();\n        let mut file_stream = walker.walk(path);\n\n        while let Some(file_result) = file_stream.next().await {\n            match file_result {\n                Ok(file_path) =\u003e {\n                    if let Some(cached_result) =\n                        self.cache.get::\u003c_, CachedAnalysisResult\u003e(\u0026file_path)?\n                    {\n                        info!(\n                            \"CACHE HIT: Using cached analysis for {}\",\n                            file_path.display()\n                        );\n                        all_issues.extend(cached_result.issues);\n                        all_dependencies.extend(cached_result.dependencies);\n                        self.files_analyzed += 1;\n                        continue;\n                    }\n\n                    info!(\"CACHE MISS: Analyzing file: {}\", file_path.display());\n\n                    match self.ast_parser.parse_file(\u0026file_path) {\n                        Ok(parsed_file) =\u003e {\n                            self.files_analyzed += 1;\n\n                            let mut file_issues = Vec::new();\n                            let mut file_dependencies = Vec::new();\n\n                            // Run file-level detectors\n                            for detector in \u0026self.detectors {\n                                match detector.detect_issues(\u0026parsed_file) {\n                                    Ok(mut issues) =\u003e file_issues.append(\u0026mut issues),\n                                    Err(e) =\u003e warn!(\n                                        \"Error running detector {} on {}: {}\",\n                                        detector.get_detector_name(),\n                                        file_path.display(),\n                                        e\n                                    ),\n                                }\n                            }\n\n                            // Extract dependencies\n                            match self.dependency_extractor.extract_from_ast(\u0026parsed_file) {\n                                Ok(mut dependencies) =\u003e file_dependencies.append(\u0026mut dependencies),\n                                Err(e) =\u003e warn!(\n                                    \"Error extracting dependencies from {}: {}\",\n                                    file_path.display(),\n                                    e\n                                ),\n                            }\n\n                            let result_to_cache = CachedAnalysisResult {\n                                issues: file_issues.clone(),\n                                dependencies: file_dependencies.clone(),\n                            };\n\n                            if let Err(e) = self.cache.set(\u0026file_path, \u0026result_to_cache) {\n                                warn!(\n                                    \"Failed to cache analysis for {}: {}\",\n                                    file_path.display(),\n                                    e\n                                );\n                            }\n\n                            all_issues.extend(file_issues);\n                            all_dependencies.extend(file_dependencies);\n                        }\n                        Err(e) =\u003e warn!(\"Failed to parse file {}: {}\", file_path.display(), e),\n                    }\n                }\n                Err(e) =\u003e warn!(\"Error walking directory: {e}\"),\n            }\n        }\n\n        info!(\n            \"Analyzed {} files and extracted dependencies.\",\n            self.files_analyzed\n        );\n        Ok((all_issues, all_dependencies))\n    }\n\n    pub fn get_anti_pattern_types(\u0026self) -\u003e Vec\u003cAntiPatternType\u003e {\n        let mut types = Vec::new();\n        for detector in \u0026self.detectors {\n            types.extend(detector.get_anti_pattern_types());\n        }\n        // Add cycle dependency type\n        types.push(AntiPatternType {\n            anti_pattern_type_id: None, // Will be assigned by DB\n            name: \"Cyclic Dependency\".to_string(),\n            description: \"A direct or indirect dependency cycle between modules or components.\"\n                .to_string(),\n            category: \"Structural\".to_string(),\n        });\n        types\n    }\n\n    pub fn get_files_analyzed(\u0026self) -\u003e i32 {\n        self.files_analyzed\n    }\n}\n","traces":[{"line":82,"address":[3402880,3403026,3403032],"length":1,"stats":{"Line":0}},{"line":83,"address":[3402894],"length":1,"stats":{"Line":0}},{"line":84,"address":[3402994,3402930],"length":1,"stats":{"Line":0}},{"line":101,"address":[3404973,3404967,3403056],"length":1,"stats":{"Line":0}},{"line":102,"address":[3404617],"length":1,"stats":{"Line":0}},{"line":103,"address":[3403099],"length":1,"stats":{"Line":0}},{"line":104,"address":[3403548,3403485],"length":1,"stats":{"Line":0}},{"line":105,"address":[3403922,3404986,3403983,3404022,3404139,3404207],"length":1,"stats":{"Line":0}},{"line":106,"address":[3403991,3404076],"length":1,"stats":{"Line":0}},{"line":107,"address":[3404120,3404183],"length um ComponentNode {\n    Module { path: String },\n    Class { name: String, file_path: String },\n    Function { name: String, file_path: String },\n}\n\n/// Represents the type of dependency between two components.\n#[derive(Debug, Clone, PartialEq, Eq, Hash)]\npub enum LocalDependencyType {\n    /// A direct function or method call.\n    Call,\n    /// An import or `use` statement.\n    Import,\n    /// A class inheritance relationship (`extends`).\n    Inheritance,\n    /// A class implementing an interface (`implements`).\n    Implementation,\n}\n\n/// Represents a dependency relationship (an edge) in the graph.\n#[derive(Debug, Clone, PartialEq, Eq, Hash)]\npub struct DependencyEdge {\n    pub dependency_type: LocalDependencyType,\n    /// Could be used to store metadata like line numbers.\n    pub weight: u32,\n}\n\n/// The main Architectural Dependency Graph (ADG).\n///\n/// This struct encapsulates a `petgraph::DiGraph` to model the relationships\n/// between software components. It provides methods for adding components\n/// and dependencies, and will be the basis for running architectural analyses\n/// like cycle detection.\npub struct LocalDependencyGraph {\n    graph: DiGraph\u003cComponentNode, DependencyEdge\u003e,\n    node_map: HashMap\u003cComponentNode, NodeIndex\u003e,\n}\n\nimpl LocalDependencyGraph {\n    /// Creates a new, empty `LocalDependencyGraph`.\n    pub fn new() -\u003e Self {\n        LocalDependencyGraph {\n            graph: DiGraph::new(),\n            node_map: HashMap::new(),\n        }\n    }\n\n    /// Adds a component to the graph if it doesn't already exist.\n    /// Returns the `NodeIndex` of the component.\n    pub fn add_component(\u0026mut self, node: ComponentNode) -\u003e NodeIndex {\n        if let Some(index) = self.node_map.get(\u0026node) {\n            *index\n        } else {\n            let index = self.graph.add_node(node.clone());\n            self.node_map.insert(node, index);\n            index\n        }\n    }\n\n    /// Adds a dependency between two components.\n    pub fn add_dependency(\n        \u0026mut self,\n        from: \u0026ComponentNode,\n        to: \u0026ComponentNode,\n        dep_type: LocalDependencyType,\n    ) {\n        let from_index = self.add_component(from.clone());\n        let to_index = self.add_component(to.clone());\n\n        let edge = DependencyEdge {\n            dependency_type: dep_type,\n            weight: 1, // Default weight\n        };\n\n        self.graph.add_edge(from_index, to_index, edge);\n    }\n\n    /// Provides read-only access to the underlying petgraph DiGraph.\n    pub fn get_petgraph(\u0026self) -\u003e \u0026DiGraph\u003cComponentNode, DependencyEdge\u003e {\n        \u0026self.graph\n    }\n\n    /// Retrieves a component node by its index.\n    pub fn get_node_from_index(\u0026self, index: NodeIndex) -\u003e Option\u003c\u0026ComponentNode\u003e {\n        self.graph.node_weight(index)\n    }\n}\n\nimpl Default for LocalDependencyGraph {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n","traces":[{"line":49,"address":[3844497,3844491,3844352],"length":1,"stats":{"Line":0}},{"line":51,"address":[3844369],"length":1,"stats":{"Line":0}},{"line":52,"address":[3844383],"length":1,"stats":{"Line":0}},{"line":58,"address":[3844872,3844512,3844901],"length":1,"stats":{"Line":0}},{"line":59,"address":[3844842,3844671,3844619,3844537],"length":1,"stats":{"Line":0}},{"line":60,"address":[3844665],"length":1,"stats":{"Line":0}},{"line":62,"address":[3844714,3844683],"length":1,"stats":{"Line":0}},{"line":63,"address":[3844762],"length":1,"stats":{"Line":0}},{"line":64,"address":[3844838],"length":1,"stats":{"Line":0}},{"line":69,"address":[3844912],"length":1,"stats":{"Line":0}},{"line":75,"address":[3844965],"length":1,"stats":{"Line":0}},{"line":76,"address":[3845006],"length":1,"stats":{"Line":0}},{"line":83,"address":[3845072],"length":1,"stats":{"Line":0}},{"line":87,"address":[3845104],"length":1,"sta //! 2. **Graph-level Analysis**: Detectors can analyze the entire dependency graph\n//! 3. **Language-specific Support**: Detectors can be specialized for specific languages\n//! 4. **Multi-language Support**: Some detectors work across multiple languages\n//!\n//! ### Integration with Analysis Engine\n//!\n//! Detectors integrate with the engine through:\n//!\n//! - **Registration**: Detectors are registered with the engine\n//! - **Execution**: Engine calls `detect_issues()` for each file\n//! - **Result Collection**: Engine aggregates results from all detectors\n//! - **Reporting**: Results are stored in the database for analysis\n//!\n/// ## Usage Example\n///\n/// ```rust\n/// use uveddi::analysis::{AnalysisEngine, AnalysisDetector};\n/// use uveddi::analysis::detectors::anti_patterns::GodObjectDetector;\n/// use std::path::Path;\n///\n/// let engine = AnalysisEngine::new().unwrap();\n/// let detector = GodObjectDetector::new(15, 20);\n/// // Detectors are built into the engine\n/// // let (issues, graph) = engine.analyze(Path::new(\"src/\")).await.unwrap();\n/// // println!(\"Found {} issues\", issues.len());\n/// ```\npub mod cache;\npub mod detectors;\npub mod engine;\npub mod graph;\npub mod types;\n\n#[cfg(test)]\npub mod tests;\n\n// Re-exports for convenience\npub use cache::AstCache;\npub use detectors::anti_patterns::GodObjectDetector;\npub use detectors::{CycleDetector, Dependency, DependencyExtractor};\npub use engine::AnalysisEngine;\npub use graph::{ComponentNode, LocalDependencyGraph, LocalDependencyType};\n\nuse crate::ast::tree_sitter::ParsedFile;\nuse crate::database::models::{AntiPatternType, ArchitecturalIssue};\n\npub type AnalysisError = crate::error::UveddiError;\n\n/// Core analysis trait for all detectors\n///\n/// The `AnalysisDetector` trait defines the interface that all analysis detectors\n/// must implement. This trait enables a pluggable architecture where different\n/// detectors can be easily added, removed, or replaced without affecting the\n/// core analysis engine.\n///\n/// ## Required Methods\n///\n/// - `detect_issues()`: Analyze a single parsed file for issues\n/// - `get_anti_pattern_types()`: Return the types of anti-patterns this detector finds\n/// - `get_detector_name()`: Return a unique identifier for this detector\n///\n/// ## Optional Methods\n///\n/// - `detect_graph_issues()`: Analyze the entire dependency graph (default: no-op)\n/// - `detect()`: Unified detection method for backward compatibility\n///\n/// ## Implementation Guidelines\n///\n/// 1. **Performance**: Detectors should be efficient as they run on every file\n/// 2. **Language Support**: Use `ParsedFile.language` to provide language-specific logic\n/// 3. **Error Handling**: Return `AnalysisError` for serious issues, empty Vec for no findings\n/// 4. **Caching**: Leverage the AST cache for expensive parsing operations\n///\n/// # Example\n/// ```rust\n/// use uveddi::analysis::{AnalysisEngine, AnalysisDetector};\n/// use uveddi::analysis::detectors::anti_patterns::GodObjectDetector;\n/// use std::path::Path;\n///\n/// let engine = AnalysisEngine::new().unwrap();\n/// let detector = GodObjectDetector::new(15, 20);\n/// // Detectors are built into the engine\n/// // let (issues, graph) = engine.analyze(Path::new(\"src/\")).await.unwrap();\n/// // println!(\"Found {} issues\", issues.len());\n/// # fn main() {}\n/// ```\npub trait AnalysisDetector: Send + Sync {\n    fn detect_issues(\u0026self, file: \u0026ParsedFile) -\u003e Result\u003cVec\u003cArchitecturalIssue\u003e, AnalysisError\u003e;\n    fn detect_graph_issues(\n        \u0026self,\n        _graph: \u0026LocalDependencyGraph,\n        _analysis_run_id: i64,\n    ) -\u003e Vec\u003cArchitecturalIssue\u003e {\n        // Default implementation for detectors that don't analyze the graph\n        vec![]\n    }\n    fn detect(\u0026self, graph: \u0026LocalDependencyGraph) -\u003e Vec\u003cArchitecturalIssue\u003e {\n        // Unified detection method for pluggable system\n        self.detect_graph_issues(graph, 0i64)\n    }\n    fn get_anti_pattern_types(\u0026self) -\u003e Vec\u003cAntiPatternType\u003e;\n    fn get_detector_name(\u0026self) -\u003e \u0026'static str;\n}\n","traces":[{"line":113,"address":[3927552],"length":1,"stats":{"Line":0}},{"line":119,"address":[4086555],"length":1,"stats":{"Line":0}},{"line":121,"address":[3276848],"length":1,"stats":{"Line":0}},{"line":123,"address":[3769749],"length":1,"stats":{"Line":0}}],"covered":0,"coverable":4},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","analysis","tests","advanced","leaky_abstraction_detection.rs"],"content":"//! Leaky abstraction detection tests\n//! \n//! This module tests the detection of leaky abstraction patterns including:\n//! - Layer boundary violations\n//! - Implementation detail exposure\n//! - Framework-specific leaks\n\n#[cfg(test)]\nmod tests {\n    use crate::analysis::AnalysisDetector;\n    use crate::ast::tree_sitter::AstParser;\n    use tempfile::tempdir;\n    use std::fs::File;\n    use std::io::Write;\n\n    fn create_temp_file(dir: \u0026tempfile::TempDir, name: \u0026str, content: \u0026str) -\u003e std::path::PathBuf {\n        let file_path = dir.path().join(name);\n        let mut file = File::create(\u0026file_path).unwrap();\n        writeln!(file, \"{}\", content).unwrap();\n        file_path\n    }\n\n    #[test]\n    fn test_layer_boundary_violations_positive() {\n        // TODO: Implement test for layer boundary violations\n        // Example: Business logic accessing database directly, UI logic in data layer\n        todo!(\"Implement layer boundary violations test\");\n    }\n\n    #[test]\n    fn test_implementation_detail_exposure() {\n        // TODO: Implement test for implementation detail exposure\n        // Example: Returning database entities from service layer\n        todo!(\"Implement implementation detail exposure test\");\n    }\n\n    #[test]\n    fn test_framework_sp  layer orchestrator for analysis workflows\n///\n/// This struct coordinates the analysis process by managing dependencies\n/// and orchestrating the workflow between different system components.\n/// It serves as the boundary between the CLI layer and infrastructure layers.\npub struct AnalysisOrchestrator {\n    database: Database,\n    analysis_engine: AnalysisEngine,\n    ai_engine: AiAnalysisEngine,\n    report_generator: ReportGenerator,\n}\n\n/// Configuration for analysis operations\npub struct AnalysisConfig {\n    pub target_path: PathBuf,\n    pub output_format: String,\n    pub output_file: Option\u003cPathBuf\u003e,\n    pub enable_ai: bool,\n    pub ollama_api_url: Option\u003cString\u003e,\n    pub ollama_model: Option\u003cString\u003e,\n}\n\n/// Result of an analysis operation\npub struct AnalysisReport {\n    pub content: String,\n    pub metadata: AnalysisMetadata,\n}\n\n/// Metadata about the analysis operation\npub struct AnalysisMetadata {\n    pub files_analyzed: usize,\n    pub issues_found: usize,\n    pub analysis_duration: std::time::Duration,\n    pub ai_enhanced: bool,\n}\n\nimpl AnalysisOrchestrator {\n    /// Creates a new `AnalysisOrchestrator` with a database at the specified path.\n    pub fn with_db_path(db_path: \u0026std::path::Path) -\u003e Result\u003cSelf, UveddiError\u003e {\n        let database =\n            Database::new(Some(db_path)).context(\"Failed to initialize database with path\")?;\n        let analysis_engine =\n            AnalysisEngine::new().context(\"Failed to initialize analysis engine\")?;\n        let ai_engine = AiAnalysisEngine::new();\n        let report_generator = ReportGenerator::new();\n\n        Ok(Self {\n            database,\n            analysis_engine,\n            ai_engine,\n            report_generator,\n        })\n    }\n\n    /// Creates a new `AnalysisOrchestrator` with an in-memory database.\n    /// Ideal for testing or environments where file system access is restricted.\n    pub fn new() -\u003e Result\u003cSelf, UveddiError\u003e {\n        let database = Database::new(None).context(\"Failed to initialize in-memory database\")?;\n        let analysis_engine =\n            AnalysisEngine::new().context(\"Failed to initialize analysis engine\")?;\n        let ai_engine = AiAnalysisEngine::new();\n        let report_generator = ReportGenerator::new();\n\n        Ok(Self {\n            database,\n            analysis_engine,\n            ai_engine,\n            report_generator,\n        })\n    }\n\n    /// Execute a complete analysis workflow\n    pub async fn execute_analysis(\n        \u0026mut self,\n        config: AnalysisConfig,\n    ) -\u003e Result\u003cAnalysisReport, UveddiError\u003e {\n        let start_time = std::time::Instant::now();\n\n        // Validate input path\n        if !config.target_path.exists() {\n            return Err(UveddiError::PathNotFound(\n                config.target_path.display().to_string(),\n            ))\n            .context(\"Input path validation failed\")?;\n        }\n\n        info!(\"Starting analysis of: {}\", config.target_path.display());\n\n        // Configure AI if enabled\n        self.configure_ai(\u0026config)?;\n\n        // Initialize database schema\n        self.initialize_database_schema().await?;\n\n        // Create analysis run record\n        let mut analysis_run = self\n            .database\n            .create_analysis_run(\u0026config.target_path)\n            .context(\"Failed to create analysis run\")?;\n\n        // Execute core analysis\n        let (mut issues, _dependency_graph) = self\n            .analysis_engine\n            .analyze(\u0026config.target_path)\n            .await\n            .context(\"Analysis failed\")?;\n\n        // Plugin system removed in community version\n        info!(\"Plugin analysis skipped (not available in community version)\");\n\n        // Enhance with AI analysis if enabled\n        let ai_enhanced = if config.enable_ai {\n            info!(\"Starting AI analysis enhancement\");\n            self.enhance_with_ai_analysis(\u0026mut issues).await?;\n            info!(\"AI analysis enhancement completed\");\n            true\n        } else {\n            info!(\"AI analysis disabled, skipping enhancement\");\n            false\n        };\n        info!(\"AI analysis phase completed\");\n\n        // Update analysis run record\n        info!(\"Starting analysis run finalization\");\n        let analysis_duration = start_time.elapsed();\n        self.finalize_analysis_run(\u0026mut analysis_run, \u0026issues, analysis_duration)\n            .await?;\n        info!(\"Analysis run finalization completed\");\n\n        // Store results\n        info!(\"Starting to store {} issues to database\", issues.len());\n\n        // Set the correct analysis_run_id for all issues\n        let analysis_run_id = analysis_run.run_id.expect(\"Analysis run should have an ID\");\n        for issue in \u0026mut issues {\n            issue.analysis_run_id = analysis_run_id;\n        }\n\n        self.database\n            .store_issues(\u0026issues)\n            .context(\"Failed to store analysis issues\")?;\n        info!(\"Issues stored to database successfully\");\n\n        // Generate report\n        let report_content = self.generate_report(\u0026config, \u0026analysis_run, \u0026issues)?;\n\n        // Write output file if specified\n        if let Some(output_path) = \u0026config.output_file {\n            std::fs::write(output_path, \u0026report_content).context(format!(\n                \"Failed to write report to {}\",\n                output_path.display()\n            ))?;\n            info!(\"Report written to: {}\", output_path.display());\n        }\n\n        Ok(AnalysisReport {\n            content: report_content,\n            metadata: AnalysisMetadata {\n                files_analyzed: self.analysis_engine.get_files_analyzed() as usize,\n                issues_found: issues.len(),\n                analysis_duration,\n                ai_enhanced,\n            },\n        })\n    }\n\n    /// Configure AI providers based on the provided configuration\n    fn configure_ai(\u0026mut self, config: \u0026AnalysisConfig) -\u003e Result\u003c(), UveddiError\u003e {\n        if config.enable_ai {\n            {\n                let ollama_api_url = config\n                    .ollama_api_url\n                    .clone()\n                    .or_else(|| std::env::var(\"OLLAMA_API_URL\").ok())\n                    .unwrap_or_else(|| \"http://localhost:11434\".to_string());\n                let ollama_model = config\n                    .ollama_model\n                    .clone()\n                    .or_else(|| std::env::var(\"OLLAMA_MODEL\").ok())\n                    .unwrap_or_else(|| \"deepseek-coder:6.7b-instruct-q4_0\".to_string());\n                // self.ai_engine = self.ai_engine.clone().with_ollama(\u0026ollama_model, \u0026ollama_api_url);\n                // Placeholder: set Ollama model and API URL if needed\n                info!(\n                    \"AI analysis enabled with local Ollama model: {ollama_model} at {ollama_api_url}\"\n                );\n            }\n        }\n        Ok(())\n    }\n\n    /// Initialize database schema with anti-pattern types\n    async fn initialize_database_schema(\u0026mut self) -\u003e Result\u003c(), UveddiError\u003e {\n        for mut anti_pattern_type in self.analysis_engine.get_anti_pattern_types() {\n            self.database\n                .store_anti_pattern_type(\u0026mut anti_pattern_type)\n                .context(\"Failed to store anti-pattern type\")?;\n        }\n        Ok(())\n    }\n\n    /// Enhance analysis results with AI insights\n    async fn enhance_with_ai_analysis(\n        \u0026mut self,\n        issues: \u0026mut Vec\u003cArchitecturalIssue\u003e,\n    ) -\u003e Result\u003c(), UveddiError\u003e {\n        info!(\"Enhancing issues with AI analysis...\");\n        for issue in issues.iter_mut() {\n            self.ai_engine\n                .analyze_issue(issue)\n                .await\n                .context(\"Failed to enhance issue with AI analysis\")?;\n            info!(\"AI analysis placeholder for issue in {}\", issue.file_path);\n        }\n        Ok(())\n    }\n\n    /// Finalize the analysis run record\n    async fn finalize_analysis_run(\n        \u0026mut self,\n        analysis_run: \u0026mut AnalysisRun,\n        issues: \u0026[ArchitecturalIssue],\n        _duration: std::time::Duration,\n    ) -\u003e Result\u003c(), UveddiError\u003e {\n        analysis_run.total_files_analyzed = Some(self.analysis_engine.get_files_analyzed());\n        analysis_run.total_issues_found = Some(issues.len() as i32);\n        analysis_run.end_time = Some(Utc::now());\n        analysis_run.status = \"completed\".to_string();\n\n        self.database\n            .update_analysis_run(analysis_run)\n            .context(\"Failed to update analysis run\")?;\n        Ok(())\n    }\n\n    /// Generate the final report\n    fn generate_report(\n        \u0026self,\n        config: \u0026AnalysisConfig,\n        analysis_run: \u0026AnalysisRun,\n        issues: \u0026[ArchitecturalIssue],\n    ) -\u003e Result\u003cString, UveddiError\u003e {\n        match config.output_format.as_str() {\n            \"json\" =\u003e {\n                let report = self\n                    .report_generator\n                    .generate_json_report(analysis_run, issues, \u0026HashMap::new(), None)\n                    .map_err(|e| crate::error::UveddiError::ReportGeneration(e))?;\n                Ok(report.to_string())\n            }\n            \"markdown\" =\u003e self\n                .report_generator\n                .generate_markdown_report(analysis_run, issues, \u0026HashMap::new(), None)\n                .map_err(|e| crate::error::UveddiError::ReportGeneration(e)),\n            _ =\u003e Err(UveddiError::UnsupportedOutputFormat(\n                config.output_format.clone(),\n            ))\n            .context(\"Unsupported output format specified\")?,\n        }\n    }\n}\n\nimpl Default for AnalysisOrchestrator {\n    fn default() -\u003e Self {\n        Self::new().expect(\"Failed to create default AnalysisOrchestrator\")\n    }\n}\n\n/// Runs the main application orchestration logic, handling CLI commands and error context.\npub fn run_app() -\u003e Result\u003c(), UveddiError\u003e {\n    use crate::cli::{analyze_command::AnalyzeCommand, config_command::ConfigCommand};\n    use clap::Parser;\n    use log::{error, info};\n\n    #[derive(Parser)]\n    #[command(name = \"uveddi\")]\n    #[command(about = \"A Rust-based code analysis and exploration tool\", long_about = None)]\n    struct Cli {\n        #[command(subcommand)]\n        command: Commands,\n    }\n\n    #[derive(clap::Subcommand)]\n    enum Commands {\n        Analyze(AnalyzeCommand),\n        Config(ConfigCommand),\n    }\n\n    let cli = Cli::parse();\n    let result = match cli.command {\n        Commands::Analyze(command) =\u003e {\n            info!(\"Executing analyze command...\");\n            tokio::runtime::Runtime::new()?\n                .block_on(command.execute())\n                .map_err(|e| UveddiError::Analysis(e.to_string()))\n        }\n        Commands::Config(command) =\u003e {\n            info!(\"Executing config command...\");\n            command\n                .execute()\n                .map_err(|e| UveddiError::Configuration(e.to_string()))\n        }\n    };\n    if let Err(e) = result {\n        error!(\"Error: {e:?}\");\n        return Err(e);\n    }\n    Ok(())\n}\n","traces":[{"line":58,"address":[4044586,4044567,4043456],"length":1,"stats":{"Line":0}},{"line":59,"address":[4043489],"length":1,"stats":{"Line":0}},{"line":61,"address":[4043881,4043821],"length":1,"stats":{"Line":0}},{"line":63,"address":[4044096],"length":1,"stats":{"Line":0}},{"line":64,"address":[4044159,4044219],"length":1,"stats":{"Line":0}}, fn new() -\u003e Result\u003cSelf, AstError\u003e {\n        let mut parsers = HashMap::new();\n        let mut rust_parser = Parser::new();\n        rust_parser.set_language(\u0026tree_sitter_rust::language())?;\n        parsers.insert(SourceLanguage::Rust, rust_parser);\n\n        let mut python_parser = Parser::new();\n        python_parser.set_language(\u0026tree_sitter_python::language())?;\n        parsers.insert(SourceLanguage::Python, python_parser);\n\n        let mut javascript_parser = Parser::new();\n        javascript_parser.set_language(\u0026tree_sitter_javascript::language())?;\n        parsers.insert(SourceLanguage::JavaScript, javascript_parser);\n\n        Ok(AstParser {\n            parsers,\n            cache: Mutex::new(HashMap::new()),\n        })\n    }\n\n    /// Dynamically add a new language parser at runtime\n    pub fn add_language(\u0026mut self, lang: SourceLanguage, parser: Parser) {\n        self.parsers.insert(lang, parser);\n    }\n\n    /// Transform tree-sitter CST to custom AST (basic implementation for demonstration)\n    fn tree_to_custom_ast(\n        tree: \u0026Tree,\n        source: \u0026str,\n        language: \u0026SourceLanguage,\n    ) -\u003e Option\u003cCustomAst\u003e {\n        let root = tree.root_node();\n        let mut items = Vec::new();\n        match language {\n            SourceLanguage::Rust =\u003e {\n                // Collect structs and their methods\n                let mut structs: HashMap\u003cString, Vec\u003cString\u003e\u003e = HashMap::new();\n                let mut struct_names = Vec::new();\n                for child in root.children(\u0026mut root.walk()) {\n                    match child.kind() {\n                        \"struct_item\" =\u003e {\n                            if let Some(name_node) = child.child_by_field_name(\"name\") {\n                                let name = name_node\n                                    .utf8_text(source.as_bytes())\n                                    .unwrap_or(\"\")\n                                    .to_string();\n                                struct_names.push(name.clone());\n                                structs.insert(name, Vec::new());\n                            }\n                        }\n                        \"impl_item\" =\u003e {\n                            if let Some(type_node) = child.child_by_field_name(\"type\") {\n                                let type_name = type_node\n                                    .utf8_text(source.as_bytes())\n                                    .unwrap_or(\"\")\n                                    .to_string();\n                                let mut methods = Vec::new();\n                                if let Some(body_node) = child.child_by_field_name(\"body\") {\n                                    for decl in body_node.children(\u0026mut body_node.walk()) {\n                                        if decl.kind() == \"function_item\" {\n                                            if let Some(name_node) =\n                                                decl.child_by_field_name(\"name\")\n                                            {\n                                                let method_name = name_node\n                                                    .utf8_text(source.as_bytes())\n                                                    .unwrap_or(\"\")\n                                                    .to_string();\n                                                methods.push(method_name);\n                                            }\n                                        }\n                                    }\n                                }\n                                structs.entry(type_name).or_default().extend(methods);\n                            }\n                        }\n                        _ =\u003e {}\n                    }\n                }\n                // Build CustomAst::Struct for each struct\n                for (name, methods) in structs {\n                    items.push(CustomAst::Struct { name, methods });\n                }\n            }\n            SourceLanguage::Python | SourceLanguage::JavaScript =\u003e {\n                // Fallback: keep previous logic for now\n                for child in root.children(\u0026mut root.walk()) {\n                    match (language, child.kind()) {\n                        (SourceLanguage::Python, \"class_definition\")\n                        | (SourceLanguage::JavaScript, \"class_declaration\") =\u003e {\n                            if let Some(name_node) = child.child_by_field_name(\"name\") {\n                                let name = name_node\n                                    .utf8_text(source.as_bytes())\n                                    .unwrap_or(\"\")\n                                    .to_string();\n                                items.push(CustomAst::Variable { name });\n                            }\n                        }\n                        _ =\u003e {}\n                    }\n                }\n            }\n        }\n        Some(CustomAst::File { items })\n    }\n\n    /// Parse file and extract dependencies (ER-F-003), with AST caching.\n    /// Returns a parsed AST for the file, using cache if available.\n    /// Errors if the file cannot be parsed or language is unsupported.\n    pub fn parse_file(\u0026mut self, file_path: \u0026Path) -\u003e Result\u003cParsedFile, AstError\u003e {\n        let path_str = file_path.to_string_lossy().to_string();\n        let modified_time = fs::metadata(file_path)?.modified()?;\n\n        if let Some(cached) = self.cache.lock()\n            .map_err(|_| AstError::Other(\"Cache lock poisoned\".to_string()))?\n            .get(\u0026path_str) {\n            if cached.modified_at == modified_time {\n                return Ok(cached.clone());\n            }\n        }\n\n        // Try disk cache\n        let cache_path = ParsedFile::cache_path(file_path);\n        if let Ok(mut f) = fs::File::open(\u0026cache_path) {\n            let mut buf = Vec::new();\n            f.read_to_end(\u0026mut buf).ok();\n            if let Ok(mut parsed) = bincode::deserialize::\u003cParsedFile\u003e(\u0026buf) {\n                if parsed.modified_at == modified_time {\n                    // Re-parse the AST since Tree is not serializable\n                    let parser = self.parsers.get_mut(\u0026parsed.language).ok_or_else(|| {\n                        AstError::UnsupportedLanguage(format!(\"{:?}\", parsed.language))\n                    })?;\n                    let tree = parser\n                        .parse(\u0026parsed.source, None)\n                        .ok_or(AstError::ParseFailed)?;\n                    parsed.tree = Some(tree);\n\n                    self.cache\n                        .lock()\n                        .unwrap()\n                        .insert(path_str.clone(), parsed.clone());\n                    return Ok(parsed);\n                }\n            }\n        }\n\n        // Parse and cache\n        let source = fs::read_to_string(file_path)?;\n        let language = self.detect_language(file_path)?;\n        let parser = self\n            .parsers\n            .get_mut(\u0026language)\n            .ok_or_else(|| AstError::UnsupportedLanguage(format!(\"{language:?}\")))?;\n        let tree = parser.parse(\u0026source, None).ok_or(AstError::ParseFailed)?;\n        if tree.root_node().has_error() {\n            return Err(AstError::ParseFailed);\n        }\n        let custom_ast = Self::tree_to_custom_ast(\u0026tree, \u0026source, \u0026language);\n        let parsed = ParsedFile {\n            path: file_path.to_path_buf(),\n            language,\n            tree: Some(tree),\n            source: source.clone(),\n            custom_ast: custom_ast.clone(),\n            modified_at: modified_time,\n        };\n        let mut disk_parsed = parsed.clone();\n        disk_parsed.tree = uct { .. } =\u003e \"Struct\",\n            CustomAst::Function { .. } =\u003e \"Function\",\n            CustomAst::Variable { .. } =\u003e \"Variable\",\n        }\n    }\n\n    /// Extracts a relevant code snippet for the given issue context, if present.\n    pub fn extract_relevant_code(\u0026self, issue_context: \u0026str) -\u003e Option\u003cString\u003e {\n        // For demonstration, just return the name of the first struct/function/variable matching the context\n        match self {\n            CustomAst::File { items } =\u003e {\n                for item in items {\n                    if let Some(snippet) = item.extract_relevant_code(issue_context) {\n                        return Some(snippet);\n                    }\n                }\n                None\n            }\n            CustomAst::Struct { name, methods } =\u003e {\n                if issue_context.contains(name) {\n                    Some(format!(\"struct {name} {{ ... }}\\nmethods: {methods:?}\"))\n                } else {\n                    None\n                }\n            }\n            CustomAst::Function { name, params } =\u003e {\n                if issue_context.contains(name) {\n                    Some(format!(\"fn {}({}) {{ ... }}\", name, params.join(\", \")))\n                } else {\n                    None\n                }\n            }\n            CustomAst::Variable { name } =\u003e {\n                if issue_context.contains(name) {\n                    Some(format!(\"let {name} = ...;\"))\n                } else {\n                    None\n                }\n            }\n        }\n    }\n}\n\nimpl Default for CustomAst {\n    fn default() -\u003e Self {\n        CustomAst::File { items: vec![] }\n    }\n}\n\n#[derive(Debug, Clone, PartialEq, Eq, Hash, Serialize, Deserialize)]\npub enum SourceLanguage {\n    Rust,\n    Python,\n    JavaScript,\n}\n\n#[derive(Debug, thiserror::Error)]\npub enum AstError {\n    #[error(\"IO error: {0}\")]\n    Io(#[from d redundant AI API calls for similar code patterns\n//! - **Memory Optimization**: Intelligent cache eviction based on usage patterns\n//!\n//! # Usage Examples\n//!\n//! ```rust,no_run\n//! use uveddi::cache::result_cache::ResultCache;\n//!\n//! // Initialize cache\n//! let mut cache = ResultCache::new();\n//!\n//! // Cache analysis result\n//! let file_path = \"src/main.rs\";\n//! let analysis_result = /* ... */;\n//! cache.store_result(file_path, analysis_result);\n//!\n//! // Retrieve cached result\n//! if let Some(cached) = cache.get_result(file_path) {\n//!     println!(\"Using cached analysis for {}\", file_path);\n//! }\n//! ```\n//!\n//! # Cache Storage\n//!\n//! The caching system supports multiple storage backends:\n//! - **In-Memory**: Fast access for session-based caching\n//! - **File-Based**: Persistent cache across application restarts\n//! - **Database**: Integrated with SQLite for complex cache queries\n//!\n//! # Thread Safety\n//!\n//! All cache implementations are designed to be thread-safe and can be\n//! used safely across async tasks and concurrent analysis operations.\n\npub mod result_cache;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","cache","result_cache.rs"],"content":"use rusqlite::{Connection, Result};\nuse serde::{de::DeserializeOwned, Serialize};\nuse std::collections::hash_map::DefaultHasher;\nuse std::hash::{Hash, Hasher};\nuse std::path::Path;\n\npub struct ResultCache {\n    conn: Connection,\n}\n\nimpl ResultCache {\n    /// Creates a new persistent result cache using a file-based SQLite database.\n    ///\n    /// # Arguments\n    ///\n    /// * `db_path` - Path to the SQLite database file for caching.\n    ///\n    /// # Returns\n    ///\n    /// * `Ok(ResultCache)` - The initialized cache instance.\n    /// * `Err(rusqlite::Error)` - If the database cannot be opened or initialized.\n    pub fn new(db_path: \u0026Path) -\u003e Result\u003cSelf\u003e {\n        let conn = Connection::open(db_path)?;\n        conn.execute(\n            \"CREATE TABLE IF NOT EXISTS cache (\n                key TEXT PRIMARY KEY,\n                value BLOB NOT NULL,\n                timestamp DATETIME DEFAULT CURRENT_TIMESTAMP\n            )\",\n            [],\n        )?;\n        Ok(Self { conn })\n    }\n\n    /// Creates a new result cache using an in-memory SQLite database.\n    /// Useful for testing or ephemeral caching.\n    ///\n    /// # Returns\n    ///\n    /// * `Ok(ResultCache)` - The initialized in-memory cache.\n    /// * `Err(rusqlite::Error)` - If the database cannot be opened or initialized.\n    pub fn new_in_memory() -\u003e Result\u003cSelf\u003e {\n        let conn = Connection::open_in_memory()?;\n        conn.execute(\n            \"CREATE TABLE IF NOT EXISTS cache (\n                key TEXT PRIMARY KEY,\n                value BLOB NOT NULL,\n                timestamp DATETIME DEFAULT CURRENT_TIMESTAMP\n            )\",\n            [],\n        )?;\n        Ok(Self { conn })\n    }\n\n    fn hash_key\u003cT: Hash\u003e(key_data: \u0026T) -\u003e String {\n        let mut hasher = DefaultHasher::new();\n        key_data.hash(\u0026mut hasher);\n        hasher.finish().to_string()\n    }\n\n    /// Retrieves a cached value for the given key, if present.\n    ///\n    /// # Type Parameters\n    ///\n    /// * `K` - Key type (must implement `Hash`)\n    /// * `V` - Value type (must implement `DeserializeOwned`)\n    ///\n    /// # Arguments\n    ///\n    /// * `key_data` - Reference to the key data to look up.\n    ///\n    /// # Returns\n    ///\n    /// * `Ok(Some(value))` - Cached value if present.\n    /// * `Ok(None)` - If no value is cached for the key.\n    /// * `Err(rusqlite::Error)` - If the query or deserialization fails.\n    pub fn get\u003cK: Hash, V: DeserializeOwned\u003e(\u0026self, key_data: \u0026K) -\u003e Result\u003cOption\u003cV\u003e\u003e {\n        let key = Self::hash_key(key_data);\n        let mut stmt = self\n            .conn\n            .prepare(\"SELECT value FROM cache WHERE key = ?1\")?;\n        let mut rows = stmt.query_map([\u0026key], |row| {\n            let value: Vec\u003cu8\u003e = row.get(0)?;\n            Ok(value)\n        })?;\n\n        if let Some(result) = rows.next() {\n            let value_blob = result?;\n            let value: V = bincode::deserialize(\u0026value_blob)\n                .map_err(|e| rusqlite::Error::ToSqlConversionFailure(e.into()))?;\n            return Ok(Some(value));\n        }\n\n        Ok(None)\n    }\n\n    /// Stores a value in the cache for the given key.\n    ///\n    /// # Type Parameters\n    ///\n    /// * `K` - Key type (must implement `Hash`)\n    /// * `V` - Value type (must implement `Serialize`)\n    ///\n    /// # Arguments\n    ///\n    /// * `key_data` - Reference to the key data to use as the cache key.\n    /// * `value` - Reference to the value to cache.\n    ///\n    /// # Returns\n    ///\n    /// * `Ok(())` - If the value is successfully cached.\n    /// * `Err(rusqlite::Error)` - If the insert or serialization fails.\n    pub fn set\u003cK: Hash, V: Serialize\u003e(\u0026self, key_data: \u0026K, value: \u0026V) -\u003e Result\u003c()\u003e {\n        let key = Self::hash_key(key_data);\n        let value_blob = bincode::serialize(value)\n            .map_err(|e| rusqlite::Error::ToSqlConversionFailure(e.into()))?;\n        self.conn.execute(\n            \"INSERT OR REPLACE INTO cache (key, value) VALUES (?1, ?2)\",\n            rusqlite::params![key, value_blob],\n        )?;\n        Ok(())\n    }\n}\n","traces":[{"line":22,"address":[3695456,3696129,3696123],"length":1,"stats":{"Line":0}},{"line":23,"address":[3695488],"length":1,"stats":{"Line":0}},{"line":24,"address":[3695837,3695969,3695760],"length":1,"stats":{"Line":0}},{"line":32,"address":[3696011],"length":1,"stats":{"Line":0}},{"line":42,"address":[3696144,3696800,3696794],"length":1,"stats":{"Line":0}},{"l rc","cli","analyze_command.rs"],"content":"//! Analyze Command Implementation\n//!\n//! This module implements the `analyze` subcommand for the Uveddi CLI.\n//! The analyze command performs comprehensive code analysis on a given path,\n//! optionally integrating AI-powered insights and generating reports.\n//!\n//! # Features\n//!\n//! - Multi-format output (text, JSON, markdown)\n//! - AI-powered analysis with Ollama integration\n//! - Configurable output destinations\n//! - Environment variable support for configuration\n//!\n//! # Usage\n//!\n//! ```bash\n//! # Basic analysis\n//! uveddi analyze ./src\n//!\n//! # With AI analysis\n//! uveddi analyze ./src --enable-ai\n//!\n//! # Custom output format and file\n//! uveddi analyze ./src --output-format json --output analysis.json\n//!\n//! # Using environment variables for Ollama\n//! OLLAMA_API_URL=http://localhost:11434 OLLAMA_MODEL=deepseek-coder uveddi analyze ./src --enable-ai\n//! ```\n\nuse anyhow::Context;\nuse clap::Args;\nuse log::info;\nuse std::path::PathBuf;\n\nuse crate::application::{AnalysisConfig, AnalysisOrchestrator};\nuse crate::error::UveddiError;\n\n/// Command-line arguments for the analyze subcommand\n///\n/// This struct defines all the command-line options available for the\n/// `analyze` command, including input paths, output configuration,\n/// and AI integration settings.\n#[derive(Args)]\npub struct AnalyzeCommand {\n    /// Path to the project or directory to analyze\n    ///\n    /// Can be a file or directory. When analyzing a directory,\n    /// all supported source files will be recursively processed.\n    pub path: PathBuf,\n\n    /// Output format for the analysis report\n    ///\n    /// Supported formats:\n    /// - `text`: Plain text format for terminal output\n    /// - `json`: Structured JSON format for programmatic consumption\n    /// - `markdown`: Markdown format for documentation\n    #[arg(long, default_value = \"markdown\")]\n    pub output_format: String,\n\n    /// Optional output file path\n    ///\n    /// If not specified, the report will be written to stdout.\n    /// The file extension should match the chosen output format.\n    #[arg(long)]\n    pub output: Option\u003cPathBuf\u003e,\n\n    /// Enable AI-powered analysis and explanations\n    ///\n    /// When enabled, the analysis will include AI-generated explanations\n    /// for detected issues and architectural recommendations.\n    /// Requires either an API key or a local Ollama instance.\n    #[arg(long)]\n    pub enable_ai: bool,\n\n    /// Ollama API URL for local AI analysis\n    ///\n    /// Used when `--enable-ai` is specified and you want to use\n    /// a local Ollama instance instead of external AI services.\n    ///\n    /// Can also be set via the `OLLAMA_API_URL` environment variable.\n    #[arg(long, env = \"OLLAMA_API_URL\")]\n    pub ollama_api_url: Option\u003cString\u003e,\n\n    /// Ollama model name for local AI analysis\n    ///\n    /// Specifies which Ollama model to use for analysis.\n    /// Common options include \"deepseek-coder:6.7b-instruct-q4_0\",\n    /// \"codellama:7b-instruct\", etc.\n    ///\n    /// Can also be set via the `OLLAMA_MODEL` environment variable.\n    #[arg(long, env = \"OLLAMA_MODEL\")]\n    pub ollama_model: Option\u003cString\u003e,\n}\n\nimpl AnalyzeCommand {\n    /// Execute the analyze command with the provided arguments\n    ///\n    /// This method orchestrates the complete analysis workflow:\n    /// 1. Initialize the analysis orchestrator\n    /// 2. Configure analysis parameters\n    /// 3. Run the analysis\n    /// 4. Generate and output the report\n    ///\n    /// # Returns\n    ///\n    /// * `Ok(())` - Analysis completed successfully\n    /// * `Err(UveddiError)` - Analysis failed with specific error details\n    ///\n    /// # Errors\n    ///\n    /// This function will return an error if:\n    /// - The target path doesn't exist or isn't readable\n    /// - The analysis orchestrator cannot be initialized\n    /// - AI services are enabled but unavailable\n    /// - The output file cannot be written\n    /// - Internal analysis errors occur\n    ///\n    /// # Examples\n    ///\n    /// ```rust,no_run\n    /// use uveddi::cli::analyze_command::AnalyzeCommand;\n    /// use std::path::PathBuf;\n    ///\n    /// let command = AnalyzeCommand {\n    ///     path: PathBuf::from(\"./src\"),\n    ///     output_format: \"markdown\".to_string(),\n    ///     output: None,\n    ///     enable_ai: false,\n    ///     ollama_api_url: None,\n    ///     ollama_model: None,\n    /// };\n    ///\n    /// # tokio_test::block_on(async {\n    /// command.execute().await?;\n    /// # Ok::\u003c(), uveddi::error::UveddiError\u003e(())\n    /// # });\n    /// ```\n    pub async fn execute(\u0026self) -\u003e Result\u003c(), UveddiError\u003e {\n        info!(\"Starting analysis of: {}\", self.path.display());\n\n        // Create application layer orchestrator\n        let mut orchestrator =\n            AnalysisOrchestrator::new().context(\"Failed to initialize analysis orchestrator\")?;\n\n        // Configure analysis parameters\n        let config = AnalysisConfig {\n            target_path: self.path.clone(),\n            output_format: self.output_format.clone(),\n            output_file: self.output.clone(),\n            enable_ai: self.enable_ai,\n            ollama_api_url: self.ollama_api_url.clone(),\n            ollama_model: self.ollama_model.clone(),\n        };\n\n        // Execute analysis through application layer\n        let report = orchestrator\n            .execute_analysis(config)\n            .await\n            .context(\"Analysis execution failed\")?;\n\n        // Output results\n        if self.output.is_none() {\n            println!(\"{}\", report.content);\n        }\n\n        // Log summary\n        info!(\n            \"Analysis completed: {} files analyzed, {} issues found, AI enhanced: {}\",\n            report.metadata.files_analyzed,\n            report.metadata.issues_found,\n            report.metadata.ai_enhanced\n        );\n\n        Ok(())\n    }\n}\n","traces":[{"line":138,"address":[3548190,3548128,3548315,3549770,3548358,3549705],"length":1,"stats":{"Line":0}},{"line":139,"address":[3548443,3548270,3548415],"length":1,"stats":{"Line":0}},{"line":142,"address":[3548791,3549711,3548421],"length":1,"stats":{"Line":0}},{"line":147,"address":[3549013],"length":1,"stats":{"Line":0}},{"line":148,"address":[3549088],"length":1,"stats":{"Line":0}},{"line":149,"address":[3549164],"length":1,"stats":{"Line":0}},{"line":150,"address":[3549240],"length":1,"stats":{"Line":0}},{"line":151,"address":[3549259],"length":1,"stats":{"Line":0}},{"line":152,"address":[3549323],"length":1,"stats":{"Line":0}},{"line":156,"address":[3549572,3550194,3549638,3550075,3549953],"length":1,"stats":{"Line":0}},{"line":158,"address":[3550049,3549671,3549796,3549611,3548345],"length":1,"stats":{"Line":0}},{"line":162,"address":[3550351,3550430],"length":1,"stats":{"Line":0}},{"line":163,"address":[3550478],"length":1,"stats":{"Line":0}},{"line":167,"address":[3550436,3550623,3550583],"length":1,"stats":{"Line":0}},{"line":174,"address":[3550589],"length":1,"stats":{"Line":0}}],"covered":0,"coverable":15},{"path":["/","home","austingreen","Documents","botzr","projects","uveddi","src","cli","config_command.rs"],"content":"use crate::config::Config;\nuse clap::{Args, Subcommand};\nuse std::fs;\nuse std::io::Write;\nuse std::path::PathBuf;\n\n#[derive(Subcommand)]\npub enum ConfigSubcommand {\n    /// Show the current configuration (from file or environment)\n    Show {\n        /// Optional path to config file\n        #[arg(long)]\n        file: Option\u003cPathBuf\u003e,\n    },\n    /// Set a configuration value in the config file\n    Set {\n        /// Config key (e.g. openai_api_key)\n        key: String,\n        /// Config value\n        value: String,\n        /// Path to config file\n        #[arg(long, default_value = \"uveddi.toml\")]\n        file: PathBuf,\n    },\n    /// Validate the configuration file\n    Validate {\n        /// Optional path to config file\n        #[arg(long)]\n        file: Option\u003cPathBuf\u003e,\n    },\n}\n\n#[derive(Args)]\npub struct ConfigCommand {\n    #[command(subcommand)]\n    pub command: ConfigSubcommand,\n}\n\nimpl ConfigCommand {\n    pub fn execute(\u0026self) -\u003e Result\u003c(), String\u003e {\n        match \u0026self.command {\n            ConfigSubcommand::Show { file } =\u003e {\n                if let Some(path) = file {\n                    match Config::from_file(path.to_str().unwrap()) {\n                        Ok(cfg) =\u003e println!(\"{cfg:?}\"),\n                        Err(e) =\u003e return Err(format!(\"Failed to load config: {e}\")),\n                    }\n                } else {\n                    match Config::from_env() {\n                        Ok(cfg) =\u003e println!(\"{cfg:?}\"),\n                        Err(e) =\u003e return Err(format!(\"Failed to load config from env: {e}\")),\n                    }\n                }\n            }\n            ConfigSubcommand::Set { key, value, file } =\u003e {\n                let mut config = match Config::from_file(file.to_str().unwrap()) {\n                    Ok(cfg) =\u003e cfg,\n                    Err(_) =\u003e Config { ollama_model: None },\n                };\n                match key.as_str() {\n                    \"ollama_model\" =\u003e config.ollama_model = Some(value.clone()),\n                    _ =\u003e return Err(\"Unknown config key\".to_string()),\n                }\n                let toml = toml::to_string_pretty(\u0026config).map_err(|e| e.to_string())?;\n                let mut file_handle = fs::File::create(file).map_err(|e| e.to_string())?;\n                file_handle\n                    .write_all(toml.as_bytes())\n                    .map_err(|e| e.to_string())?;\n                println!(\"Config updated in {}\", file.display());\n            }\n            ConfigSubcommand::Validate { file } =\u003e {\n                let path = file\n                    .as_ref()\n                    .map(|p| p.to_str().unwrap())\n                    .unwrap_or(\"uveddi.toml\");\n                match Config::from_file(path) {\n                    Ok(_) =\u003e println!(\"Config is valid.\"),\n                    Err(e) =\u003e return Err(format!(\"Config validation failed: {e}\")),\n                }\n            }\n        }\n        Ok(())\n    }\n}\n","traces":[{"line":40,"address":[4189296,4190164,4190158],"length":1,"stats":{"Line":0}},{"line":41,"address":[4189326],"length":1,"stats":{"Line":0}},{"line":42,"address":[4189401],"length":1,"stats":{"Line":0}},{"line":43,"address":[4189751,4189421],"length":1,"stats":{"Line":0}},{"line":44,"address":[4189759],"length":1,"stats":{"Line":0}},{"line":45,"address":[4189949],"length":1,"stats":{"Line":0}},{"line":46,"address":[4189887,4190177],"length":1,"stats":{"Line":0}},{"line":49,"address":[4189850],"length":1,"stats":{"Line":0}},{"line":50,"address":[4190447],"length":1,"stats":{"Line":0}},{"line":51,"address":[4190385,4190638],"length":1,"stats":{"Line":0}},{"line":55,"address":[4189468],"length":1,"stats":{"Line":0}},{"line":56,"address":[4189513],"length":1,"stats":{"Line":0}},{"line":57,"address":[4190909],"length":1,"stats":{"Line":0}},{"line":60,"address":[4191066],"length":1,"stats":{"Line":0}},{"line":61,"address":[4191335,4191284,4191137,4191206],"length":1,"stats":{"Line":0}},{"line":62,"address":[4191230,4191170],"length":1,"stats":{"Line":0}},{"line":64,"address":[3276912,3276896],"length":1,"stats":{"Line":0}},{"line":65,"address":[3276992,3277008],"length":1,"stats":{"Line":0}},{"line":66,"address":[4191992,4192141],"length":1,"stats":{"Line":0}},{"line":67,"address":[4191921],"length":1,"stats":{"Line":0}},{"line":68,"address":[3277104,3277120],"length":1,"stats":{"Line":0}},{"line":69,"address":[4192175],"length":1,"stats":{"Line":0}},{
