# Plugin manifest for the Excessive Comments detector

name = "excessive-comments"
version = "1.0.0"
author = "Uveddi Team"
description = "Detects files with excessive comment density that may indicate over-documentation or poor code clarity"

# Required permissions
permissions = [
    "Logging",
    "ConfigRead",
]

# Supported programming languages
supported_languages = [
    "rust",
    "javascript", 
    "typescript",
    "python",
]

# Anti-pattern types this plugin detects
anti_pattern_types = [
    "excessive-comments",
]

# Optional: Digital signature for verification (would be added during signing)
# signature = "..."