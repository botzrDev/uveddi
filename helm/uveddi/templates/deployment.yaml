{{- include "uveddi.validateValues" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uveddi.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "uveddi.labels" . | nindent 4 }}
    {{- include "uveddi.environmentLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "uveddi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "uveddi.selectorLabels" . | nindent 8 }}
        {{- include "uveddi.environmentLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        config/checksum: {{ include "uveddi.configChecksum" . }}
    spec:
      serviceAccountName: {{ include "uveddi.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      securityContext:
        {{- include "uveddi.podSecurityContext" . | nindent 8 }}
      
      {{- if .Values.initContainers.waitForDatabase.enabled }}
      initContainers:
      - name: wait-for-database
        image: {{ .Values.initContainers.waitForDatabase.image }}
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for database to be ready..."
          {{- if .Values.postgresql.enabled }}
          until nc -z {{ include "postgresql.primary.fullname" .Subcharts.postgresql }} {{ .Values.postgresql.primary.service.ports.postgresql }}; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          {{- end }}
          {{- if .Values.redis.enabled }}
          until nc -z {{ include "redis.fullname" .Subcharts.redis }}-master {{ .Values.redis.master.service.ports.redis }}; do
            echo "Waiting for Redis..."
            sleep 2
          done
          {{- end }}
          echo "Dependencies are ready"
        securityContext:
          {{- toYaml .Values.initContainers.waitForDatabase.securityContext | nindent 10 }}
      {{- end }}
      
      containers:
      - name: {{ .Chart.Name }}
        image: {{ include "uveddi.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        
        ports:
        - name: http
          containerPort: {{ .Values.app.ports.http }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.app.ports.metrics }}
          protocol: TCP
        
        env:
        {{- if .Values.env }}
        {{- toYaml .Values.env | nindent 8 }}
        {{- end }}
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        
        {{- if or .Values.envFrom (not .Values.externalSecrets.enabled) }}
        envFrom:
        {{- if .Values.envFrom }}
        {{- toYaml .Values.envFrom | nindent 8 }}
        {{- end }}
        {{- if not .Values.externalSecrets.enabled }}
        - configMapRef:
            name: {{ include "uveddi.fullname" . }}-config
        - secretRef:
            name: {{ include "uveddi.fullname" . }}-secrets
        {{- end }}
        {{- end }}
        
        securityContext:
          {{- include "uveddi.securityContext" . | nindent 10 }}
        
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        
        startupProbe:
          {{- toYaml .Values.startupProbe | nindent 10 }}
        
        resources:
          {{- include "uveddi.resources" . | nindent 10 }}
        
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        {{- if .Values.persistence.enabled }}
        - name: data
          mountPath: /app/data
        {{- end }}
        - name: cache
          mountPath: /app/cache
        - name: logs
          mountPath: /app/logs
        - name: tmp
          mountPath: /tmp
        - name: var-tmp
          mountPath: /var/tmp
        {{- with .Values.additionalVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      
      volumes:
      - name: config
        configMap:
          name: {{ include "uveddi.fullname" . }}-config
          defaultMode: 0644
      {{- if .Values.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "uveddi.fullname" . }}-data
      {{- end }}
      - name: cache
        emptyDir:
          sizeLimit: {{ .Values.app.config.performance.cacheSizeMb }}Mi
      - name: logs
        emptyDir:
          sizeLimit: 2Gi
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: var-tmp
        emptyDir:
          sizeLimit: 1Gi
      {{- with .Values.additionalVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      
      {{- include "uveddi.nodeSelector" . | nindent 6 }}
      {{- include "uveddi.tolerations" . | nindent 6 }}
      {{- include "uveddi.affinity" . | nindent 6 }}
      
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30