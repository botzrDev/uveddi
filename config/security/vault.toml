# HashiCorp Vault Configuration for Uveddi
# This configuration file defines how Uveddi connects to HashiCorp Vault
# for secure credential management.

[vault]
# Vault server URL
# Environment variable override: VAULT_ADDR
url = "${VAULT_ADDR:-http://localhost:8200}"

# Vault authentication token
# Environment variable override: VAULT_TOKEN
# NOTE: This should be provided via environment variable, not hardcoded
token = "${VAULT_TOKEN}"

# Mount path for the KV v2 secrets engine
mount_path = "secret"

# Connection timeout in seconds
timeout_seconds = 30

# Enable TLS verification
verify_tls = true

# TLS CA certificate path (optional)
# ca_cert_path = "/path/to/ca.pem"

# Client certificate for mTLS (optional)
# client_cert_path = "/path/to/client.pem"
# client_key_path = "/path/to/client-key.pem"

[secrets]
# Secret rotation configuration
enable_rotation = true
rotation_interval_days = 90
notification_days_before = 7

# Secret paths in Vault
jwt_secret_path = "jwt_secret"
database_url_path = "database_url"
oauth_client_secrets_prefix = "oauth"
oidc_client_secrets_prefix = "oidc"

# Fallback configuration
enable_env_fallback = true
env_prefix = "UVEDDI_SECRET"

[policies]
# JWT secret rotation policy
[[policies.rotation]]
key_pattern = "jwt"
rotation_interval_days = 90
notification_days_before = 7
auto_rotate = false

# OAuth secrets rotation policy
[[policies.rotation]]
key_pattern = "oauth"
rotation_interval_days = 365
notification_days_before = 30
auto_rotate = false

# Database credentials rotation policy
[[policies.rotation]]
key_pattern = "database"
rotation_interval_days = 180
notification_days_before = 14
auto_rotate = false

[health_check]
# Health check configuration
enabled = true
interval_seconds = 300
secret_key = "health_check"
timeout_seconds = 10

[logging]
# Audit logging for secret access
log_secret_access = true
log_rotation_events = true
log_health_checks = false